[package]
name = "reovim-depgraph"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Generic dependency resolution via Kahn's topological sort"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# None — this crate uses only std collections (HashMap, HashSet, VecDeque).
# Generic over any key type K: Eq + Hash + Clone + Debug.

[dev-dependencies]
cargo_metadata = "0.23"
walkdir = "2"

# Used by `vtable_layout_byte_size_stable.rs` to assert the FFI
# ChromeSurface vtable layout (FfiRenderSurface + FfiRenderSurfaceHost)
# has not drifted since Plan 24. Dev-dep only — does not pollute the
# dependency graph at build time.
reovim-client-driver = { workspace = true }

# Used by `cell_view_half_block_exists.rs` to smoke-compile the Flight 74
# public API surface (`BackendRasterOutput`, `HalfBlockRasterizer`).
reovim-ext-client-tui-cap-cell-view = { workspace = true }
