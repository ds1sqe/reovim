[package]
name = "reovim-server"
version = "0.9.3-dev"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Reovim server - the editing engine"
repository.workspace = true
homepage.workspace = true

[features]
default = []
grpc = ["reovim-protocol/grpc", "dep:tonic"]

[dependencies]
# Core crates
reovim-kernel = { workspace = true }
reovim-protocol = { workspace = true }
reovim-arch = { workspace = true }

# Drivers
reovim-driver-command = { workspace = true }
reovim-driver-command-types = { workspace = true }
reovim-driver-display = { workspace = true }
reovim-driver-input = { workspace = true }
reovim-driver-vfs = { workspace = true }

# Async
tokio = { workspace = true, features = ["full", "sync", "rt-multi-thread"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }

# Concurrency
arc-swap = "1.7"
parking_lot = "0.12"

# gRPC (optional)
tonic = { version = "0.12", optional = true }

[dev-dependencies]
tempfile = "3.0"
reovim-driver-buffer = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
