[package]
name = "reovim-driver-display"
version = "0.9.0-dev"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Display driver for reovim (frame buffer, compositor, windows)"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# Kernel layer
reovim-kernel = { path = "../../kernel", version = "0.9.0-dev" }

# Platform abstraction (provides Color type)
reovim-arch = { path = "../../arch", version = "0.9.0-dev" }

# Unicode width detection for wide characters (CJK, emoji)
unicode-width = "0.2"
