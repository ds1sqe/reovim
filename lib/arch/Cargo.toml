[package]
name = "reovim-arch"
version = "0.9.2-dev"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Platform abstraction layer for reovim (Linux arch/ equivalent)"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

# Platform-optimized primitives and abstractions
[dependencies]
# Lock-free data structures for hot paths
arc-swap = "1.8"

# Faster synchronization primitives
parking_lot = "0.12.3"

# Platform-specific directory paths (XDG on Unix, AppData on Windows)
dirs = "5.0"

[target.'cfg(unix)'.dependencies]
crossterm.workspace = true
# Unix socket support for local transport
tokio = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Named pipe support for local transport
tokio = { workspace = true }
