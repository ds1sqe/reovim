[package]
name = "reovim-lib-ds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Portable heap-DS algorithms (Seq, Map, Bytes, Mutex, RwLock, Condvar) reaching allocator/futex backends through injected uapi control tables"
publish = false

[dependencies]
# Product-facing memory-management controls. Heap-owning containers use an
# injected allocation control table instead of calling the down-face platform
# handle directly.
reovim-uapi-mm = { path = "../../uapi/inner/mm" }

# Product-facing scheduler/sync controls. The futex-backed lock primitives use
# an injected sync control table instead of calling the down-face platform handle
# directly.
reovim-uapi-sched = { path = "../../uapi/inner/sched" }

[lints]
workspace = true

[features]
# Selftest gating mirrors arch: the sibling `*_tests.rs` modules and the
# futex-slow-path test instrumentation compile only under `selftest`.
selftest = []
