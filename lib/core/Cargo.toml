[package]
name = "reovim-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core library for reovim text editor"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
reovim-sys.workspace = true
reovim-kernel = { path = "../kernel", version = "0.9.0-dev" }
reovim-driver-net = { path = "../drivers/net", version = "0.9.0-dev" }
futures.workspace = true
futures-timer.workspace = true
tokio.workspace = true
tracing.workspace = true
arboard = "3"
arc-swap = "1.8"
unicode-width = "0.2"

# Config system
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }

# Telescope (fuzzy finder)
nucleo = "0.5"
ignore = "0.4"
walkdir = "2.5"

# RPC (Server mode)
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
regex = "1"  # For ANSI stripping in tests
