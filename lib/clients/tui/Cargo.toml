[package]
name = "reovim-client-tui"
version = "0.9.3-dev"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Reovim TUI client - terminal user interface"
repository.workspace = true
homepage.workspace = true

[dependencies]
# Client core (connection, discovery, RPC, output)
reovim-client-core = { workspace = true }

# Protocol types
reovim-protocol = { workspace = true }

# Display driver (FrameBuffer, FrameRenderer, Style)
reovim-driver-display = { workspace = true }

# Platform abstraction (dirs)
reovim-arch = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "macros"] }
futures = { workspace = true }

# Terminal
crossterm = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# CLI arguments
clap = { workspace = true }

# Timestamps
chrono = { workspace = true }

# Logging
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
