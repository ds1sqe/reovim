[package]
name = "reovim-protocol"
version = "0.9.3-dev"  # v0.9.3 for gRPC v2 protocol (Epic #465)
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Wire protocol types for reovim client-server communication"
repository.workspace = true
homepage.workspace = true

[features]
default = []
grpc = ["dep:tonic", "dep:prost", "dep:tonic-build"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
reovim-kernel = { path = "../kernel", version = "0.9.2-dev" }
reovim-arch = { path = "../arch", version = "0.9.2-dev" }

# gRPC dependencies (feature-gated)
tonic = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }

[dev-dependencies]
tempfile = "3.0"

[build-dependencies]
tonic-build = { version = "0.12", optional = true }

[lints]
workspace = true
