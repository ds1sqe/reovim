[package]
name = "reovim-module-codec-cjk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "CJK encoding content codec module for reovim"
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
# Kernel layer - for Module trait
reovim-kernel = { workspace = true }
reovim-capabilities = { workspace = true }

# Driver layer - implements ContentCodec, ContentClassifier, ContentCodecFactory
reovim-driver-codec = { workspace = true }

# Module macros for FFI entry points
reovim-module-macros = { workspace = true }

# Encoding support
encoding_rs = { workspace = true }
reovim-subsys-vfs = { workspace = true }
reovim-domain-text = { workspace = true }

# Logging
tracing = { workspace = true }

[dev-dependencies]
reovim-testing = { workspace = true }

[features]
# Enable for building as standalone dynamic library
dynamic = []
