[package]
name = "reovim-module-explorer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "File explorer module for reovim - tree sidebar with file operations"
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["vim-keybindings"]
vim-keybindings = ["dep:reovim-module-vim"]
dynamic = [] # Enable FFI entry points for standalone dynamic loading

[dependencies]
reovim-module-vim = { workspace = true, optional = true }
reovim-kernel = { workspace = true }
reovim-driver-text-session = { workspace = true }
reovim-driver-command = { workspace = true }
reovim-subsys-command-types = { workspace = true }
reovim-subsys-content-codec = { workspace = true }
reovim-driver-text-input = { workspace = true }
reovim-subsys-vfs = { workspace = true }
reovim-module-macros = { workspace = true }
ignore = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
reovim-bench-utils = { workspace = true }
reovim-protocol = { workspace = true, features = ["grpc"] }
reovim-testing = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tonic = { workspace = true }

[[bench]]
name = "explorer_scroll"
harness = false

[lints]
workspace = true
