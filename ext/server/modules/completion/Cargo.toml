[package]
name = "reovim-module-completion"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Completion module for reovim - pluggable completion sources and popup state"
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["vim-keybindings"]
vim-keybindings = ["dep:reovim-module-vim"]
dynamic = [] # Enable FFI entry points for standalone dynamic loading

[dependencies]
reovim-module-vim = { workspace = true, optional = true }
reovim-kernel = { workspace = true }
reovim-domain-text = { workspace = true }
reovim-capabilities = { workspace = true }
reovim-driver-completion = { workspace = true }
reovim-driver-text-session = { workspace = true }
reovim-driver-command = { workspace = true }
reovim-driver-text-input = { workspace = true }
reovim-subsys-command-types = { workspace = true }
reovim-driver-text-lsp = { workspace = true }
reovim-module-macros = { workspace = true }
reovim-subsys-module-config = { workspace = true }
lsp-types = "0.97"
tokio = { workspace = true, features = ["rt"] }
serde_json = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
reovim-provider-text = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
