[package]
name = "reovim-module-clipboard"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Clipboard module for reovim - system clipboard access and yank history"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
# Kernel types
reovim-kernel = { workspace = true }

# Driver for ClipboardProvider trait (also owns the clipboard-provider capability string)
reovim-subsys-clipboard = { workspace = true }

# Platform abstraction for RwLock
reovim-arch = { workspace = true }

# Module macros for FFI entry points
reovim-module-macros = { workspace = true }

# System clipboard access
arboard.workspace = true

# Logging
tracing.workspace = true

[dev-dependencies]
reovim-testing = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[features]
# Enable for building as standalone dynamic library
dynamic = []
