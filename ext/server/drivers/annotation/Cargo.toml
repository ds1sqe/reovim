[package]
name = "reovim-driver-annotation"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Annotation data driver for reovim (annotation types, sources, stores)"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# Kernel layer (BufferId, ServiceKey, MultiServiceRegistry)
reovim-kernel = { workspace = true }

# Annotation data types (Annotation, AnnotationKind, AnnotationTarget,
# AnnotationPayload) live in uapi/content-codec/ and are re-exported here.
reovim-content-codec = { workspace = true }

# Small vector optimization for annotation storage (avoids heap for <=2 items)
smallvec = "1.13"
