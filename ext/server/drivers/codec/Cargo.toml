[package]
name = "reovim-driver-codec"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Content codec driver for reovim (trait definitions only)"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = []
# Enable the test-only verification harness exports
# (`reovim_driver_codec::testing::harness`) and test-only `DecodedEdit`
# / `TreeOp` placeholder variants for downstream codec modules to use
# in their own `#[cfg(test)]` suites. Analogous to `reovim-testing`.
testing = []

[dependencies]
# Only depends on kernel layer (for Service trait, BufferId)
reovim-kernel = { workspace = true }

tracing = { workspace = true }

# Domain trait for generic codec traits (Decode<D>, Encode<D>, Index<D>)
reovim-domain = { workspace = true }

# Text types for decoded text positions (including `TextPosition`/`Position`).
reovim-domain-text = { workspace = true }

# Text events for text_edit_to_decoded_edit conversion.
reovim-domain-text-events = { workspace = true }

# Session extension trait (for CodecSessionState as SessionExtension)
reovim-driver-text-session = { workspace = true }

# Annotation types (for DecodeResult annotations)
reovim-driver-annotation = { workspace = true }

# VFS types (for FileHandle in streaming decode; ByteEdit moved to kernel #740)
reovim-subsys-vfs = { workspace = true }

# Sync primitives for stores
parking_lot = { workspace = true }

# Error derivations
thiserror = "2"

[dev-dependencies]
trybuild = "1.0"
tracing-test = "0.2"
tempfile = "3"
