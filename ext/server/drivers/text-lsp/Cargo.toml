[package]
name = "reovim-driver-text-lsp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "LSP driver for reovim (Language Server Protocol client)"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# Kernel layer (provides KernelContext, EventBus, ArcSwap, channels, etc.)
reovim-kernel = { workspace = true }

# Session driver (SessionExtension for DiagnosticSnapshot)
reovim-driver-text-session = { workspace = true }

# LSP protocol types (matches lib/lsp version)
lsp-types = "0.97"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime (process spawn, stdio transport)
tokio = { workspace = true }

# Logging
tracing.workspace = true

# Concurrency (#542: LspLifecycleRegistry)
parking_lot = { workspace = true }

[dev-dependencies]
tempfile = "3"
