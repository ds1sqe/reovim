[package]
name = "reovim-content-codec-tar-gz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "tar.gz structured binary codec module for reovim"
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
reovim-kernel = { workspace = true }
reovim-capabilities = { workspace = true }
reovim-content-codec = { workspace = true }
reovim-driver-annotation = { workspace = true }
reovim-subsys-vfs = { workspace = true }
reovim-subsys-content-codec = { workspace = true }
reovim-module-macros = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
reovim-testing = { workspace = true }
reovim-domain-text = { workspace = true }
# Text-domain carve-out (TextEdit used in codec_tests.rs)
reovim-content-codec-text = { workspace = true }

[features]
# Enable for building as standalone dynamic library
dynamic = []
