// Multi-client presence awareness.
//
// Domain-neutral: cursor/position/selection replaced by DomainDatum.
// spatial_state for VR/AR spatial presence.
// JoinResponse includes domain registry and surface echo.

syntax = "proto3";
package reovim.v3;

import "reovim/v3/common.proto";

// ---------------------------------------------------------------------------
// Service
// ---------------------------------------------------------------------------

service PresenceService {
  // Announce this client to the session.
  rpc Join(JoinRequest) returns (JoinResponse);

  // Leave the session.
  rpc Leave(LeaveRequest) returns (LeaveResponse);

  // Stream presence updates from other clients.
  rpc StreamPresence(StreamPresenceRequest) returns (stream PresenceUpdate);

  // Update this client's presence state.
  rpc UpdatePresence(UpdatePresenceRequest) returns (UpdatePresenceResponse);

  // Set sync mode (independent, follow, present).
  rpc SetSyncMode(SetSyncModeRequest) returns (SetSyncModeResponse);

  // List all connected clients in the session.
  rpc ListClients(ListClientsRequest) returns (ListClientsResponse);

  // Set client's relation.
  rpc SetRelation(SetRelationRequest) returns (SetRelationResponse);
}

// ---------------------------------------------------------------------------
// Core Types
// ---------------------------------------------------------------------------

// Presence state for a single client.
message ClientPresence {
  uint64 client_id = 1;
  string client_type = 2;      // "tui", "android", "web", "cli"
  string display_name = 3;
  optional uint64 buffer_id = 4;

  // Opaque viewport state (domain-neutral).
  optional DomainDatum viewport_state = 5;
  // Opaque spatial state (VR/AR: head pos/rot, hand positions, gaze).
  optional DomainDatum spatial_state = 6;

  SyncMode sync_mode = 7;
  optional uint64 follow_target = 8;
  uint64 joined_at_ms = 9;
}

enum SyncMode {
  INDEPENDENT = 0;
  FOLLOW = 1;
  PRESENT = 2;
}

// Relation type for a client.
enum ClientRelationType {
  RELATION_TYPE_FOLLOWING = 0;
  RELATION_TYPE_SHARING = 1;
}

// Relation to another client.
message ClientRelation {
  ClientRelationType type = 1;
  uint64 target_id = 2;
}

// Minimal view state for rendering peer presence.
message ClientViewState {
  optional uint64 buffer_id = 1;
  // Opaque domain state (replaces cursor + selection fields).
  optional DomainDatum domain_state = 2;
}

// Client metadata.
message ClientMetadata {
  string client_type = 1;
  string display_name = 2;
  uint64 joined_at_ms = 3;
}

// A client in a session (unified message).
message ClientInfo {
  uint64 id = 1;
  optional ClientRelation relation = 2;
  ClientViewState view = 3;
  ClientMetadata metadata = 4;
}

// Transition error codes.
enum TransitionError {
  TRANSITION_ERROR_UNSPECIFIED = 0;
  TRANSITION_ERROR_TARGET_NOT_FOUND = 1;
  TRANSITION_ERROR_WOULD_CREATE_CYCLE = 2;
  TRANSITION_ERROR_CANNOT_TARGET_SELF = 3;
  TRANSITION_ERROR_REQUIRES_DOMAIN_SYNC = 4;
}

// Presence update event (streamed to clients).
message PresenceUpdate {
  oneof update {
    ClientPresence joined = 1;
    ClientPresence updated = 2;
    uint64 left = 3;
  }
}

// ---------------------------------------------------------------------------
// Request/Response Messages
// ---------------------------------------------------------------------------

message JoinRequest {
  string client_type = 1;
  string display_name = 2;
  // Client's rendering surface (echoed back in response).
  optional SurfaceDescriptorProto surface = 3;
}

message JoinResponse {
  uint64 client_id = 1;
  // Connected peers with unified ClientInfo.
  repeated ClientInfo peers = 2;
  // Session token for authenticating subsequent requests.
  string session_token = 3;
  // Registered domains (clients use this for domain view module loading).
  repeated DomainInfo domains = 4;
  // Echoed surface descriptor.
  optional SurfaceDescriptorProto surface = 5;
}

message LeaveRequest {}

message LeaveResponse {
  bool ok = 1;
}

message StreamPresenceRequest {}

message UpdatePresenceRequest {
  optional uint64 buffer_id = 1;
  optional DomainDatum viewport_state = 2;
  optional DomainDatum spatial_state = 3;
}

message UpdatePresenceResponse {
  bool ok = 1;
}

message SetSyncModeRequest {
  SyncMode mode = 1;
  optional uint64 follow_target = 2;
}

message SetSyncModeResponse {
  bool ok = 1;
}

message ListClientsRequest {}

message ListClientsResponse {
  repeated ClientInfo clients = 1;
}

message SetRelationRequest {
  optional ClientRelation relation = 1;
}

message SetRelationResponse {
  bool ok = 1;
  optional TransitionError error = 2;
}
