name: Hosted contributor CI

on:
  pull_request:
  push:
    branches: [develop, v0.16]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  contributor-matrix:
    name: Discover contributor matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read shared matrix
        id: matrix
        run: |
          matrix="$(./scripts/ci.sh --matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  hosted-contributor:
    name: Contributor / ${{ matrix.toolchain }} / ${{ matrix.version }}
    needs: contributor-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.contributor-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: apps/web/package.json
          package-manager-cache: false
      - name: Prepare declared TypeScript compiler
        run: |
          version="$(node -p \
            "require('./apps/web/package.json').config.typescript")"
          npm install --global --prefix "$RUNNER_TEMP/reovim-tools" \
            --ignore-scripts --no-audit --no-fund "typescript@$version"
          echo "$RUNNER_TEMP/reovim-tools/bin" >> "$GITHUB_PATH"
      - name: Run shared contributor lane
        env:
          CI_TOOLCHAIN: ${{ matrix.toolchain }}
        run: ./scripts/ci.sh --toolchain "$CI_TOOLCHAIN"
