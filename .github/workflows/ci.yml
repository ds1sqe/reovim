name: Hosted tooling CI

on:
  pull_request:
  push:
    branches: [develop, v0.16]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  hosted-tooling:
    name: documentation and depgraph
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: ./scripts/check.sh
