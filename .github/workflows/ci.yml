# CI for the v0.16 spec realization (10.1 development-process gates).
#
# Per-PR cadence is normative (10.1 §3): fmt, clippy, tests (which
# include the depgraph probes, 1.2 §5), coverage, and the dedicated
# sovereignty gate all run on every pull request.
name: CI

on:
  pull_request:
  push:
    branches: [develop, v0.16]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets

  test:
    name: tests + depgraph probes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  sovereignty:
    name: sovereignty gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p reovim-depgraph --test sovereignty_gate

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: ./scripts/coverage.sh line --lcov
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: target/llvm-cov/lcov.line.info
          fail_ci_if_error: true
