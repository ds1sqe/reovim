[package]
name = "reovim-module-buffer-simple"
version = "0.9.1-dev"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Simple buffer manager module for reovim"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# Kernel types
reovim-kernel = { path = "../../lib/kernel", version = "0.9.1-dev" }

# Driver for BufferManagerKey and registry
reovim-driver-buffer = { path = "../../lib/drivers/buffer", version = "0.9.1-dev" }

# Platform abstraction for RwLock
reovim-arch = { path = "../../lib/arch", version = "0.9.1-dev" }

# Module macros for FFI entry points
reovim-module-macros = { path = "../../lib/module-macros", version = "0.9.1-dev" }

# Logging
tracing.workspace = true

[features]
# Enable for building as standalone dynamic library
dynamic = []
