[package]
name = "reovim-module-editor"
version = "0.9.1-dev"
edition = "2024"
rust-version = "1.92"
description = "Core editor module for reovim - Normal and Insert modes with basic commands"
license = "AGPL-3.0-only"

[lib]
crate-type = ["rlib"]

[dependencies]
reovim-kernel = { path = "../../lib/kernel" }
reovim-driver-command = { path = "../../lib/drivers/command" }
reovim-driver-display = { path = "../../lib/drivers/display" }
reovim-driver-input = { path = "../../lib/drivers/input" }
reovim-driver-vfs = { path = "../../lib/drivers/vfs" }
reovim-module-operators = { path = "../operators" }
unicode-width = "0.2"

[lints]
workspace = true
