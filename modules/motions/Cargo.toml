[package]
name = "reovim-module-motions"
version = "0.9.2-dev"
edition.workspace = true
license.workspace = true
description = "Vim motions (w, b, e, 0, $, etc.) for reovim - POLICY module"
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
dynamic = []  # Enable FFI entry points for standalone dynamic loading

[dependencies]
reovim-kernel = { workspace = true }
reovim-driver-command = { workspace = true }
reovim-driver-session = { workspace = true }
reovim-driver-search = { workspace = true }
reovim-module-macros = { path = "../../lib/module-macros" }
tracing = { workspace = true }

[lints]
workspace = true
