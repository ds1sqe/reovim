[package]
name = "reovim-module-cmdline"
version = "0.9.2-dev"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Command line UI module (noice-style floating popup)"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
dynamic = []  # Enable FFI entry points for standalone dynamic loading

[lints]
workspace = true

[dependencies]
# Kernel layer (for Module trait, ServiceRegistry, EventBus)
reovim-kernel = { path = "../../lib/kernel", version = "0.9.2-dev" }

# Module macros for dynamic loading
reovim-module-macros = { path = "../../lib/module-macros" }

# Driver layers
reovim-driver-command = { path = "../../lib/drivers/command", version = "0.9.2-dev" }
reovim-driver-display = { path = "../../lib/drivers/display", version = "0.9.2-dev" }
reovim-driver-input = { path = "../../lib/drivers/input", version = "0.9.2-dev" }
reovim-driver-session = { path = "../../lib/drivers/session", version = "0.9.2-dev" }

# Layout module for overlay layer access
reovim-module-layout = { path = "../layout" }

# Platform abstraction (for RwLock)
reovim-arch = { path = "../../lib/arch", version = "0.9.2-dev" }

# Logging
tracing = { workspace = true }
