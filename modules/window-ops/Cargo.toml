[package]
name = "reovim-module-window-ops"
version = "0.9.1-dev"
edition = "2024"
rust-version = "1.92"
description = "Window operations module for reovim"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
dynamic = []  # Enable FFI entry points for standalone dynamic loading

[dependencies]
reovim-kernel = { path = "../../lib/kernel" }
reovim-module-macros = { path = "../../lib/module-macros" }
