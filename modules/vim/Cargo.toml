[package]
name = "reovim-module-vim"
version = "0.9.1-dev"
edition = "2024"
rust-version = "1.92"
description = "Vim policy module for reovim - keybindings and behavior"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
dynamic = []  # Enable FFI entry points for standalone dynamic loading

[dependencies]
reovim-kernel = { path = "../../lib/kernel" }
reovim-module-macros = { path = "../../lib/module-macros" }
reovim-driver-command = { path = "../../lib/drivers/command" }
reovim-driver-command-types = { path = "../../lib/drivers/command-types" }
reovim-driver-input = { path = "../../lib/drivers/input" }
reovim-driver-session = { path = "../../lib/drivers/session" }
reovim-module-editor = { path = "../editor" }
reovim-module-motions = { path = "../motions" }
# Note: operators module merged into vim (Epic #385)
reovim-module-textobjects = { path = "../textobjects" }
reovim-driver-clipboard = { path = "../../lib/drivers/clipboard" }

[dev-dependencies]
# Integration test harness from runner
reovim = { path = "../../runner" }
tokio = { workspace = true }
