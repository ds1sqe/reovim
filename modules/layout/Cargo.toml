[package]
name = "reovim-module-layout"
version = "0.9.1-dev"
edition = "2024"
rust-version = "1.92"
description = "Window layout module for reovim - tiling, splits, and focus navigation"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
dynamic = []  # Enable FFI entry points for standalone dynamic loading

[dependencies]
reovim-kernel = { path = "../../lib/kernel" }
reovim-module-macros = { path = "../../lib/module-macros" }
reovim-driver-display = { path = "../../lib/drivers/display" }
reovim-driver-command = { path = "../../lib/drivers/command" }
