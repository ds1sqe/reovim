[package]
name = "reovim-module-clipboard"
version = "0.9.1-dev"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Clipboard module for reovim - system clipboard access and yank history"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# Kernel types
reovim-kernel = { path = "../../lib/kernel", version = "0.9.1-dev" }

# Driver for ClipboardProvider trait
reovim-driver-clipboard = { path = "../../lib/drivers/clipboard", version = "0.9.1-dev" }

# Platform abstraction for RwLock
reovim-arch = { path = "../../lib/arch", version = "0.9.1-dev" }

# Module macros for FFI entry points
reovim-module-macros = { path = "../../lib/module-macros", version = "0.9.1-dev" }

# System clipboard access
arboard.workspace = true

# Logging
tracing.workspace = true

[features]
# Enable for building as standalone dynamic library
dynamic = []
