[package]
name = "reovim-module-defaults"
version = "0.9.1-dev"
edition.workspace = true
license.workspace = true
description = "Default module bundle for reovim - aggregates keymap, vim, commands"
readme = "README.md"
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
dynamic = []  # Enable FFI entry points for standalone dynamic loading

[dependencies]
reovim-kernel = { workspace = true }
reovim-module-macros = { path = "../../lib/module-macros" }
reovim-module-keymap = { path = "../keymap" }
reovim-module-vim = { path = "../vim" }
# Note: operators merged into vim (Epic #385)
reovim-module-commands = { path = "../commands" }
reovim-module-scratch-buffer = { path = "../scratch-buffer" }
reovim-module-layout = { path = "../layout" }
reovim-driver-session = { workspace = true }
reovim-driver-display = { workspace = true }

[lints]
workspace = true
