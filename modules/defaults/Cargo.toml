[package]
name = "reovim-module-defaults"
version = "0.9.2-dev"
edition.workspace = true
license.workspace = true
description = "Default module bundle for reovim - aggregates keymap, vim, commands"
readme = "README.md"
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
dynamic = []  # Enable FFI entry points for standalone dynamic loading

[dependencies]
reovim-kernel = { workspace = true }
reovim-module-macros = { path = "../../lib/module-macros" }
reovim-module-keymap = { path = "../keymap" }
reovim-module-vim = { path = "../vim" }
# Note: operators merged into vim (Epic #385)
reovim-module-commands = { path = "../commands" }
reovim-module-editor = { path = "../editor" }
reovim-module-motions = { path = "../motions" }
reovim-module-undotree = { path = "../undotree" }
reovim-module-scratch-buffer = { path = "../scratch-buffer" }
reovim-module-layout = { path = "../layout" }
reovim-module-vfs-local = { path = "../vfs-local" }
reovim-module-undo = { path = "../undo" }
reovim-module-buffer-simple = { path = "../buffer-simple" }
reovim-module-search = { path = "../search" }
reovim-module-clipboard = { path = "../clipboard" }
reovim-module-pair = { path = "../pair" }
reovim-module-statusline = { path = "../statusline" }
reovim-driver-session = { workspace = true }
reovim-driver-display = { workspace = true }
reovim-driver-vfs = { workspace = true }

[lints]
workspace = true
