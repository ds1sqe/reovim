[package]
name = "reovim-platform-stub-none"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Test-only bare-metal platform handle scaffold: the freestanding -ENOSYS/sentinel vtable the selftest/bootcore fixtures install"
publish = false

[lints]
workspace = true

[dependencies]
# The down-face contract this crate implements: the `#[repr(C)] PlatformVtable`
# slots, the write-once `install()` gate, and `InstallError`. A #![no_std] leaf
# with no third-party deps, so DAG5/DAG6 hold.
reovim-kabi-platform = { path = "../../kabi/platform" }

# No [dev-dependencies] or [build-dependencies] (DAG5/DAG6: zero third-party deps).
# Beyond the in-repo path deps above/below, only `core` is consumed.

[target.'cfg(all(target_os = "none", target_arch = "x86_64"))'.dependencies]
# Raw target mechanism for the freestanding x86_64 scaffold provider.
reovim-arch-sys-none-x86-64 = { path = "../../arch/sys-none-x86-64" }

[target.'cfg(all(target_os = "none", target_arch = "aarch64"))'.dependencies]
# Raw target mechanism for the freestanding aarch64 scaffold provider.
reovim-arch-sys-none-aarch64 = { path = "../../arch/sys-none-aarch64" }
