[package]
name = "reovim-platform-linux-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Linux provider: canonicalizes target arch-sys mechanisms into the kabi/platform vtable and installs it (hosted, both Linux arches)"
publish = false

[lints]
workspace = true

[dependencies]
# The down-face contract this crate implements: the `#[repr(C)] PlatformVtable`
# slots, the write-once `install()` gate, and `map_fd_ret`. A #![no_std] leaf
# with no third-party deps, so DAG5/DAG6 hold.
reovim-kabi-platform = { path = "../../kabi/platform" }

# No [dev-dependencies] or [build-dependencies] (DAG5/DAG6: zero third-party deps).
# Beyond the in-repo path deps above/below, only `core` is consumed.

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
# Raw target mechanism for the hosted x86_64 Linux provider. The provider
# canonicalizes these NATIVE returns into the kabi/platform down-face table.
reovim-arch-sys-linux-x86-64 = { path = "../../arch/sys-linux-x86-64" }

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
# Raw target mechanism for the hosted aarch64 Linux provider. The provider
# canonicalizes these NATIVE returns into the kabi/platform down-face table.
reovim-arch-sys-linux-aarch64 = { path = "../../arch/sys-linux-aarch64" }
