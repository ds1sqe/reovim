[package]
name = "reovim-rig"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Off in the portable check, where there is no directory to make.
default = ["std"]
std = ["reovim-host/std"]

[dependencies]
reovim-client = { path = "../core" }
reovim-client-api = { path = "../core/api" }
reovim-client-tui = { path = "../tui" }
reovim-host = { path = "../../host/os" }
reovim-kernel-interface = { path = "../../kernel/interface" }
reovim-kernel-runtime = { path = "../../kernel/runtime" }
reovim-module-coreutils = { path = "../../modules/coreutils" }
reovim-module-fs = { path = "../../modules/fs" }
reovim-module-sysutils = { path = "../../modules/sysutils" }
reovim-module-text = { path = "../../modules/text" }
reovim-plugin-vim = { path = "../../plugins/vim" }
reovim-sdk = { path = "../../sdk/rust" }
reovim-text-api = { path = "../../modules/text/api" }

[lints]
workspace = true
