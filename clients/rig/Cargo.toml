[package]
name = "reovim-rig"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Off in the portable check, where there is no directory to make.
default = ["std"]
std = ["reovim-host/std"]

[dependencies]
reovim-client = { path = "../core" }
reovim-host = { path = "../../host/os" }
reovim-kernel-runtime = { path = "../../kernel/runtime" }
reovim-module-clipboard = { path = "../../modules/clipboard" }
reovim-module-coreutils = { path = "../../modules/coreutils" }
reovim-module-fs = { path = "../../modules/fs" }
reovim-module-text = { path = "../../modules/text" }

[lints]
workspace = true
