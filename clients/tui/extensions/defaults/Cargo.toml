[package]
name = "reovim-tui-ext-defaults"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Default TUI extensions meta-crate for reovim"
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
# Extension trait
reovim-driver-display = { workspace = true }

# Dependency resolution for extension sort order (#583)
# NOTE: This crate lives in server/lib/drivers/ but is a pure stdlib-only
# generic algorithm with zero server content. Used here for toposort.
reovim-driver-depgraph = { workspace = true }

# Shared extension kind constants (#583)
reovim-extension-kinds = { workspace = true }

# Logging for validation warnings (#584)
tracing = { workspace = true }

# Concrete extensions
reovim-tui-ext-whichkey = { path = "../which-key" }
reovim-tui-ext-cmdline = { path = "../cmdline" }
reovim-tui-ext-notification = { path = "../notification" }
reovim-tui-ext-microscope = { path = "../microscope" }
reovim-tui-ext-completion = { path = "../completion" }
reovim-tui-ext-explorer = { path = "../explorer" }
reovim-tui-ext-tetromino = { path = "../tetromino" }
reovim-tui-ext-range-finder = { path = "../range-finder" }
reovim-tui-ext-hover = { path = "../hover" }
reovim-tui-ext-signature-help = { path = "../signature-help" }
reovim-tui-ext-diagnostics = { path = "../diagnostics" }
reovim-tui-ext-markdown = { path = "../markdown" }
reovim-tui-ext-landing = { path = "../landing" }
