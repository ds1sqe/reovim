[package]
name = "reovim-client-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Reovim CLI client - command-line interface using gRPC v2"
repository.workspace = true
homepage.workspace = true

[dependencies]
# Protocol types (gRPC v2)
reovim-protocol = { workspace = true, features = ["grpc"] }

# gRPC
tonic = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full"] }

# CLI
clap = { workspace = true, features = ["derive"] }

# Serialization (for JSON output)
serde_json = { workspace = true }

# Local module registry workflow
reovim-subsys-module-registry = { workspace = true }

# Logging
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
tempfile = "3"

[lints]
workspace = true
