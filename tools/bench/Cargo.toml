[package]
name = "reovim-bench"
version.workspace = true
edition = "2024"
description = "Benchmarks for reovim kernel operations"
publish = false

# Library needed for Criterion benchmarks
[lib]
name = "reovim_bench"
path = "src/lib.rs"

[dependencies]
# Kernel layer (for benchmarking)
reovim-kernel = { workspace = true }
reovim-domain-text = { workspace = true }

[dev-dependencies]
# Criterion benchmarking framework
criterion = { version = "0.5", features = ["html_reports"] }

# Buffer benchmarks (Buffer moved from kernel to provider-text in #740)
reovim-provider-text = { workspace = true }

# Syntax hot path benchmarks
reovim-driver-syntax = { workspace = true }
reovim-driver-syntax-treesitter = { workspace = true }
reovim-module-treesitter-rust = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }

# Large-file gate benchmarks (#739)
reovim-bench-utils = { workspace = true }
reovim-driver-vfs = { workspace = true }
memmap2 = "0.9"
tempfile = "3"

[[bench]]
name = "buffer_ops"
harness = false

[[bench]]
name = "search_ops"
harness = false

[[bench]]
name = "event_dispatch"
harness = false

[[bench]]
name = "profiler_overhead"
harness = false

[[bench]]
name = "syntax_hot_path"
harness = false

[[bench]]
name = "notification_overhead"
harness = false

[[bench]]
name = "large_file_gates"
harness = false
