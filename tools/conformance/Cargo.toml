[package]
name = "reovim-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# reovim-style: allow-long-line searchable-string
description = "Non-shipping exact conformance checker for Reovim repository boundaries"
publish = false

[dependencies]
reovim-depgraph = { path = "../../lib/depgraph" }

[dependencies.serde_json]
version = "=1.0.151"
default-features = false
features = ["std"]

[dependencies.syn]
version = "=3.0.4"
default-features = false
features = ["full", "parsing", "visit"]

[target.'cfg(target_os = "linux")'.dependencies.nix]
version = "=0.31.3"
default-features = false
features = ["fs", "mount", "resource", "sched", "signal", "socket"]

[lints]
workspace = true
