[package]
name = "perf-report"
version = "0.1.0"
edition = "2024"
description = "Performance report generator for reovim benchmarks"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
walkdir = "2"
