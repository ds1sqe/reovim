# Composition-root catalog (1.2 §7). Populated by #797 Phase 4.
#
# Format:
#   [[edge]]
#   from   = "reovim"          # apps/* or tools/* package name
#   to     = "reovim-tui"      # dependency package name (in-repo only)
#   gate   = "embedded-tui"    # optional feature gate
#   reason = "..."             # mandatory justification (non-blank)
#
# Every apps/* or tools/* dep not listed here fails DAG3. Entries may only
# name in-repo crates — the catalog cannot grant a third-party edge (DAG5).

# ── reovim-server (apps/server/) ─────────────────────────────────────────────
# Standalone server composition root: boots editor core, registers text Domain,
# starts UDS listener, parks the process.

[[edge]]
from   = "reovim-server"
to     = "reovim-editor-core"
reason = "composition root boots the editor core via EditorInit::new(LauncherArgs).boot() and calls register_domain + setup_session"

[[edge]]
from   = "reovim-server"
to     = "reovim-system-kernel"
reason = "composition root obtains the panic/log control implementation table from system-kernel and passes it into editor-core LauncherArgs"

[[edge]]
from   = "reovim-server"
to     = "reovim-server-rt"
reason = "composition root calls start_listener to bind the UDS socket and start the per-connection accept loop"

[[edge]]
from   = "reovim-server"
to     = "reovim-domain-text"
reason = "wires TextHandler + TextProjector into the editor core's DomainRouter; core/ext boundary: only composition roots link ext crates"

[[edge]]
from   = "reovim-server"
to     = "reovim-uapi"
reason = "uses the public up-face facade for socket-path and borrowed-fd diagnostic vocabulary while system-kernel owns concrete service implementations"

[[edge]]
from   = "reovim-server"
to     = "reovim-lib-ds"
reason = "composition root constructs Shared<T> handles for editor-core wiring; the DS-algorithm tier moved from arch to lib/ds in the reorg, so the edge is now direct"

[[edge]]
from   = "reovim-server"
to     = "reovim-platform-linux-native"
reason = "composition root drives the platform vtable install — calls install_platform() as the entry! closure's first statement (SP02 moved this off arch's rust_entry self-call to keep platform->arch one-way and acyclic)"

# ── reovim (apps/reovim/) ─────────────────────────────────────────────────────
# Dual-mode launcher: in-process UDS composition root — boots server runtime
# on background thread, runs TUI client on main thread over the real UDS socket.

[[edge]]
from   = "reovim"
to     = "reovim-platform-tui"
reason = "composition root runs the TUI client via tui_run(RunArgs { socket_path }) — the platform runtime entry point"

[[edge]]
from   = "reovim"
to     = "reovim-system-kernel"
reason = "composition root obtains terminal and panic/log control implementation tables from system-kernel and passes them into TUI RunArgs; TUI depends only on uapi/* controls"

[[edge]]
from   = "reovim"
to     = "reovim-editor-core"
reason = "composition root boots the editor core via EditorInit::new(LauncherArgs).boot() and calls register_domain + setup_session"

[[edge]]
from   = "reovim"
to     = "reovim-server-rt"
reason = "composition root calls start_listener to bind the in-process UDS socket and start the accept loop on a background thread"

[[edge]]
from   = "reovim"
to     = "reovim-domain-text"
reason = "wires TextHandler + TextProjector into the editor core's DomainRouter; core/ext boundary: only composition roots link ext crates"

[[edge]]
from   = "reovim"
to     = "reovim-uapi"
reason = "uses the public up-face facade for socket-path, borrowed-fd, and path-control vocabulary while system-kernel owns concrete service implementations"

[[edge]]
from   = "reovim"
to     = "reovim-lib-ds"
reason = "composition root constructs Shared<T> handles for editor-core wiring; the DS-algorithm tier moved from arch to lib/ds in the reorg, so the edge is now direct"

[[edge]]
from   = "reovim"
to     = "reovim-platform-linux-native"
reason = "composition root drives the platform vtable install — calls install_platform() as the entry! closure's first statement (SP02 moved this off arch's rust_entry self-call to keep platform->arch one-way and acyclic)"
