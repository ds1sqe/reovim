[package]
name = "reovim-platform-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "TUI platform runtime: thin UDS client + up-face raw-terminal ANSI paint (#797 Phase 4)"
publish = false

[features]
default = []
# Compile the `*_tests.rs` sibling test modules into this lib (L12.1).
# `dep:reovim-arch` activates the now-OPTIONAL arch dep; `reovim-arch/selftest`
# enables arch_test!/testrt. The product build carries no arch edge: the only
# surviving tui->arch use is the selftest harness (arch_test!/testrt) in the
# `*_tests.rs` siblings.
selftest = ["dep:reovim-arch", "reovim-arch/selftest"]

[dependencies]
# Optional + selftest-gated: the product graph names no arch edge (SP05b). Only
# the `*_tests.rs` selftest siblings reach `reovim_arch::{arch_test, testrt, sys,
# alloc::fault}`, behind the `selftest` feature.
reovim-arch         = { path = "../../../arch", optional = true }
# Heap-DS algorithms (Seq/Bytes) relocated from `reovim_arch::ds` (SP03).
reovim-lib-ds       = { path = "../../../lib/ds" }
# Product-facing uapi namespace. The app composition root supplies concrete
# implementation tables; TUI never imports lower raw-fd, UDS, terminal, provider,
# or panic atom surfaces directly.
reovim-uapi          = { path = "../../../uapi" }

[lints]
workspace = true
