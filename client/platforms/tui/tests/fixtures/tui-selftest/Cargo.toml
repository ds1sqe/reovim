[package]
name = "tui-selftest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "no_std TUI platform self-test runner: all ext/client/platforms/tui *_tests.rs L12 tests on the in-repo runner (#797 Phase 5)"
publish = false

[[bin]]
name = "tui-selftest"
path = "src/main.rs"
# `#![no_std] #![no_main]` test-runner bin: disable std harness hooks.
test = false
bench = false
doctest = false

[features]
default = []
# Adds one deliberately-failing test to verify the runner exits non-zero.
inject-failure = []

[dependencies]
# `runtime`: provides `_start`, panic handler, allocator lang items.
# Enabled directly on `reovim-arch` (the TUI crate does not re-export runtime).
# `selftest`: compiles the TUI platform sibling test modules into the lib.
reovim-platform-tui = { path = "../../..", features = ["selftest"] }
reovim-arch         = { path = "../../../../../../arch", features = ["runtime", "selftest"] }

# The platform-handle installer this composition root drives. The fixture is
# host-only (native-only pin per `fixtures_exec.rs`), so only the real POSIX
# provider is needed — no bare-metal scaffold branch.
[dependencies.reovim-platform-linux-native]
path = "../../../../../../platform/linux-native"

# The per-target language floor (SP03): supplies `_start`, the `entry!` shim,
# the `#[panic_handler]`, `rust_eh_personality`, and the `mem` intrinsics as LINK
# symbols (relocated out of arch). Each target cfg names its real floor crate
# directly (a single dep key cannot map to different source paths across target
# blocks — Cargo rejects that); `src/main.rs` picks the active one with a
# cfg-gated `use <floor_crate>::entry;` import. This fixture is host-only (Linux),
# so only the two Linux floor crates are linked.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
reovim-arch-floor-linux-x86-64 = { path = "../../../../../../arch/floor-linux-x86-64", features = ["runtime"] }

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
reovim-arch-floor-linux-aarch64 = { path = "../../../../../../arch/floor-linux-aarch64", features = ["runtime"] }

[lints]
workspace = true
