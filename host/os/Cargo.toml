[package]
name = "reovim-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
std = ["dep:crossterm"]

# The terminal of the std backend: raw mode, keys, size. The only
# external crate, named here only.
[dependencies.crossterm]
version = "=0.29.0"
default-features = false
features = ["events"]
optional = true

[[test]]
name = "fs"
required-features = ["std"]

[[test]]
name = "link"
required-features = ["std"]

[lints]
workspace = true
