coverage:
  status:
    project:
      default:
        target: 100%
        threshold: 0.5%
    patch:
      default:
        target: 100%

# Client Foundation chain (#753) — enable each as the corresponding crate lands.
# Entries stay commented out until the named crate appears in the workspace:
# codecov's config validator rejects references to unknown packages, so the
# carve-out ships dormant and each phase uncomments its line at sub-plan landing.
# coverage:
#   status:
#     project:
#       reovim-client-subsys-module:       # enable in Phase B (02-subsys-module.md)
#         target: 100%
#         flags: [line]
#       reovim-client-subsys-chrome:       # enable in Phase C (03-subsys-chrome-render.md)
#         target: 100%
#         flags: [line]
#       reovim-client-subsys-render:       # enable in Phase C (03-subsys-chrome-render.md)
#         target: 100%
#         flags: [line]
#       reovim-client-subsys-capability:   # enable in Phase D (04-subsys-capability-platform-protocol.md)
#         target: 100%
#         flags: [line]
#       reovim-client-subsys-platform:     # enable in Phase D
#         target: 100%
#         flags: [line]
#       reovim-client-subsys-protocol:     # enable in Phase D
#         target: 100%
#         flags: [line]

ignore:
  - "tools/**"
  - "archive/**"
  - "uapi/protocol/src/gen/**"
  - "**/build.rs"
  - "tools/testing/**"
  - "ext/server/drivers/ffi-python/**"
  - "clients/web/**"

comment:
  layout: "header, diff, flags, files"
  require_changes: true

flags:
  branch:
    carryforward: true
  mcdc:
    carryforward: true
