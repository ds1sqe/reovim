coverage:
  status:
    project:
      default:
        target: 100%
        threshold: 0.5%
      reovim-client-subsys-module:       # Phase B (02-subsys-module.md)
        target: 100%
        flags: [line]
      reovim-client-subsys-chrome:       # Phase C (03-subsys-chrome-render.md)
        target: 100%
        flags: [line]
      reovim-client-subsys-render:       # Phase C (03-subsys-chrome-render.md)
        target: 100%
        flags: [line]
      reovim-client-ext-platform-tui:    # Phase E.1 (05-ext-platforms-tui.md)
        target: 100%
        flags: [line]
    patch:
      default:
        target: 100%

      reovim-client-subsys-capability:   # Phase D (04-subsys-capability-platform-protocol.md)
        target: 100%
        flags: [line]
      reovim-client-subsys-platform:     # Phase D
        target: 100%
        flags: [line]
      reovim-client-subsys-protocol:     # Phase D
        target: 100%
        flags: [line]

ignore:
  - "tools/**"
  - "archive/**"
  - "uapi/protocol/src/gen/**"
  - "**/build.rs"
  - "tools/testing/**"
  - "ext/server/drivers/ffi-python/**"
  - "clients/web/**"

comment:
  layout: "header, diff, flags, files"
  require_changes: true

flags:
  branch:
    carryforward: true
  mcdc:
    carryforward: true
