# Client drivers (TUI-specific)
reovim-driver-tui = { path = "./clients/tui/lib/drivers/tui", version = "0.11.0-dev" }
reovim-driver-display = { path = "./clients/tui/lib/drivers/display", version = "0.11.0-dev" }
reovim-driver-extension-loader = { path = "./clients/tui/lib/drivers/extension-loader", version = "0.11.0-dev" }

# Client crates
reovim-client-tui = { path = "./clients/tui", version = "0.11.0-dev" }
reovim-client-cli = { path = "./clients/cli", version = "0.11.0-dev" }

# Common client model (platform-agnostic abstractions)
