serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Clipboard
arboard = "3"

# Dynamic module loading
libloading = "0.8"
sha2 = "0.10"
hex = "0.4"

# Unicode
unicode-width = "0.2"

# Fuzzy matching
nucleo = "0.5"
ignore = "0.4"

# Encoding support
encoding_rs = "0.8"

# Document format support
pdf-extract = "0.7"
lopdf = "0.34"

# Binary format parsing
goblin = "0.9"
zip = { version = "8", default-features = false }
tar = "0.4"
flate2 = "1"
csv = "1.3"
