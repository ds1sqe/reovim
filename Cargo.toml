[workspace]
resolver = "3"
members = [
    "lib/bitflags",
    "kernel/interface",
    "kernel/runtime",
    "kernel/abi",
    "host/os",
    "modules/clipboard",
    "modules/fs",
    "modules/text",
    "modules/text/api",
    "sdk/rust",
    "bin/stat",
    "plugins/cli",
    "plugins/explorer",
    "plugins/vim",
    "clients/core",
    "clients/cli",
    "clients/tui",
    "clients/rig",
    "apps/reovim",
]
default-members = [
    "lib/bitflags",
    "kernel/interface",
    "kernel/runtime",
    "kernel/abi",
    "host/os",
    "modules/clipboard",
    "modules/fs",
    "modules/text",
    "modules/text/api",
    "sdk/rust",
    "bin/stat",
    "plugins/cli",
    "plugins/explorer",
    "plugins/vim",
    "clients/core",
    "clients/cli",
    "clients/tui",
    "clients/rig",
    "apps/reovim",
]

[workspace.package]
version = "0.16.0-dev"
edition = "2024"
rust-version = "1.92"
authors = ["ds1sqe(dukim) <ds1sqe@mensakorea.org>"]
license = "AGPL-3.0-only"
repository = "https://github.com/ds1sqe/reovim"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
excessive_nesting = "forbid"
