[workspace]
resolver = "3"
members = [
    "lib/bitflags",
    "lib/vtable",
    "kernel/interface",
    "kernel/runtime",
]
default-members = [
    "lib/bitflags",
    "lib/vtable",
    "kernel/interface",
    "kernel/runtime",
]

[workspace.package]
version = "0.16.0-dev"
edition = "2024"
rust-version = "1.92"
authors = ["ds1sqe(dukim) <ds1sqe@mensakorea.org>"]
license = "AGPL-3.0-only"
repository = "https://github.com/ds1sqe/reovim"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
excessive_nesting = "forbid"
