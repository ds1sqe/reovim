[workspace]
resolver = "2"
members = [
    # Phase 2a apps/ bin split — `apps/bin/` was deleted in 2a.G
    # and the per-kind bins below are the composition roots.
    # `apps/reovim/` produces the top-level `reovim` launcher bin.
    "apps/server",
    "apps/tui",
    "apps/cli",
    "apps/web",
    "apps/reovim",

    # Platform abstraction layer (Linux-style arch/)
    "arch",

    # Core libraries (Linux-style lib/) — no reovim-* deps allowed
    "lib/bench",
    "lib/depgraph",
    "lib/dylib-loader",
    "lib/pkg-manifest",
    "lib/pkg-lockfile",
    "lib/pkg-resolver",
    "lib/pkg-install",
    "lib/pkg-lazyload",

    # Contributor dev-loop tool (composition root — exempt from core/ext rules)
    "tools/reovim-dev",
    "tools/pkg",

    # Userspace API (Linux-style uapi/) — stable contracts (wire + module ABI)
    "uapi/content-codec",
    "uapi/driver-macros",
    "uapi/module-macros",
    "uapi/protocol",

    # Server layer
    "server/lib/kernel",
    "server/lib/server",

    # Server drivers
    "server/lib/subsys/command-types",
    "server/lib/subsys/command",
    "server/lib/subsys/content-codec",
    "ext/server/drivers/command",
    "server/lib/subsys/input",
    "ext/server/drivers/text-input",
    "ext/server/drivers/text-syntax",
    "ext/server/drivers/syntax-treesitter",
    "ext/server/drivers/text-lsp",
    "server/lib/subsys/vfs",
    "server/lib/subsys/net",
    "ext/server/drivers/net-grpc",
    "ext/server/drivers/text-session",
    "ext/server/drivers/text-undo",
    "ext/server/drivers/text-buffer",
    "ext/server/drivers/text-search",
    "server/lib/subsys/clipboard",
    "ext/server/drivers/formatter",
    "ext/server/drivers/text-ffi",
    "ext/server/drivers/text-ffi-python",
    "ext/server/drivers/picker",
    "ext/server/drivers/completion",
    "server/lib/subsys/manifest",
    "server/lib/subsys/module-config",
    "server/lib/subsys/module-loader",
    "ext/server/drivers/git",
    "server/lib/subsys/module-registry",
    "server/lib/subsys/layout",
    "server/lib/subsys/session",
    "ext/server/drivers/annotation",
    "ext/server/drivers/statusline",
    "ext/server/drivers/display-registry",
    "server/lib/subsys/coordination",
    "ext/content-codec/text",

    # Content codecs
    "ext/content-codec/xxd",
    "ext/content-codec/utf8",
    "ext/content-codec/cjk",
    "ext/content-codec/csv",
    "ext/content-codec/hex",
    "ext/content-codec/pdf",
    "ext/content-codec/rlib",
    "ext/content-codec/tar-gz",
    "ext/content-codec/binary-struct",
    "ext/content-codec/legacy",

    # Providers (domain logic, above drivers)
    "ext/server/providers/text",
    "ext/server/providers/mesh",

    # Server modules
    "ext/server/modules/vim",
    "ext/server/modules/editor",
    "ext/server/modules/motions",
    "ext/server/modules/textobjects",
    "ext/server/modules/commands",
    "ext/server/modules/keymap",
    "ext/server/modules/layout",
    "ext/server/modules/mode-manager",
    "ext/server/modules/buffer-ops",
    "ext/server/modules/buffer-simple",
    "ext/server/modules/scratch-buffer",
    "ext/server/modules/clipboard",
    "ext/server/modules/search",
    "ext/server/modules/undo",
    "ext/server/modules/vfs-local",
    "ext/server/modules/window-ops",
    "ext/server/modules/treesitter-rust",
    "ext/server/modules/treesitter-python",
    "ext/server/modules/treesitter-c",
    "ext/server/modules/treesitter-javascript",
    "ext/server/modules/treesitter-typescript",
    "ext/server/modules/treesitter-json",
    "ext/server/modules/treesitter-toml",
    "ext/server/modules/treesitter-bash",
    "ext/server/modules/treesitter-go",
    "ext/server/modules/cmdline",
    "ext/server/modules/whichkey",
    "ext/server/modules/notification",
    "ext/server/modules/microscope",
    "ext/server/modules/explorer",
    "ext/server/modules/picker-files",
    "ext/server/modules/picker-buffers",
    "ext/server/modules/picker-commands",
    "ext/server/modules/picker-grep",
    "ext/server/modules/picker-options",
    "ext/server/modules/treesitter-markdown",
    "ext/server/modules/lsp",
    "ext/server/modules/snippet",
    "ext/server/modules/range-finder",
    "ext/server/modules/completion",
    "ext/server/modules/lsp-navigation",
    "ext/server/modules/profiles",
    "ext/server/modules/tetromino",
    "ext/server/modules/health-check",
    "ext/server/modules/git",
    "ext/server/modules/picker-git-branches",
    "ext/server/modules/picker-git-log",
    "ext/server/modules/picker-git-status",
    "ext/server/modules/picker-git-stash",
    "ext/server/modules/git-signs",
    "ext/server/modules/git-statusline",
    "ext/server/modules/illuminate",
    "ext/server/modules/format",
    "ext/server/modules/diagnostics-panel",
    "ext/server/modules/bufferline",
    "ext/server/modules/git-blame",
    "ext/server/modules/module-manager",
    "ext/server/modules/emacs",
    "ext/server/modules/pair",
    "ext/server/modules/context",
    "ext/server/modules/sticky-context",
    "ext/server/modules/indent-guide",
    "ext/server/modules/settings",
    # Client layer - TUI
    "clients/tui",
    "ext/client/tui/drivers/tui",
    "ext/client/tui/drivers/display",
    # Client modules - TUI (native ClientModule implementations)
    "ext/client/tui/modules/statusline",
    "ext/client/tui/modules/hover",
    "ext/client/tui/modules/signature-help",
    "ext/client/tui/modules/landing",
    "ext/client/tui/modules/completion",
    "ext/client/tui/modules/notification",
    "ext/client/tui/modules/which-key",
    "ext/client/tui/modules/cmdline",
    "ext/client/tui/modules/microscope",
    "ext/client/tui/modules/explorer",
    "ext/client/tui/modules/tetromino",
    "ext/client/tui/modules/line-numbers",
    "ext/client/tui/modules/fold",
    "ext/client/tui/modules/jump",
    "ext/client/tui/modules/pair",
    "ext/client/tui/modules/yank-flash",
    "ext/client/tui/modules/illuminate",
    "ext/client/tui/modules/diagnostics",
    "ext/client/tui/modules/markdown",
    "ext/client/tui/modules/bufferline",

    # Client layer - CLI
    "clients/cli",

    # uapi — wire contracts (input codec relocated here pending Plan 15 redesign)
    "uapi/input-codec",

    # TUI input codec (ext module, registers with InputCodecRegistry on load)
    "ext/input-codec/tui",

    # Client-core shared libs (platform-agnostic model + client module ABI)
    "clients/lib/model",
    "clients/lib/driver",
    "clients/lib/subsys/codec",
    "clients/lib/subsys/module",
    "clients/lib/subsys/chrome",
    "clients/lib/subsys/render",
    "clients/lib/subsys/capability",
    "clients/lib/subsys/platform",
    "clients/lib/subsys/protocol",
    "clients/lib/subsys/driver-loader",
    "clients/lib/subsys/debug",

    # Client-side ext platforms
    "ext/client/platforms/tui",
    "ext/client/platforms/web",

    # Client-side ext capabilities (TUI)
    "ext/client/tui/capabilities/cell",
    "ext/client/tui/capabilities/cell-view",

    # Client-side ext handler modules (TUI)
    "ext/client/tui/modules/surface-descriptor-cell-grid",

    # Core: generic Domain trait (zero deps; enables Buffer<D>, Decode<D>, ...)
    "lib/domain",

    # Extension layer — concrete domain implementations
    "ext/server/domain/text",
    "ext/server/domain/text/capabilities",
    "ext/server/domain/text/events",
    "ext/server/domain/mesh",

    # Tools (Rust) — python-test-sdk is Python, excluded below
    "tools/bench",
    "tools/driver-abi-poc",
    "tools/driver-abi-poc-construct-err",
    "tools/driver-abi-poc-empty",
    "tools/driver-abi-poc-panic",
    "tools/driver-debug-poc",
    "tools/driver-debug-poc-observer-panic",
    "tools/perf-report",
    "tools/testing",

    # Test fixtures (cdylib modules for integration testing)
    "server/lib/subsys/module-loader/tests/fixtures/test_module",
    "server/lib/subsys/module-loader/tests/fixtures/sample_module",
    "clients/tui/tests/fixtures/sample_client_module",
    "clients/lib/driver/tests/fixtures/minimal_client_module",
    "clients/lib/driver/tests/fixtures/incompatible_api_client_module",
    "clients/lib/driver/tests/fixtures/no_init_client_module",
    "clients/lib/driver/tests/fixtures/bare_client_module",
    "clients/lib/driver/tests/fixtures/panicking_client_module",
]
exclude = [
    # Python projects (not Rust)
    "tools/python-test-sdk",
]
default-members = ["apps/reovim"]

[workspace.package]
rust-version = "1.92"
version = "0.15.0-dev"
edition = "2024"
authors = ["ds1sqe(dukim) <ds1sqe@mensakorea.org>"]
license = "AGPL-3.0-only"
description = "A Rust-powered neovim-like text editor"
repository = "https://github.com/ds1sqe/reovim"
homepage = "https://github.com/ds1sqe/reovim"
readme = "README.md"
keywords = ["vim", "vi", "neovim", "editor", "terminal"]
categories = ["text-editors", "command-line-utilities"]

[workspace.metadata.workspaces]
allow_branch = "develop"

[workspace.metadata.docs.rs]
rustdoc-args = ["--document-private-items"]

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

[workspace.dependencies]
bitflags = "2.6.0"
parking_lot = "0.12.3"
futures = "0.3"
futures-timer = "3.0"
rand = "0.8"
regex = "1"

tokio = { version = "1.25", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
notify = "6.1"
tonic = "0.12"
async-trait = "0.1"
arc-swap = "1.7"
libc = "0.2"
rustix = { version="0.38.42", features = ["std", "stdio", "termios"]}
crossterm = {version="0.29", features = ["event-stream","filedescriptor"]}

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }
tracing-appender = "0.2"
chrono = "0.4"

# Shared crates
reovim-arch = { path = "./arch", version = "0.15.0-dev" }
reovim-protocol = { path = "./uapi/protocol", version = "0.15.0-dev" }
reovim-module-macros = { path = "./uapi/module-macros", version = "0.15.0-dev" }
reovim-driver-macros = { path = "./uapi/driver-macros", version = "0.15.0-dev" }
reovim-testing = { path = "./tools/testing", version = "0.15.0-dev" }
reovim-bench-utils = { path = "./lib/bench", version = "0.15.0-dev" }
reovim-domain = { path = "./lib/domain", version = "0.15.0-dev" }
reovim-domain-text = { path = "./ext/server/domain/text", version = "0.15.0-dev" }
reovim-domain-text-capabilities = { path = "./ext/server/domain/text/capabilities", version = "0.15.0-dev" }
reovim-domain-text-events = { path = "./ext/server/domain/text/events", version = "0.15.0-dev" }
reovim-domain-mesh = { path = "./ext/server/domain/mesh", version = "0.15.0-dev" }
reovim-input-codec = { path = "./uapi/input-codec", version = "0.15.0-dev" }
reovim-codec-tui-input = { path = "./ext/input-codec/tui", version = "0.15.0-dev" }
reovim-content-codec = { path = "./uapi/content-codec", version = "0.15.0-dev" }
reovim-content-codec-text = { path = "./ext/content-codec/text", version = "0.15.0-dev" }
reovim-subsys-net = { path = "./server/lib/subsys/net", version = "0.15.0-dev" }
reovim-driver-net-grpc = { path = "./ext/server/drivers/net-grpc", version = "0.15.0-dev" }
reovim-subsys-content-codec = { path = "./server/lib/subsys/content-codec", version = "0.15.0-dev" }

# Server crates
reovim-kernel = { path = "./server/lib/kernel", version = "0.15.0-dev" }
reovim-server = { path = "./server/lib/server", version = "0.15.0-dev" }

# Per-role standalone app crates (#769 Phase 2a).
reovim-app-server = { path = "./apps/server", version = "0.15.0-dev" }
reovim-app-tui = { path = "./apps/tui", version = "0.15.0-dev" }
reovim-app-cli = { path = "./apps/cli", version = "0.15.0-dev" }
reovim-app-web = { path = "./apps/web", version = "0.15.0-dev" }
