[workspace]
resolver = "2"
members = [
    # Top-level runner (thin wrapper)
    "apps/bin",

    # Server layer
    "server/lib/kernel",
    "server/lib/server",

    # Server drivers
    "server/lib/drivers/command-types",
    "server/lib/drivers/command",
    "server/lib/drivers/input",
    "server/lib/drivers/syntax",
    "server/lib/drivers/syntax-treesitter",
    "server/lib/drivers/lsp",
    "server/lib/drivers/vfs",
    "server/lib/drivers/session",
    "server/lib/drivers/undo",
    "server/lib/drivers/buffer",
    "server/lib/drivers/search",
    "server/lib/drivers/clipboard",
    "server/lib/drivers/ffi",
    "server/lib/drivers/ffi-python",
    "server/lib/drivers/picker",
    "server/lib/drivers/completion",
    "shared/depgraph",
    "server/lib/drivers/manifest",
    "server/lib/drivers/module-config",
    "server/lib/drivers/module-loader",
    "server/lib/drivers/git",
    "server/lib/drivers/module-registry",
    "server/lib/drivers/layout",
    "server/lib/drivers/annotation",
    "server/lib/drivers/statusline",
    "server/lib/drivers/codec",

    # Server modules
    "server/modules/vim",
    "server/modules/editor",
    "server/modules/motions",
    "server/modules/textobjects",
    "server/modules/commands",
    "server/modules/keymap",
    "server/modules/mode-manager",
    "server/modules/buffer-ops",
    "server/modules/buffer-simple",
    "server/modules/scratch-buffer",
    "server/modules/clipboard",
    "server/modules/search",
    "server/modules/undo",
    "server/modules/vfs-local",
    "server/modules/window-ops",
    "server/modules/treesitter-rust",
    "server/modules/treesitter-python",
    "server/modules/treesitter-c",
    "server/modules/treesitter-javascript",
    "server/modules/treesitter-typescript",
    "server/modules/treesitter-json",
    "server/modules/treesitter-toml",
    "server/modules/treesitter-bash",
    "server/modules/treesitter-go",
    "server/modules/cmdline",
    "server/modules/whichkey",
    "server/modules/notification",
    "server/modules/microscope",
    "server/modules/explorer",
    "server/modules/picker-files",
    "server/modules/picker-buffers",
    "server/modules/picker-commands",
    "server/modules/picker-grep",
    "server/modules/picker-options",
    "server/modules/treesitter-markdown",
    "server/modules/lsp",
    "server/modules/snippet",
    "server/modules/range-finder",
    "server/modules/completion",
    "server/modules/lsp-navigation",
    "server/modules/profiles",
    "server/modules/tetromino",
    "server/modules/health-check",
    "server/modules/git",
    "server/modules/picker-git-branches",
    "server/modules/picker-git-log",
    "server/modules/picker-git-status",
    "server/modules/picker-git-stash",
    "server/modules/git-signs",
    "server/modules/git-statusline",
    "server/modules/git-blame",
    "server/modules/module-manager",
    "server/modules/emacs",
    "server/modules/pair",
    "server/modules/context",
    "server/modules/sticky-context",
    "server/modules/indent-guide",
    "server/modules/settings",
    "server/modules/codec-utf8",
    "server/modules/codec-hex",
    "server/modules/codec-cjk",
    "server/modules/codec-legacy",

    # Client layer - TUI
    "clients/tui",
    "clients/tui/lib/drivers/tui",
    "clients/tui/lib/drivers/display",
    "clients/tui/lib/drivers/extension-loader",

    # Client extensions - TUI
    "clients/tui/extensions/which-key",
    "clients/tui/extensions/cmdline",
    "clients/tui/extensions/notification",
    "clients/tui/extensions/microscope",
    "clients/tui/extensions/completion",
    "clients/tui/extensions/explorer",
    "clients/tui/extensions/tetromino",
    "clients/tui/extensions/range-finder",
    "clients/tui/extensions/hover",
    "clients/tui/extensions/signature-help",
    "clients/tui/extensions/diagnostics",
    "clients/tui/extensions/markdown",
    "clients/tui/extensions/landing",
    "clients/tui/extensions/pair",
    "clients/tui/extensions/defaults",

    # Client layer - CLI
    "clients/cli",

    # Shared layer
    "shared/protocol",
    "shared/arch",
    "shared/net",
    "shared/log",
    "shared/trace",
    "shared/module-macros",
    "shared/capabilities",
    "shared/testing",

    # Shared clients layer
    "shared/clients/model",

    # Shared benchmarking utilities
    "shared/bench",

    # Tools (Rust only - reovim-testing is Python)
    "tools/bench",
    "tools/perf-report",

    # Test fixtures (cdylib modules for integration testing)
    "server/lib/drivers/module-loader/tests/fixtures/test_module",
]
exclude = [
    # Python projects (not Rust)
    "tools/reovim-testing",
]
default-members = ["apps/bin"]

[workspace.package]
rust-version = "1.92"
version = "0.11.0-dev"
edition = "2024"
authors = ["ds1sqe(dukim) <ds1sqe@mensakorea.org>"]
license = "AGPL-3.0-only"
description = "A Rust-powered neovim-like text editor"
repository = "https://github.com/ds1sqe/reovim"
homepage = "https://github.com/ds1sqe/reovim"
readme = "README.md"
keywords = ["vim", "vi", "neovim", "editor", "terminal"]
categories = ["text-editors", "command-line-utilities"]

[workspace.metadata.workspaces]
allow_branch = "develop"

[workspace.metadata.docs.rs]
rustdoc-args = ["--document-private-items"]

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

[workspace.dependencies]
bitflags = "2.6.0"
parking_lot = "0.12.3"
futures = "0.3"
futures-timer = "3.0"
rand = "0.8"
regex = "1"

tokio = { version = "1.25", features = ["full"] }
notify = "6.1"
tonic = "0.12"
rustix = { version="0.38.42", features = ["std", "stdio", "termios"]}
crossterm = {version="0.29", features = ["event-stream","filedescriptor"]}

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }
tracing-appender = "0.2"
chrono = "0.4"

# Shared crates
reovim-arch = { path = "./shared/arch", version = "0.11.0-dev" }
reovim-protocol = { path = "./shared/protocol", version = "0.11.0-dev" }
reovim-module-macros = { path = "./shared/module-macros", version = "0.11.0-dev" }
reovim-capabilities = { path = "./shared/capabilities", version = "0.11.0-dev" }
reovim-testing = { path = "./shared/testing", version = "0.11.0-dev" }
reovim-bench-utils = { path = "./shared/bench", version = "0.11.0-dev" }
reovim-net = { path = "./shared/net", version = "0.11.0-dev" }
reovim-log = { path = "./shared/log", version = "0.11.0-dev" }
reovim-trace = { path = "./shared/trace", version = "0.11.0-dev" }

# Server crates
reovim-kernel = { path = "./server/lib/kernel", version = "0.11.0-dev" }
reovim-server = { path = "./server/lib/server", version = "0.11.0-dev" }

# Server drivers
reovim-driver-command-types = { path = "./server/lib/drivers/command-types", version = "0.11.0-dev" }
reovim-driver-command = { path = "./server/lib/drivers/command", version = "0.11.0-dev" }
