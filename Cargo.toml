[workspace]
members = [
    # Existing lib crates
    "lib/core",
    "lib/sys",
    "lib/lsp",

    # New architecture layers
    "lib/arch",
    "lib/kernel",
    "lib/module-macros",

    # New driver crates
    "lib/drivers/display",
    "lib/drivers/input",
    "lib/drivers/syntax",
    "lib/drivers/lsp",
    "lib/drivers/net",
    "lib/drivers/vfs",
    "lib/drivers/log",

    # Runner and tools
    "runner/",
    "tools/*",

    # Plugins
    "plugins/features/*",
    "plugins/languages/*",

    # Policy modules (Mechanism vs Policy architecture)
    "modules/*",
]
default-members = ["runner/"]
resolver = "2"

[workspace.package]
rust-version = "1.92"
version = "0.8.1"
edition = "2024"
authors = ["ds1sqe(dukim) <ds1sqe@mensakorea.org>"]
license = "AGPL-3.0-only"
description = "A Rust-powered neovim-like text editor"
repository = "https://github.com/ds1sqe/reovim"
homepage = "https://github.com/ds1sqe/reovim"
readme = "README.md"
keywords = ["vim", "vi", "neovim", "editor", "terminal"]
categories = ["text-editors", "command-line-utilities"]

[workspace.metadata.workspaces]
allow_branch = "develop"

[workspace.metadata.docs.rs]
rustdoc-args = ["--document-private-items"]

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

[workspace.dependencies]
bitflags = "2.6.0"
parking_lot = "0.12.3"
futures = "0.3"
futures-timer = "3.0"

tokio = { version = "1.25", features = ["full"] }
rustix = { version="0.38.42", features = ["std", "stdio", "termios"]}
crossterm = {version="0.29", features = ["event-stream","filedescriptor"]}

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }
tracing-appender = "0.2"
chrono = "0.4"
# local libs
reovim-core = { path = "./lib/core", version = "0.8.1" }
reovim-sys = { path = "./lib/sys", version = "0.8.1" }
reovim-lsp = { path = "./lib/lsp", version = "0.8.1" }

# new architecture crates
reovim-arch = { path = "./lib/arch", version = "0.9.0-dev" }
reovim-kernel = { path = "./lib/kernel", version = "0.9.0-dev" }
reovim-module-macros = { path = "./lib/module-macros", version = "0.9.0-dev" }

# new driver crates
reovim-driver-display = { path = "./lib/drivers/display", version = "0.9.0-dev" }
reovim-driver-input = { path = "./lib/drivers/input", version = "0.9.0-dev" }
reovim-driver-syntax = { path = "./lib/drivers/syntax", version = "0.9.0-dev" }
reovim-driver-lsp = { path = "./lib/drivers/lsp", version = "0.9.0-dev" }
reovim-driver-net = { path = "./lib/drivers/net", version = "0.9.0-dev" }
reovim-driver-vfs = { path = "./lib/drivers/vfs", version = "0.9.0-dev" }
reovim-driver-log = { path = "./lib/drivers/log", version = "0.9.0-dev" }

# plugins
reovim-plugin-range-finder = { path = "./plugins/features/range-finder", version = "0.8.1" }
reovim-plugin-settings-menu = { path = "./plugins/features/settings-menu", version = "0.8.1" }
reovim-plugin-completion = { path = "./plugins/features/completion", version = "0.8.1" }
reovim-plugin-explorer = { path = "./plugins/features/explorer", version = "0.8.1" }
reovim-plugin-microscope = { path = "./plugins/features/microscope", version = "0.8.1" }
reovim-plugin-pickers = { path = "./plugins/features/pickers", version = "0.8.1" }
reovim-plugin-treesitter = { path = "./plugins/features/treesitter", version = "0.8.1" }
reovim-plugin-pair = { path = "./plugins/features/pair", version = "0.8.1" }
reovim-plugin-lsp = { path = "./plugins/features/lsp", version = "0.8.1" }
reovim-plugin-which-key = { path = "./plugins/features/which-key", version = "0.8.1" }
reovim-plugin-statusline = { path = "./plugins/features/statusline", version = "0.8.1" }
reovim-plugin-sticky-context = { path = "./plugins/features/sticky-context", version = "0.8.1" }
reovim-plugin-notification = { path = "./plugins/features/notification", version = "0.8.1" }
reovim-plugin-profiles = { path = "./plugins/features/profiles", version = "0.8.1" }
reovim-plugin-health-check = { path = "./plugins/features/health-check", version = "0.8.1" }
reovim-plugin-cmdline-completion = { path = "./plugins/features/cmdline-completion", version = "0.8.1" }
reovim-plugin-context = { path = "./plugins/features/context", version = "0.8.1" }
reovim-plugin-landing = { path = "./plugins/features/landing", version = "0.8.1" }

# language plugins
reovim-lang-rust = { path = "./plugins/languages/rust", version = "0.8.1" }
reovim-lang-c = { path = "./plugins/languages/c", version = "0.8.1" }
reovim-lang-javascript = { path = "./plugins/languages/javascript", version = "0.8.1" }
reovim-lang-python = { path = "./plugins/languages/python", version = "0.8.1" }
reovim-lang-json = { path = "./plugins/languages/json", version = "0.8.1" }
reovim-lang-toml = { path = "./plugins/languages/toml", version = "0.8.1" }
reovim-lang-markdown = { path = "./plugins/languages/markdown", version = "0.8.1" }
reovim-lang-bash = { path = "./plugins/languages/bash", version = "0.8.1" }

# Policy modules (Mechanism vs Policy architecture)
reovim-module-keymap = { path = "./modules/keymap", version = "0.9.0-dev" }
reovim-module-operators = { path = "./modules/operators", version = "0.9.0-dev" }
reovim-module-commands = { path = "./modules/commands", version = "0.9.0-dev" }
reovim-module-defaults = { path = "./modules/defaults", version = "0.9.0-dev" }
reovim-module-options = { path = "./modules/options", version = "0.9.0-dev" }
reovim-module-buffer-ops = { path = "./modules/buffer-ops", version = "0.9.0-dev" }
reovim-module-window-ops = { path = "./modules/window-ops", version = "0.9.0-dev" }
reovim-module-mode-manager = { path = "./modules/mode-manager", version = "0.9.0-dev" }

# CLI
clap = { version = "4", features = ["derive"] }
