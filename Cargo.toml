    "clients/cli",

    # Shared layer
    "shared/protocol",
    "shared/arch",
    "shared/net",
    "shared/log",
    "shared/trace",
    "shared/module-macros",
    "shared/capabilities",
    "shared/testing",

    # Shared clients layer
    "shared/clients/model",
    "shared/clients/driver",

    # Shared types
    "shared/domain",
    "shared/domains/text",

    # Shared domain events
    "shared/domains/text/events",

    # Shared benchmarking utilities
    "shared/bench",

    # Tools (Rust only - reovim-testing is Python)
    "tools/bench",
    "tools/perf-report",

    # Test fixtures (cdylib modules for integration testing)
    "server/lib/subsys/module-loader/tests/fixtures/test_module",
    "server/lib/subsys/module-loader/tests/fixtures/sample_module",
    "clients/tui/tests/fixtures/sample_client_module",
    "shared/clients/driver/tests/fixtures/minimal_client_module",
    "shared/clients/driver/tests/fixtures/incompatible_api_client_module",
    "shared/clients/driver/tests/fixtures/no_init_client_module",
    "shared/clients/driver/tests/fixtures/bare_client_module",
    "shared/clients/driver/tests/fixtures/panicking_client_module",
]
exclude = [
    # Python projects (not Rust)
    "tools/reovim-testing",
]
default-members = ["apps/bin"]

[workspace.package]
rust-version = "1.92"
version = "0.15.0-dev"
edition = "2024"
authors = ["ds1sqe(dukim) <ds1sqe@mensakorea.org>"]
license = "AGPL-3.0-only"
description = "A Rust-powered neovim-like text editor"
repository = "https://github.com/ds1sqe/reovim"
homepage = "https://github.com/ds1sqe/reovim"
readme = "README.md"
keywords = ["vim", "vi", "neovim", "editor", "terminal"]
categories = ["text-editors", "command-line-utilities"]

[workspace.metadata.workspaces]
allow_branch = "develop"

[workspace.metadata.docs.rs]
rustdoc-args = ["--document-private-items"]

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

[workspace.dependencies]
bitflags = "2.6.0"
parking_lot = "0.12.3"
futures = "0.3"
futures-timer = "3.0"
rand = "0.8"
regex = "1"

tokio = { version = "1.25", features = ["full"] }
notify = "6.1"
tonic = "0.12"
rustix = { version="0.38.42", features = ["std", "stdio", "termios"]}
crossterm = {version="0.29", features = ["event-stream","filedescriptor"]}

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }
tracing-appender = "0.2"
chrono = "0.4"

# Shared crates
reovim-arch = { path = "./shared/arch", version = "0.15.0-dev" }
reovim-protocol = { path = "./shared/protocol", version = "0.15.0-dev" }
reovim-module-macros = { path = "./shared/module-macros", version = "0.15.0-dev" }
