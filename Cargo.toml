# CLI
clap = { version = "4", features = ["derive"] }

# Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Clipboard
arboard = "3"

# Dynamic module loading
libloading = "0.8"
sha2 = "0.10"
hex = "0.4"

# Fuzzy matching
nucleo = "0.5"
ignore = "0.4"

# Encoding support
encoding_rs = "0.8"
