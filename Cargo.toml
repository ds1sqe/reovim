    "server/lib/subsys/annotation",
    "server/lib/subsys/statusline",
    "server/lib/drivers/codec",
    "server/lib/drivers/codec-xxd",

    # Providers (domain logic, above drivers)
    "server/lib/providers/text",

    # Server modules
    "server/modules/vim",
    "server/modules/editor",
    "server/modules/motions",
    "server/modules/textobjects",
    "server/modules/commands",
    "server/modules/keymap",
    "server/modules/layout",
    "server/modules/mode-manager",
    "server/modules/buffer-ops",
    "server/modules/buffer-simple",
    "server/modules/scratch-buffer",
    "server/modules/clipboard",
    "server/modules/search",
    "server/modules/undo",
    "server/modules/vfs-local",
    "server/modules/window-ops",
    "server/modules/treesitter-rust",
    "server/modules/treesitter-python",
    "server/modules/treesitter-c",
    "server/modules/treesitter-javascript",
    "server/modules/treesitter-typescript",
    "server/modules/treesitter-json",
    "server/modules/treesitter-toml",
