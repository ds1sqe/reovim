[workspace]
members = ["lib/*", "runner/", "tools/*", "plugins/features/*", "plugins/languages/*"]
default-members = ["runner/"]
resolver = "2"

[workspace.package]
rust-version = "1.92"
version = "0.8.0"
edition = "2024"
authors = ["ds1sqe(dukim) <ds1sqe@mensakorea.org>"]
license = "AGPL-3.0-only"
description = "A Rust-powered neovim-like text editor"
repository = "https://github.com/ds1sqe/reovim"
homepage = "https://github.com/ds1sqe/reovim"
readme = "README.md"
keywords = ["vim", "vi", "neovim", "editor", "terminal"]
categories = ["text-editors", "command-line-utilities"]

[workspace.metadata.workspaces]
allow_branch = "develop"

[workspace.metadata.docs.rs]
rustdoc-args = ["--document-private-items"]

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

[workspace.dependencies]
bitflags = "2.6.0"
parking_lot = "0.12.3"
futures = "0.3"
futures-timer = "3.0"

tokio = { version = "1.25", features = ["full"] }
rustix = { version="0.38.42", features = ["std", "stdio", "termios"]}
crossterm = {version="0.29", features = ["event-stream","filedescriptor"]}

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }
tracing-appender = "0.2"
chrono = "0.4"
# local libs
reovim-core = { path = "./lib/core", version = "0.8.0" }
reovim-sys = { path = "./lib/sys", version = "0.8.0" }
reovim-lsp = { path = "./lib/lsp", version = "0.8.0" }

# plugins
reovim-plugin-range-finder = { path = "./plugins/features/range-finder", version = "0.8.0" }
reovim-plugin-settings-menu = { path = "./plugins/features/settings-menu", version = "0.8.0" }
reovim-plugin-completion = { path = "./plugins/features/completion", version = "0.8.0" }
reovim-plugin-explorer = { path = "./plugins/features/explorer", version = "0.8.0" }
reovim-plugin-microscope = { path = "./plugins/features/microscope", version = "0.8.0" }
reovim-plugin-pickers = { path = "./plugins/features/pickers", version = "0.8.0" }
reovim-plugin-treesitter = { path = "./plugins/features/treesitter", version = "0.8.0" }
reovim-plugin-pair = { path = "./plugins/features/pair", version = "0.8.0" }
reovim-plugin-lsp = { path = "./plugins/features/lsp", version = "0.8.0" }
reovim-plugin-which-key = { path = "./plugins/features/which-key", version = "0.8.0" }
reovim-plugin-statusline = { path = "./plugins/features/statusline", version = "0.8.0" }
reovim-plugin-sticky-context = { path = "./plugins/features/sticky-context", version = "0.8.0" }
reovim-plugin-notification = { path = "./plugins/features/notification", version = "0.8.0" }
reovim-plugin-profiles = { path = "./plugins/features/profiles", version = "0.8.0" }
reovim-plugin-health-check = { path = "./plugins/features/health-check", version = "0.8.0" }
reovim-plugin-cmdline-completion = { path = "./plugins/features/cmdline-completion", version = "0.8.0" }
reovim-plugin-context = { path = "./plugins/features/context", version = "0.8.0" }

# language plugins
reovim-lang-rust = { path = "./plugins/languages/rust", version = "0.8.0" }
reovim-lang-c = { path = "./plugins/languages/c", version = "0.8.0" }
reovim-lang-javascript = { path = "./plugins/languages/javascript", version = "0.8.0" }
reovim-lang-python = { path = "./plugins/languages/python", version = "0.8.0" }
reovim-lang-json = { path = "./plugins/languages/json", version = "0.8.0" }
reovim-lang-toml = { path = "./plugins/languages/toml", version = "0.8.0" }
reovim-lang-markdown = { path = "./plugins/languages/markdown", version = "0.8.0" }
reovim-lang-bash = { path = "./plugins/languages/bash", version = "0.8.0" }

# CLI
clap = { version = "4", features = ["derive"] }
