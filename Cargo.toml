[workspace]
resolver = "2"
members = [
    # Top-level runner (thin wrapper)
    "apps/bin",

    # Server layer
    "server/lib/kernel",
    "server/lib/server",

    # Server drivers
    "server/lib/drivers/command-types",
    "server/lib/drivers/command",
    "server/lib/drivers/input",
    "server/lib/drivers/syntax",
    "server/lib/drivers/syntax-treesitter",
    "server/lib/drivers/lsp",
    "server/lib/drivers/vfs",
    "server/lib/drivers/session",
    "server/lib/drivers/undo",
    "server/lib/drivers/buffer",
    "server/lib/drivers/search",
    "server/lib/drivers/clipboard",
    "server/lib/drivers/ffi",
    "server/lib/drivers/ffi-python",
    "server/lib/drivers/picker",
    "server/lib/drivers/completion",

    # Server modules
    "server/modules/vim",
    "server/modules/editor",
    "server/modules/motions",
    "server/modules/textobjects",
    "server/modules/commands",
    "server/modules/keymap",
    "server/modules/mode-manager",
    "server/modules/options",
    "server/modules/buffer-ops",
    "server/modules/buffer-simple",
    "server/modules/scratch-buffer",
    "server/modules/clipboard",
    "server/modules/search",
    "server/modules/undo",
    "server/modules/vfs-local",
    "server/modules/window-ops",
    "server/modules/defaults",
    "server/modules/treesitter-rust",
    "server/modules/cmdline",
    "server/modules/whichkey",
    "server/modules/notification",
    "server/modules/microscope",
    "server/modules/explorer",
    "server/modules/picker-files",
    "server/modules/picker-buffers",
    "server/modules/picker-commands",
    "server/modules/picker-grep",
    "server/modules/treesitter-markdown",
    "server/modules/lsp",
    "server/modules/snippet",
    "server/modules/range-finder",
    "server/modules/completion",
    "server/modules/lsp-navigation",
    "server/modules/vim-lsp",
    "server/modules/vim-microscope",
    "server/modules/vim-explorer",
    "server/modules/vim-completion",
    "server/modules/vim-range-finder",
    "server/modules/vim-snippet",
    "server/modules/tetromino",

    # Client layer - TUI
    "clients/tui",
    "clients/tui/lib/drivers/tui",
    "clients/tui/lib/drivers/display",

    # Client extensions - TUI
    "clients/tui/extensions/which-key",
    "clients/tui/extensions/cmdline",
    "clients/tui/extensions/notification",
    "clients/tui/extensions/microscope",
    "clients/tui/extensions/completion",
    "clients/tui/extensions/explorer",
    "clients/tui/extensions/tetromino",
    "clients/tui/extensions/range-finder",
    "clients/tui/extensions/hover",
    "clients/tui/extensions/signature-help",
    "clients/tui/extensions/diagnostics",
    "clients/tui/extensions/defaults",

    # Client layer - CLI
    "clients/cli",

    # Shared layer
    "shared/protocol",
    "shared/arch",
    "shared/net",
    "shared/log",
    "shared/trace",
    "shared/module-macros",
    "shared/testing",

    # Shared clients layer
    "shared/clients/model",

    # Shared benchmarking utilities
    "shared/bench",

    # Tools (Rust only - reovim-testing is Python)
    "tools/bench",
    "tools/perf-report",
]
exclude = [
    # Python projects (not Rust)
    "tools/reovim-testing",
]
default-members = ["apps/bin"]

[workspace.package]
rust-version = "1.92"
version = "0.10.0-dev"
edition = "2024"
authors = ["ds1sqe(dukim) <ds1sqe@mensakorea.org>"]
license = "AGPL-3.0-only"
description = "A Rust-powered neovim-like text editor"
repository = "https://github.com/ds1sqe/reovim"
homepage = "https://github.com/ds1sqe/reovim"
readme = "README.md"
keywords = ["vim", "vi", "neovim", "editor", "terminal"]
categories = ["text-editors", "command-line-utilities"]

[workspace.metadata.workspaces]
allow_branch = "develop"

[workspace.metadata.docs.rs]
rustdoc-args = ["--document-private-items"]

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

[workspace.dependencies]
bitflags = "2.6.0"
parking_lot = "0.12.3"
futures = "0.3"
futures-timer = "3.0"
rand = "0.8"
regex = "1"

tokio = { version = "1.25", features = ["full"] }
tonic = "0.12"
rustix = { version="0.38.42", features = ["std", "stdio", "termios"]}
crossterm = {version="0.29", features = ["event-stream","filedescriptor"]}

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }
tracing-appender = "0.2"
chrono = "0.4"

# Shared crates
reovim-arch = { path = "./shared/arch", version = "0.10.0-dev" }
reovim-protocol = { path = "./shared/protocol", version = "0.10.0-dev" }
reovim-module-macros = { path = "./shared/module-macros", version = "0.10.0-dev" }
reovim-testing = { path = "./shared/testing", version = "0.10.0-dev" }
reovim-bench-utils = { path = "./shared/bench", version = "0.10.0-dev" }
reovim-net = { path = "./shared/net", version = "0.10.0-dev" }
reovim-log = { path = "./shared/log", version = "0.10.0-dev" }
reovim-trace = { path = "./shared/trace", version = "0.10.0-dev" }

# Server crates
reovim-kernel = { path = "./server/lib/kernel", version = "0.10.0-dev" }
reovim-server = { path = "./server/lib/server", version = "0.10.0-dev" }

# Server drivers
reovim-driver-command-types = { path = "./server/lib/drivers/command-types", version = "0.10.0-dev" }
reovim-driver-command = { path = "./server/lib/drivers/command", version = "0.10.0-dev" }
reovim-driver-input = { path = "./server/lib/drivers/input", version = "0.10.0-dev" }
reovim-driver-syntax = { path = "./server/lib/drivers/syntax", version = "0.10.0-dev" }
reovim-driver-syntax-treesitter = { path = "./server/lib/drivers/syntax-treesitter", version = "0.10.0-dev" }
reovim-driver-lsp = { path = "./server/lib/drivers/lsp", version = "0.10.0-dev" }
reovim-driver-vfs = { path = "./server/lib/drivers/vfs", version = "0.10.0-dev" }
reovim-driver-session = { path = "./server/lib/drivers/session", version = "0.10.0-dev" }
reovim-driver-undo = { path = "./server/lib/drivers/undo", version = "0.10.0-dev" }
reovim-driver-buffer = { path = "./server/lib/drivers/buffer", version = "0.10.0-dev" }
reovim-driver-search = { path = "./server/lib/drivers/search", version = "0.10.0-dev" }
reovim-driver-clipboard = { path = "./server/lib/drivers/clipboard", version = "0.10.0-dev" }
reovim-driver-ffi = { path = "./server/lib/drivers/ffi", version = "0.10.0-dev" }
reovim-driver-ffi-python = { path = "./server/lib/drivers/ffi-python", version = "0.10.0-dev" }
reovim-driver-picker = { path = "./server/lib/drivers/picker", version = "0.10.0-dev" }
reovim-driver-completion = { path = "./server/lib/drivers/completion", version = "0.10.0-dev" }

# Client drivers (TUI-specific)
reovim-driver-tui = { path = "./clients/tui/lib/drivers/tui", version = "0.10.0-dev" }
reovim-driver-display = { path = "./clients/tui/lib/drivers/display", version = "0.10.0-dev" }

# Client crates
reovim-client-tui = { path = "./clients/tui", version = "0.10.0-dev" }
reovim-client-cli = { path = "./clients/cli", version = "0.10.0-dev" }

# Common client model (platform-agnostic abstractions)
reovim-client-model = { path = "./shared/clients/model", version = "0.10.0-dev" }

# Application binary
reovim-app = { path = "./apps/bin", version = "0.10.0-dev" }

# Python FFI
pyo3 = { version = "0.27", features = ["auto-initialize"] }

# Server modules
reovim-module-vim = { path = "./server/modules/vim", version = "0.10.0-dev" }
reovim-module-editor = { path = "./server/modules/editor", version = "0.10.0-dev" }
reovim-module-motions = { path = "./server/modules/motions", version = "0.10.0-dev" }
reovim-module-textobjects = { path = "./server/modules/textobjects", version = "0.10.0-dev" }
reovim-module-commands = { path = "./server/modules/commands", version = "0.10.0-dev" }
reovim-module-keymap = { path = "./server/modules/keymap", version = "0.10.0-dev" }
reovim-module-mode-manager = { path = "./server/modules/mode-manager", version = "0.10.0-dev" }
reovim-module-options = { path = "./server/modules/options", version = "0.10.0-dev" }
reovim-module-buffer-ops = { path = "./server/modules/buffer-ops", version = "0.10.0-dev" }
reovim-module-buffer-simple = { path = "./server/modules/buffer-simple", version = "0.10.0-dev" }
reovim-module-scratch-buffer = { path = "./server/modules/scratch-buffer", version = "0.10.0-dev" }
reovim-module-clipboard = { path = "./server/modules/clipboard", version = "0.10.0-dev" }
reovim-module-search = { path = "./server/modules/search", version = "0.10.0-dev" }
reovim-module-undo = { path = "./server/modules/undo", version = "0.10.0-dev" }
reovim-module-vfs-local = { path = "./server/modules/vfs-local", version = "0.10.0-dev" }
reovim-module-window-ops = { path = "./server/modules/window-ops", version = "0.10.0-dev" }
reovim-module-defaults = { path = "./server/modules/defaults", version = "0.10.0-dev" }
reovim-module-treesitter-rust = { path = "./server/modules/treesitter-rust", version = "0.10.0-dev" }
reovim-module-cmdline = { path = "./server/modules/cmdline", version = "0.10.0-dev" }
reovim-module-whichkey = { path = "./server/modules/whichkey", version = "0.10.0-dev" }
reovim-module-notification = { path = "./server/modules/notification", version = "0.10.0-dev" }
reovim-module-microscope = { path = "./server/modules/microscope", version = "0.10.0-dev" }
reovim-module-explorer = { path = "./server/modules/explorer", version = "0.10.0-dev" }
reovim-picker-files = { path = "./server/modules/picker-files", version = "0.10.0-dev" }
reovim-picker-buffers = { path = "./server/modules/picker-buffers", version = "0.10.0-dev" }
reovim-picker-commands = { path = "./server/modules/picker-commands", version = "0.10.0-dev" }
reovim-picker-grep = { path = "./server/modules/picker-grep", version = "0.10.0-dev" }
reovim-module-treesitter-markdown = { path = "./server/modules/treesitter-markdown", version = "0.10.0-dev" }
reovim-module-lsp = { path = "./server/modules/lsp", version = "0.10.0-dev" }
reovim-module-snippet = { path = "./server/modules/snippet", version = "0.10.0-dev" }
reovim-module-range-finder = { path = "./server/modules/range-finder", version = "0.10.0-dev" }
reovim-module-completion = { path = "./server/modules/completion", version = "0.10.0-dev" }
reovim-module-lsp-navigation = { path = "./server/modules/lsp-navigation", version = "0.10.0-dev" }
reovim-module-vim-lsp = { path = "./server/modules/vim-lsp", version = "0.10.0-dev" }
reovim-module-vim-microscope = { path = "./server/modules/vim-microscope", version = "0.10.0-dev" }
reovim-module-vim-explorer = { path = "./server/modules/vim-explorer", version = "0.10.0-dev" }
reovim-module-vim-completion = { path = "./server/modules/vim-completion", version = "0.10.0-dev" }
reovim-module-vim-range-finder = { path = "./server/modules/vim-range-finder", version = "0.10.0-dev" }
reovim-module-vim-snippet = { path = "./server/modules/vim-snippet", version = "0.10.0-dev" }
reovim-module-tetromino = { path = "./server/modules/tetromino", version = "0.10.0-dev" }

# CLI
clap = { version = "4", features = ["derive"] }

# Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Clipboard
arboard = "3"

# Fuzzy matching
nucleo = "0.5"
ignore = "0.4"
