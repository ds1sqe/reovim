reovim-driver-clipboard = { path = "./server/lib/drivers/clipboard", version = "0.11.0-dev" }
reovim-driver-ffi = { path = "./server/lib/drivers/ffi", version = "0.11.0-dev" }
reovim-driver-ffi-python = { path = "./server/lib/drivers/ffi-python", version = "0.11.0-dev" }
reovim-driver-picker = { path = "./server/lib/drivers/picker", version = "0.11.0-dev" }
reovim-driver-completion = { path = "./server/lib/drivers/completion", version = "0.11.0-dev" }
reovim-depgraph = { path = "./shared/depgraph", version = "0.11.0-dev" }
reovim-driver-manifest = { path = "./server/lib/drivers/manifest", version = "0.11.0-dev" }
