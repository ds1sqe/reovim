[workspace]
resolver = "2"
members = ["lib/depgraph"]
exclude = ["archive"]

[workspace.package]
rust-version = "1.92"
version = "0.16.0-dev"
edition = "2024"
authors = ["ds1sqe(dukim) <ds1sqe@mensakorea.org>"]
license = "AGPL-3.0-only"
description = "A Rust-powered modal editor"
repository = "https://github.com/ds1sqe/reovim"
homepage = "https://github.com/ds1sqe/reovim"
readme = "README.md"
keywords = ["vim", "vi", "neovim", "editor", "terminal"]
categories = ["text-editors", "command-line-utilities"]

[workspace.metadata.workspaces]
allow_branch = "develop"

[workspace.metadata.docs.rs]
rustdoc-args = ["--document-private-items"]

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# [workspace.dependencies] is intentionally absent — this is the visible L9
# marker (1.2 §9 Dependency Sovereignty). No third-party crate version is
# catalogued here; the workspace graph is closed to std + in-repo path deps.

# FFI-boundary panic isolation requires `panic = "unwind"`. `panic = "abort"`
# + FFI is undefined behaviour: a panicking `extern "C"` function unwinding
# across the C ABI is UB with `abort`; Rust is only allowed to convert the
# panic into an aborting trap. Every driver and module cdylib catches panics
# at the trampoline boundary via `catch_unwind`, which requires unwind.
# A CI grep over `**/Cargo.toml` forbids `panic = "abort"` anywhere in the
# workspace.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
