[workspace]
resolver = "3"
members = [
    "../modules/open",
    "../modules/context",
    "../modules/text",
    "../modules/source",
    "../modules/example",
    "../modules/env",
    "../modules/dump",
    "../lib/bitflags",
    "../lib/vtable",
    "../lib/module",
    "../lib/call",
    "../apps/server",
    "../domain/basic",
    "../host/reference",
    "../kernel/interface",
    "../kernel/runtime",
    "../representation/basic",
    "../resource/local",
    "../sdk/rust",
    "../modules/counter",
    "../modules/editing",
    "../modules/dmesg",
    "../modules/cat",
    "../modules/read",
    "../modules/write",
    "../modules/ls",
    "../modules/tree",
    "../modules/cd",
    "../modules/pwd",
    "../modules/close",
    "../modules/help",
    "../modules/exit",
    "../host/service",
    "../apps/cli",
]
default-members = [
    "../modules/open",
    "../modules/context",
    "../modules/text",
    "../modules/source",
    "../modules/example",
    "../modules/env",
    "../modules/dump",
    "../lib/bitflags",
    "../lib/vtable",
    "../lib/module",
    "../lib/call",
    "../apps/server",
    "../domain/basic",
    "../host/reference",
    "../kernel/interface",
    "../kernel/runtime",
    "../representation/basic",
    "../resource/local",
    "../sdk/rust",
    "../modules/counter",
    "../modules/editing",
    "../modules/dmesg",
    "../modules/cat",
    "../modules/read",
    "../modules/write",
    "../modules/ls",
    "../modules/tree",
    "../modules/cd",
    "../modules/pwd",
    "../modules/close",
    "../modules/help",
    "../modules/exit",
    "../host/service",
    "../apps/cli",
]

[workspace.package]
version = "0.16.0-dev"
edition = "2024"
rust-version = "1.92"
authors = ["ds1sqe(dukim) <ds1sqe@mensakorea.org>"]
license = "AGPL-3.0-only"
repository = "https://github.com/ds1sqe/reovim"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
excessive_nesting = "forbid"
