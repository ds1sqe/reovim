[package]
name = "reovim-driver-ffi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "FFI driver for reovim (C header generation and external module support)"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
# Kernel layer (FFI types)
reovim-kernel = { workspace = true }
# Text types (YankType)
reovim-domain-text = { workspace = true }

# Session driver (for SessionRuntime access in FFI bridge)
reovim-driver-session = { workspace = true }

# Command types (CommandContext, CommandResult)
reovim-driver-command-types = { workspace = true }

# FFI support
libc = "0.2"

# Logging for FFI wrappers
tracing = "0.1"

# Note: cbindgen is not used because it cannot access types from reovim-kernel.
# The C header (include/reovim.h) is manually maintained instead.
