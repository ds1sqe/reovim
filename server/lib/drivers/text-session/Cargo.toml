[package]
name = "reovim-driver-text-session"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Session driver for reovim - provides traits for session management"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# Kernel types for ModeId, BufferId, etc.
reovim-kernel = { workspace = true }
# Buffer moved to provider-text (#740)
reovim-provider-text = { workspace = true }
# Text types (Position, Edit, RegisterContent, etc.)
reovim-domain-text = { workspace = true }
# Text-domain events for dual-emission transition (#740 Plan 09 Phase 6)
reovim-domain-text-events = { workspace = true }
# Command types for CommandContext, CommandResult (avoids circular dependency)
reovim-subsys-command-types = { workspace = true }
# Layout driver for compositor traits (Rect, WindowPlacement, etc.)
reovim-subsys-layout = { workspace = true }
# Domain coordination contracts (Position/Cursor traits, codecs)
reovim-subsys-coordination = { workspace = true }
# Input subsystem contracts (KeyEvent)
reovim-subsys-input = { workspace = true }
# Session subsystem contracts (types + traits, zero domain deps)
reovim-subsys-session = { workspace = true }
# Platform abstraction (RwLock for test buffer manager)
reovim-arch = { workspace = true }
# Clipboard driver for system clipboard and history (RegisterApi routing)
reovim-subsys-clipboard = { workspace = true }
# Undo driver for UndoApi implementation
reovim-driver-text-undo = { workspace = true }
# Search driver for Direction type (SearchState)
reovim-driver-text-search = { workspace = true }
# JSON serialization for extension state bridges (#514)
serde_json = { workspace = true }
# Thread-safe queue for pending notifications (#542)
parking_lot = { workspace = true }

[dev-dependencies]
# VFS driver for MockUndoProvider's persist/load methods in tests
reovim-subsys-vfs = { workspace = true }
# Buffer moved to provider-text (#740); tests use it via dev-dep
reovim-provider-text = { workspace = true }
