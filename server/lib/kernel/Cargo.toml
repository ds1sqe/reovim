[package]
name = "reovim-kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Kernel boot core — Init/Kernel typestate, boot-stage driver, BootClock (2.1, 2.2, LF13)"
publish = false

[features]
# Compiles per-module sibling test files INTO the lib (L12.1 layout).
# Tests register via reovim_arch::arch_test! and run on the arch no_std
# selftest runner. Off in flight builds; the selftest bin enables it.
# The selftest bin in tests/fixtures/ enables it.
# Enables arch/selftest so reovim_arch::testrt and arch_test! are available.
selftest = ["reovim-arch/selftest", "reovim-subsys-domain/selftest"]

# Runtime lang items (panic_handler, _start, allocator). Needed by the
# selftest bin and panic-path fixture bins in server/lib/kernel/tests/fixtures/.
# Must NOT be enabled in the workspace rlib build (same constraint as arch/).
runtime = ["reovim-arch/runtime"]

[dependencies]
reovim-arch = { path = "../../../arch" }
# Portable heap-DS algorithms (Seq/Map/Bytes/Ring/Mutex/RwLock — the kernel's
# Vec/HashMap/String/Arc/lock analogs). Relocated from `reovim_arch::ds`/
# `::sync` into `reovim-lib-ds` (SP03); the kernel names lib/ds, never arch's
# (now-gone) ds/sync modules.
reovim-lib-ds = { path = "../../../lib/ds" }
# `AllocError` is named directly from the kabi contract (master invariant 2:
# its canonical home is kabi, not arch — the SP02 arch re-export is gone).
reovim-kabi-platform = { path = "../../../kabi/platform" }
reovim-uapi-abi = { path = "../../../uapi/abi" }
reovim-subsys-domain = { path = "../subsys/domain" }

[lints]
workspace = true
