[package]
name = "reovim-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Reovim server - the editing engine"
repository.workspace = true
homepage.workspace = true

[features]
default = ["grpc-web"]
grpc = ["reovim-protocol/grpc", "dep:tonic", "dep:tokio-stream", "dep:futures", "dep:async-stream"]
grpc-web = ["grpc", "dep:tonic-web", "dep:tower-http"]

[dependencies]
# Core crates
reovim-kernel = { workspace = true }
reovim-protocol = { workspace = true }
reovim-arch = { workspace = true }

# Subsystem contracts (zero domain deps)
reovim-subsys-command = { workspace = true }
reovim-subsys-command-types = { workspace = true }
reovim-subsys-input = { workspace = true }
reovim-subsys-layout = { workspace = true }
reovim-subsys-session = { workspace = true }
reovim-subsys-syntax = { workspace = true }
reovim-subsys-vfs = { workspace = true }

# Drivers (domain-locked — Tier 2 decoupling deferred)
reovim-driver-buffer = { workspace = true }
reovim-driver-codec = { workspace = true }
reovim-driver-command = { workspace = true }
reovim-driver-input = { workspace = true }
reovim-driver-session = { workspace = true }
reovim-driver-syntax = { workspace = true }

# Async
tokio = { workspace = true, features = ["full", "sync", "rt-multi-thread"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }

# Concurrency
arc-swap = "1.7"
parking_lot = "0.12"

# Token generation
rand = { workspace = true }

# gRPC (optional)
tonic = { version = "0.12", optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
futures = { workspace = true, optional = true }
async-stream = { version = "0.3", optional = true }

# gRPC-Web (optional, extends grpc)
tonic-web = { version = "0.12", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }

[dev-dependencies]
tempfile = "3.0"
reovim-driver-buffer = { workspace = true }
reovim-testing = { workspace = true }
reovim-client-cli = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
