[package]
name = "reovim-subsys-net"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Subsys-level gRPC server-driver contracts for reovim"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# Contract-only deps. The subsys expresses the gRPC server-driver
# lifecycle; it does NOT implement it.
#
# `tonic` is kept on purpose — `GrpcServerDriver::serve` takes a
# `tonic::transport::server::Router` parameter. The subsys is
# intentionally tonic-shaped; driver implementations under
# `ext/server/drivers/net-*/` pair with it. Do not strip this dep
# thinking it is accidental coupling.
tonic = { workspace = true }

async-trait = { workspace = true }
arc-swap = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
