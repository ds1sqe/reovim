[package]
name = "reovim-subsys-driver-loader"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Server driver-loader subsystem: safe wrappers over runtime-loaded driver cdylibs"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
reovim-subsys-net = { workspace = true }
reovim-dylib-loader = { workspace = true }
reovim-kernel = { workspace = true }
thiserror = "2"

[dev-dependencies]
# tokio for the async integration test (AsyncFd + spawn_blocking +
# TcpStream + timeout). Workspace tokio enables the `full` feature set
# so we inherit it without further selection here.
tokio = { workspace = true }
libc = { workspace = true }
reovim-driver-net-grpc = { workspace = true }
# Dev-only tonic/tower/http stack so the unit tests can construct a
# `ServiceDescriptor` to exercise the non-empty-descriptor guard in
# `LoadedNetGrpc::serve`. Mirrors `server/lib/subsys/net`'s dev-deps.
tonic = { workspace = true }
tower = { version = "0.5.3", features = ["util"] }
http = "1.4.0"
http-body-util = "0.1.3"
bytes = "1.11.1"
# tempfile for from_path_scan integration test that stages a real
# cdylib in a synthetic <root>/driver/ tree.
tempfile = "3"
