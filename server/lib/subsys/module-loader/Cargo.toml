[package]
name = "reovim-subsys-module-loader"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Dynamic module loader with search path discovery, FFI loading, registry, and lock file support"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
reovim-kernel = { workspace = true }
reovim-arch = { workspace = true }
reovim-depgraph = { workspace = true }
reovim-dylib-loader = { workspace = true }
reovim-pkg-lazyload = { path = "../../../../lib/pkg-lazyload", version = "0.15.0-dev" }
reovim-pkg-runtime-loader = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

# Optional: hot reload (development only)
notify = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[features]
hot-reload = ["dep:notify", "dep:tokio"]

[dev-dependencies]
libloading = { workspace = true }
reovim-pkg-lockfile = { path = "../../../../lib/pkg-lockfile", version = "0.15.0-dev" }
tempfile = "3"
