[package]
name = "reovim-subsys-buffer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Buffer subsys: byte-container trait + multi-codec attachment ABI"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# Kernel provides BufferId, ByteEdit, and the repr(C) Version type used
# in the ABI vtable header.
reovim-kernel = { workspace = true }
# ByteNotifiable is the codec-attachment interface; this crate is the
# authoritative source so subsys-buffer does not need a separate codec
# registry dependency.
reovim-content-codec = { workspace = true }
# broadcast::Receiver<ByteEdit> is the async subscription return type
# on BufferSubscribable; features = ["sync"] is sufficient but the
# workspace declares features = ["full"] which is a superset.
tokio = { workspace = true }
# Structured error derives.
thiserror = "2"
