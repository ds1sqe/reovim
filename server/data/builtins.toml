# Canonical list of builtin server modules (#620).
#
# This file replaces the compile-time DefaultsModule registry with a
# data-driven manifest. Bootstrap reads this file and loads modules
# either statically (via feature flag) or dynamically (via .so files).
#
# Fields:
#   id       - Module identifier (matches Module::id())
#   tier     - Initialization tier (1 = service, 2 = utility, 3 = policy, 4 = feature)
#   library  - Shared library name (without lib prefix or .so suffix)
#
# Tier ordering provides a hint for canonical init order. Within a tier,
# modules are listed in declaration order. The depgraph resolver determines
# actual initialization order based on declared dependencies.

[[modules]]
id = "undo"
tier = 1
library = "reovim_module_undo"

