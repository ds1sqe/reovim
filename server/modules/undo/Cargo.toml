[package]
name = "reovim-module-undo"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Undo module for reovim - per-buffer undo/redo with persistence"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
# Kernel types
reovim-kernel = { workspace = true }
reovim-capabilities = { workspace = true }

# Text types (Position, Edit)
reovim-types-text = { workspace = true }

# Driver for UndoProvider trait
reovim-driver-undo = { workspace = true }

# VFS driver for persistence
reovim-driver-vfs = { workspace = true }

# Protocol for serialization - v0.9.3 for gRPC v2 protocol (Epic #465)
reovim-protocol = { workspace = true }

# Platform abstraction for RwLock
reovim-arch = { workspace = true }

# Module macros for FFI entry points
reovim-module-macros = { workspace = true }

# Logging
tracing.workspace = true

# [dev-dependencies] removed - tests to be rewritten with new infrastructure

[features]
# Enable for building as standalone dynamic library
dynamic = []
