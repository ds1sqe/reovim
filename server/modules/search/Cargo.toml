[package]
name = "reovim-module-search"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Search module for reovim - regex-based pattern matching"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
# Kernel types
reovim-kernel = { workspace = true }
reovim-domain-text = { workspace = true }
reovim-capabilities = { workspace = true }

# Driver for SearchProvider trait
reovim-driver-text-search = { workspace = true }

# Buffer moved to provider-text (#740)
reovim-provider-text = { workspace = true }

# Module macros for FFI entry points
reovim-module-macros = { workspace = true }

# Regex engine
regex = "1.10"

# Logging
tracing.workspace = true

# [dev-dependencies] removed - tests to be rewritten with new infrastructure

[features]
# Enable for building as standalone dynamic library
dynamic = []
