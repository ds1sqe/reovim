[package]
name = "reovim-module-codec-utf8"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "UTF-8 content codec module for reovim"
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
# Kernel layer - for Module trait
reovim-kernel = { workspace = true }
reovim-capabilities = { workspace = true }

# Driver layer - implements ContentCodec, ContentClassifier, ContentCodecFactory
reovim-driver-codec = { workspace = true }

# Domain trait and text types for Decode<Text>/Encode<Text>/Index<Text>
reovim-domain = { workspace = true }
reovim-types-text = { workspace = true }

# ByteEdit moved to reovim-kernel::block (#740)

# Module macros for FFI entry points
reovim-module-macros = { workspace = true }

# Logging
tracing = { workspace = true }

[dev-dependencies]
reovim-testing = { workspace = true }

[features]
# Enable for building as standalone dynamic library
dynamic = []
