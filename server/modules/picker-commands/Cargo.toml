[package]
name = "reovim-picker-commands"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command picker module for reovim - command palette for registered commands"
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
dynamic = []  # Enable FFI entry points for standalone dynamic loading

[dependencies]
reovim-kernel = { workspace = true }
reovim-driver-picker = { workspace = true }
reovim-driver-session = { workspace = true }
reovim-subsys-command-types = { workspace = true }
reovim-module-macros = { workspace = true }

[lints]
workspace = true
