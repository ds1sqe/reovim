[package]
name = "reovim-module-treesitter-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Rust syntax highlighting module for reovim"
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
# Kernel layer - for Module trait
reovim-kernel = { workspace = true }
reovim-capabilities = { workspace = true }

# Driver layer - implements SyntaxDriverFactory
reovim-driver-syntax = { workspace = true }
reovim-driver-syntax-treesitter = { workspace = true }

# Module macros for FFI entry points
reovim-module-macros = { workspace = true }

# Tree-sitter Rust grammar - this is where language-specific deps live
tree-sitter-rust = "0.23"

# Logging
tracing = { workspace = true }

[dev-dependencies]
reovim-testing = { workspace = true }

[features]
# Enable for building as standalone dynamic library
dynamic = []
