[package]
name = "reovim-module-codec-csv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "CSV/TSV content codec module for reovim"
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
# Kernel layer - for Module trait
reovim-kernel = { workspace = true }
reovim-capabilities = { workspace = true }

# Driver layer - implements ContentCodec, ContentClassifier, ContentCodecFactory
reovim-driver-codec = { workspace = true }
reovim-driver-annotation = { workspace = true }

# Module macros for FFI entry points
reovim-module-macros = { workspace = true }

# CSV parsing
csv = { workspace = true }

# Logging
tracing = { workspace = true }

[dev-dependencies]
reovim-testing = { workspace = true }

[features]
# Enable for building as standalone dynamic library
dynamic = []
