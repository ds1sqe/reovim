[package]
name = "reovim-module-commands"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ex-commands (:w, :q, :set) for reovim - POLICY module"
readme = "README.md"
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
dynamic = []  # Enable FFI entry points for standalone dynamic loading

[dependencies]
reovim-arch = { workspace = true }
reovim-capabilities = { workspace = true }
reovim-driver-command = { workspace = true }
reovim-driver-codec = { workspace = true }
reovim-driver-command-types = { workspace = true }
reovim-driver-display = { workspace = true }
reovim-driver-session = { workspace = true }
reovim-driver-vfs = { workspace = true }
reovim-kernel = { workspace = true }
reovim-provider-text = { workspace = true }
reovim-types-text = { workspace = true }
regex = { workspace = true }
reovim-module-macros = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
reovim-driver-layout = { workspace = true }
tempfile = "3"

[lints]
workspace = true
