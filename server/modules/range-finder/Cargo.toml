[package]
name = "reovim-module-range-finder"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Range-finder module for reovim - jump navigation and code folding"
readme = "README.md"
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["vim-keybindings"]
vim-keybindings = ["dep:reovim-module-vim"]
dynamic = []  # Enable FFI entry points for standalone dynamic loading

[dependencies]
reovim-module-vim = { workspace = true, optional = true }
reovim-kernel = { workspace = true }
reovim-types-text = { workspace = true }
reovim-driver-session = { workspace = true }
reovim-driver-input = { workspace = true }
reovim-driver-command = { workspace = true }
reovim-driver-syntax = { workspace = true }
reovim-module-macros = { workspace = true }
reovim-driver-manifest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
parking_lot = { workspace = true }
reovim-driver-buffer = { workspace = true }
reovim-testing = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
