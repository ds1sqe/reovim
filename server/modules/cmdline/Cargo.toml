[package]
name = "reovim-module-cmdline"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line mode module for reovim - CmdlineState and CmdlineBridge"
readme = "README.md"
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
dynamic = []  # Enable FFI entry points for standalone dynamic loading

[dependencies]
reovim-kernel = { workspace = true }
reovim-driver-text-session = { workspace = true }
reovim-module-macros = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
parking_lot = { workspace = true }
reovim-driver-text-buffer = { workspace = true }
reovim-domain-text = { workspace = true }

[lints]
workspace = true
