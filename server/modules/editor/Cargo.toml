[package]
name = "reovim-module-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Core editor module for reovim - Normal and Insert modes with basic commands"
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
dynamic = []  # Enable FFI entry points for standalone dynamic loading

[dependencies]
reovim-kernel = { workspace = true }
reovim-domain-text = { workspace = true }
reovim-module-macros = { workspace = true }
reovim-driver-command = { workspace = true }
reovim-subsys-layout = { workspace = true }
reovim-driver-input = { workspace = true }
reovim-driver-session = { workspace = true }
reovim-subsys-vfs = { workspace = true }
# Note: operators merged into vim (Epic #385)
unicode-width = "0.2"

[dev-dependencies]
reovim-driver-undo = { workspace = true }
# Buffer moved to provider-text (#740); tests use it via dev-dep
reovim-provider-text = { workspace = true }

[lints]
workspace = true
