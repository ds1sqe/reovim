[package]
name = "reovim-module-lsp-navigation"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "LSP navigation module for reovim - gd (goto definition) and gr (references)"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["vim-keybindings"]
vim-keybindings = ["dep:reovim-module-vim"]
dynamic = []

[dependencies]
reovim-module-vim = { workspace = true, optional = true }
reovim-kernel = { workspace = true }
reovim-domain-text = { workspace = true }
reovim-driver-lsp = { workspace = true }
reovim-driver-picker = { workspace = true }
reovim-driver-session = { workspace = true }
reovim-driver-command = { workspace = true }
reovim-driver-command-types = { workspace = true }
reovim-driver-input = { workspace = true }
reovim-subsys-vfs = { workspace = true }
reovim-module-notification = { workspace = true }
reovim-module-microscope = { workspace = true }
reovim-module-macros = { workspace = true }
lsp-types = "0.97"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }
tracing.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
