[package]
name = "reovim-module-snippet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Snippet expansion module for reovim"
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
dynamic = []  # Enable FFI entry points for standalone dynamic loading

[dependencies]
reovim-kernel = { workspace = true }
reovim-driver-command = { workspace = true }
reovim-driver-input = { workspace = true }
reovim-driver-session = { workspace = true }
reovim-driver-vfs = { workspace = true }
reovim-module-macros = { workspace = true }
reovim-module-notification = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
reovim-testing = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
