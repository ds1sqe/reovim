[package]
name = "reovim-module-diagnostics-panel"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Diagnostics panel module for reovim - trouble-like diagnostic list"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["vim-keybindings"]
vim-keybindings = ["dep:reovim-module-vim"]
dynamic = []

[dependencies]
reovim-module-vim = { workspace = true, optional = true }
reovim-kernel = { workspace = true }
reovim-driver-lsp = { workspace = true }
reovim-driver-session = { workspace = true }
reovim-driver-command = { workspace = true }
reovim-driver-command-types = { workspace = true }
reovim-driver-input = { workspace = true }
reovim-module-macros = { workspace = true }
serde_json = "1.0"
tracing.workspace = true

[lints]
workspace = true
