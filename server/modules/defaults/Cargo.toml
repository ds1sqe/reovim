[package]
name = "reovim-module-defaults"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Default module bundle for reovim - aggregates keymap, vim, commands"
readme = "README.md"
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
dynamic = []  # Enable FFI entry points for standalone dynamic loading

[dependencies]
reovim-kernel = { workspace = true }
reovim-driver-command = { workspace = true }
reovim-module-macros = { workspace = true }
reovim-module-keymap = { workspace = true }
reovim-module-vim = { workspace = true }
# Note: operators merged into vim (Epic #385)
reovim-module-commands = { workspace = true }
reovim-module-editor = { workspace = true }
reovim-module-motions = { workspace = true }
reovim-module-scratch-buffer = { workspace = true }
reovim-module-vfs-local = { workspace = true }
reovim-module-undo = { workspace = true }
reovim-module-buffer-simple = { workspace = true }
reovim-module-search = { workspace = true }
reovim-module-clipboard = { workspace = true }
reovim-module-cmdline = { workspace = true }
reovim-module-whichkey = { workspace = true }
reovim-module-notification = { workspace = true }

# Picker modules
reovim-picker-files = { workspace = true }
reovim-picker-buffers = { workspace = true }
reovim-picker-commands = { workspace = true }
reovim-picker-grep = { workspace = true }
reovim-picker-options = { workspace = true }
reovim-module-microscope = { workspace = true }

# Explorer module
reovim-module-explorer = { workspace = true }

# Git provider and picker modules (#530)
reovim-module-git = { workspace = true }
reovim-picker-git-branches = { workspace = true }
reovim-picker-git-log = { workspace = true }
reovim-picker-git-stash = { workspace = true }
reovim-picker-git-status = { workspace = true }

# Git consumer modules (#530)
reovim-module-git-signs = { workspace = true }
reovim-module-git-statusline = { workspace = true }
reovim-module-git-blame = { workspace = true }

# Syntax highlighting modules
reovim-module-treesitter-rust = { workspace = true }
reovim-module-treesitter-markdown = { workspace = true }
reovim-module-range-finder = { workspace = true }

# Code intelligence modules
reovim-module-lsp = { workspace = true }
reovim-module-lsp-navigation = { workspace = true }
reovim-module-vim-lsp = { workspace = true }

# Snippet expansion module (#136)
reovim-module-snippet = { workspace = true }

# Completion engine (#521)
reovim-module-completion = { workspace = true }

# Vim adapter modules (keybinding bridges)
reovim-module-vim-microscope = { workspace = true }
reovim-module-vim-explorer = { workspace = true }
reovim-module-vim-completion = { workspace = true }
reovim-module-vim-range-finder = { workspace = true }
reovim-module-vim-snippet = { workspace = true }
# Tetromino game module (#537)
reovim-module-tetromino = { workspace = true }
# Configuration profiles (#593)
reovim-module-profiles = { workspace = true }
# Health-check diagnostic command (#594)
reovim-module-health-check = { workspace = true }

# Note: Client-side modules (layout, pair, statusline, undotree)
# removed - will be reimplemented as client-side plugins (Epic #465)

[lints]
workspace = true
