[package]
name = "reovim-module-treesitter-markdown"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Markdown syntax highlighting module for reovim"
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
# Kernel layer - for Module trait
reovim-kernel = { workspace = true }
reovim-capabilities = { workspace = true }

# Driver layer - implements SyntaxDriverFactory
reovim-driver-syntax = { workspace = true }
reovim-driver-syntax-treesitter = { workspace = true }

# Tree-sitter Markdown grammar - this is where language-specific deps live
tree-sitter-md = "0.3"

# Streaming iterator (used by table/list decoration providers)
streaming-iterator = "0.1"

# Logging
tracing = { workspace = true }

[dev-dependencies]
reovim-testing = { workspace = true }
reovim-module-treesitter-rust = { workspace = true }
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
