[package]
name = "reovim-module-whichkey"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Which-key popup module for reovim - shows pending keybinding hints"
readme = "README.md"
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
dynamic = []  # Enable FFI entry points for standalone dynamic loading

[dependencies]
reovim-kernel = { workspace = true }
reovim-driver-session = { workspace = true }
reovim-driver-input = { workspace = true }
reovim-module-macros = { workspace = true }
reovim-extension-kinds = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
