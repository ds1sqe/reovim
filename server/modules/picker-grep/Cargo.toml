[package]
name = "reovim-picker-grep"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Grep picker module for reovim - content search using ripgrep"
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
dynamic = []  # Enable FFI entry points for standalone dynamic loading

[dependencies]
reovim-kernel = { workspace = true }
reovim-driver-picker = { workspace = true }
reovim-driver-session = { workspace = true }
reovim-subsys-vfs = { workspace = true }
reovim-module-macros = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
