[package]
name = "reovim-module-textobjects"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vim text objects (iw, aw, i\", a\", etc.) for reovim - POLICY module"
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
dynamic = []  # Enable FFI entry points for standalone dynamic loading

[dependencies]
reovim-kernel = { workspace = true }
reovim-driver-command = { workspace = true }
reovim-driver-session = { workspace = true }
reovim-module-macros = { workspace = true }

[dev-dependencies]
reovim-driver-display = { workspace = true }

[lints]
workspace = true
