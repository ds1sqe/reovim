// State service for querying editor state.
//
// Domain state is queried via GetProjections (opaque DomainDatum).
// Server-owned state (layout, options) remains typed.
// No GetVisibleLines, GetMode, GetCursor, GetSelection.

syntax = "proto3";
package reovim.v3;

import "reovim/v3/common.proto";

service StateService {
  // Get domain-neutral projection state.
  rpc GetProjections(GetProjectionsRequest) returns (GetProjectionsResponse);

  // Get editor options (server-owned, typed).
  rpc GetOptions(GetOptionsRequest) returns (GetOptionsResponse);

  // Get window layout tree (server-owned, typed).
  rpc GetLayout(GetLayoutRequest) returns (GetLayoutResponse);

  // Get rendered screen content via TUI capture relay.
  rpc GetScreenContent(GetScreenContentRequest) returns (GetScreenContentResponse);

  // Submit captured screen content (TUI -> Server part of capture relay).
  rpc SubmitCaptureResponse(SubmitCaptureRequest) returns (SubmitCaptureResponseReply);

  // Get register contents.
  rpc GetRegisters(GetRegistersRequest) returns (GetRegistersResponse);
}

// ---------------------------------------------------------------------------
// Projections — domain-neutral state query
// ---------------------------------------------------------------------------

message GetProjectionsRequest {
  uint64 client_id = 1;
  // Filter by tags (empty = all projections for this client).
  repeated string tags = 2;
}

message GetProjectionsResponse {
  repeated ProjectionEntry projections = 1;
}

message ProjectionEntry {
  string tag = 1;
  uint32 domain_id = 2;
  // Window scope (absent = session-wide, present = specific window).
  optional uint64 window_id = 3;
  // Opaque domain datum.
  optional DomainDatum datum = 4;
  // Monotonic version.
  uint64 version = 5;
}

// ---------------------------------------------------------------------------
// Options (server-owned)
// ---------------------------------------------------------------------------

message GetOptionsRequest {
  repeated string names = 1;  // empty = all
}

message GetOptionsResponse {
  map<string, OptionValue> options = 1;
}

message OptionValue {
  oneof value {
    bool bool_value = 1;
    int64 int_value = 2;
    string string_value = 3;
  }
}

// ---------------------------------------------------------------------------
// Layout (server-owned)
// ---------------------------------------------------------------------------

message GetLayoutRequest {
  uint64 client_id = 1;
}

message GetLayoutResponse {
  WindowNode root = 1;
  optional uint64 focused_window_id = 2;
  optional uint64 active_tab_id = 3;
  repeated TabPageInfo tabs = 4;
}

message WindowNode {
  oneof node {
    WindowLeaf leaf = 1;
    WindowSplit split = 2;
  }
}

message WindowLeaf {
  uint64 window_id = 1;
  optional uint64 buffer_id = 2;
  WindowRect rect = 3;
}

message WindowSplit {
  SplitDirection direction = 1;
  repeated WindowNode children = 2;
}

enum SplitDirection {
  SPLIT_DIRECTION_UNSPECIFIED = 0;
  SPLIT_DIRECTION_HORIZONTAL = 1;
  SPLIT_DIRECTION_VERTICAL = 2;
}

// ---------------------------------------------------------------------------
// Screen content (TUI capture relay)
// ---------------------------------------------------------------------------

message GetScreenContentRequest {
  string format = 1;      // "plain_text", "raw_ansi", "cell_grid"
  uint64 client_id = 2;   // target TUI client
}

message GetScreenContentResponse {
  uint64 width = 1;
  uint64 height = 2;
  string format = 3;
  string content = 4;
}

message SubmitCaptureRequest {
  uint64 request_id = 1;
  uint64 width = 2;
  uint64 height = 3;
  string format = 4;
  string content = 5;
}

message SubmitCaptureResponseReply {
  bool ok = 1;
}

// ---------------------------------------------------------------------------
// Registers
// ---------------------------------------------------------------------------

message GetRegistersRequest {
  repeated string names = 1;
  uint64 client_id = 2;
}

message GetRegistersResponse {
  repeated RegisterEntry registers = 1;
}

message RegisterEntry {
  // Register name (domain-neutral, e.g., "a", "\"", "0").
  string name = 1;
  // Domain that owns this register (0 = global).
  optional uint32 domain_id = 2;
  // Opaque register content.
  DomainDatum content = 3;
}
