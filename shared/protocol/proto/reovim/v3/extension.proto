// Extension service for querying extension state.

syntax = "proto3";
package reovim.v3;

service ExtensionService {
  // Query the current state of an extension by kind.
  rpc GetState(GetExtensionStateRequest) returns (GetExtensionStateResponse);

  // List all registered extensions and their capabilities.
  rpc ListExtensions(ListExtensionsRequest) returns (ListExtensionsResponse);
}

message GetExtensionStateRequest {
  string kind = 1;
  uint64 client_id = 2;
}

message GetExtensionStateResponse {
  bool active = 1;
  string data = 2;
}

message ListExtensionsRequest {}

message ListExtensionsResponse {
  repeated ExtensionInfo extensions = 1;
  repeated string available_kinds = 2;
}

message ExtensionInfo {
  string kind = 1;
  string description = 2;
  bool push_supported = 3;
  bool query_supported = 4;
}
