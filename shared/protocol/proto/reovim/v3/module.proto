// Module service for dynamic module management.

syntax = "proto3";
package reovim.v3;

service ModuleService {
  rpc List(ListModulesRequest) returns (ListModulesResponse);
  rpc Load(LoadModuleRequest) returns (LoadModuleResponse);
  rpc Unload(UnloadModuleRequest) returns (UnloadModuleResponse);
  rpc Reload(ReloadModuleRequest) returns (ReloadModuleResponse);
}

message ListModulesRequest {}

message ListModulesResponse {
  repeated ModuleInfo modules = 1;
}

message ModuleInfo {
  string id = 1;
  string name = 2;
  string version = 3;
  string path = 4;
  bool loaded = 5;
}

message LoadModuleRequest {
  string name = 1;
  optional string path = 2;
}

message LoadModuleResponse {
  bool ok = 1;
  optional string error = 2;
}

message UnloadModuleRequest {
  string name = 1;
}

message UnloadModuleResponse {
  bool ok = 1;
  optional string error = 2;
}

message ReloadModuleRequest {
  string name = 1;
}

message ReloadModuleResponse {
  bool ok = 1;
  optional string error = 2;
}
