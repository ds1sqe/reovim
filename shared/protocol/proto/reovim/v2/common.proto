// Common types shared across v2 services.
//
// Philosophy: Use usize (uint64) for all indices per Rust convention.
// v3 domain-neutral design: no text-domain types (Position, Selection removed).

syntax = "proto3";
package reovim.v2;

// Buffer identifier.
message BufferId {
  uint64 id = 1;
}

// Window identifier.
message WindowId {
  uint64 id = 1;
}

// Client identifier.
message ClientId {
  uint64 id = 1;
}

// Window rectangle (position and size).
message WindowRect {
  uint64 x = 1;
  uint64 y = 2;
  uint64 width = 3;
  uint64 height = 4;
}

// Generic result status.
message Status {
  bool ok = 1;
  optional string error = 2;
}

// Tab page information (#401).
// Used in both LayoutChangedPayload (notification) and GetLayoutResponse (state).
message TabPageInfo {
  uint64 tab_id = 1;
  string label = 2;
  bool active = 3;
}

// ─────────────────────────────────────────────────────────────────────────────
// v3 domain-neutral types (#753)
// ─────────────────────────────────────────────────────────────────────────────

// Opaque domain-specific data envelope.
message DomainDatum {
  bytes content = 1;
  optional string display = 2;
}

// Surface rendering descriptor.
message SurfaceDescriptor {
  uint32 kind = 1;
  bytes body = 2;
}

// Domain identity.
message DomainInfo {
  uint32 id = 1;
  string name = 2;
}
