// Notification service for server-to-client streaming.
//
// Philosophy: Server pushes state changes, client reacts.
// Uses gRPC server streaming for real-time updates.
// v3 domain-neutral design: domain-specific payloads replaced by ProjectionUpdatedPayload (#753).

syntax = "proto3";
package reovim.v2;

import "reovim/v2/common.proto";
import "reovim/v2/presence.proto";

service NotificationService {
  // Subscribe to notifications (server streaming).
  rpc Subscribe(SubscribeRequest) returns (stream Notification);
}

message SubscribeRequest {
  // Event types to subscribe to (empty = all events).
  repeated string event_types = 1;
}

message Notification {
  string event_type = 1;
  uint64 timestamp_ms = 2;  // Unix timestamp in milliseconds

  oneof payload {
    // Domain-neutral projection update (#753): replaces CursorMoved, ModeChanged,
    // SelectionChanged, ViewportUpdated, OptionChanged notifications.
    ProjectionUpdatedPayload projection_updated = 10;

    // Server-owned lifecycle notifications (kept typed).
    BufferModifiedPayload buffer_modified = 11;
    BufferListChangedPayload buffer_list_changed = 12;
    LayoutChangedPayload layout_changed = 13;
    RenderCompletePayload render_complete = 14;
    DetachPayload detach = 15;

    // Capture relay (CLI -> Server -> TUI -> Server -> CLI).
    CaptureRequestPayload capture_request = 16;
    CaptureResponsePayload capture_response = 17;

    // Resize relay (CLI -> Server -> TUI).
    ResizeRequestPayload resize_request = 18;

    // Multi-client presence updates.
    PresenceJoinedPayload presence_joined = 19;
    PresenceLeftPayload presence_left = 20;
    PresenceUpdatedPayload presence_updated = 21;

    // Extension state updates (#514).
    ExtensionUpdatedPayload extension_updated = 22;
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Projection updates (#753)
//
// Domain-neutral opaque state projections. Replaces all typed display structs
// (CursorPosition, Viewport, SelectionInfo, ModeInfo, OptionValue) with
// opaque domain-tagged payloads.
// ─────────────────────────────────────────────────────────────────────────────

message ProjectionUpdatedPayload {
  // Projection tag (e.g., "text.mode", "text.cursor", "text.selection").
  string tag = 1;
  // Domain that produced this projection.
  uint32 domain_id = 2;
  // Window scope (absent = session-wide, present = specific window).
  optional uint64 window_id = 3;
  // Opaque domain datum — domain-defined format with optional display string.
  optional DomainDatum datum = 4;
  // True if transient (fire-and-forget), false if persistent (cached).
  bool transient = 5;
  // Monotonic version for persistent projections (0 for transient).
  uint64 version = 6;
  // Client that owns this projection state.
  uint64 client_id = 7;
}

// ─────────────────────────────────────────────────────────────────────────────
// Buffer modified
// ─────────────────────────────────────────────────────────────────────────────

message BufferModifiedPayload {
  uint64 buffer_id = 1;
  // Change details (optional, for incremental updates).
  optional BufferChange change = 2;
}

message BufferChange {
  uint64 start_line = 1;
  uint64 old_end_line = 2;
  uint64 new_end_line = 3;
  repeated string new_lines = 4;
}

// ─────────────────────────────────────────────────────────────────────────────
// Layout changed
// ─────────────────────────────────────────────────────────────────────────────

message LayoutChangedPayload {
  // Use optional to eliminate ID ambiguity (0 vs "no focus").
  optional uint64 focused_window_id = 1;
  // Window list with positions.
  repeated WindowInfo windows = 2;
  // Client ID that triggered this layout change (for multi-client filtering).
  uint64 client_id = 3;
  // #401: Active tab page ID (absent = no tabs / single tab).
  optional uint64 active_tab_id = 4;
  // #401: Tab page list (empty = no tabs / single tab).
  repeated TabPageInfo tabs = 5;
}

message WindowInfo {
  uint64 window_id = 1;
  // Use optional to eliminate ID ambiguity (0 vs "no buffer").
  optional uint64 buffer_id = 2;
  WindowRect rect = 3;
  bool focused = 4;
  // #400: Layer opacity (0.0 = transparent, 1.0 = opaque).
  // Uses optional to avoid proto3 zero-default ambiguity: absent = fully opaque (1.0).
  optional float opacity = 5;
}

// ─────────────────────────────────────────────────────────────────────────────
// Buffer list changed
// ─────────────────────────────────────────────────────────────────────────────

message BufferListChangedPayload {
  // Action that triggered the change.
  string action = 1;  // "added", "removed", "modified"
  uint64 buffer_id = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// Render complete (signal to TUI that a frame is ready)
// ─────────────────────────────────────────────────────────────────────────────

message RenderCompletePayload {
  uint64 frame_id = 1;
}

// ─────────────────────────────────────────────────────────────────────────────
// Detach (client should disconnect)
// ─────────────────────────────────────────────────────────────────────────────

message DetachPayload {
  string reason = 1;
}

// ─────────────────────────────────────────────────────────────────────────────
// Capture relay
//
// Enables CLI to request screen capture from TUI via server relay:
// CLI -> Server (GetScreenContent) -> TUI (capture_request notification)
// TUI -> Server (capture_response notification) -> CLI (RPC response)
// ─────────────────────────────────────────────────────────────────────────────

// Server requests TUI to capture its frame buffer.
message CaptureRequestPayload {
  uint64 request_id = 1;  // Unique ID to correlate request/response
  string format = 2;      // "plain_text", "raw_ansi", "cell_grid"
  // Target client ID (required).
  // Only the TUI with this client_id should respond.
  uint64 target_client_id = 3;
}

// TUI responds with captured frame content.
message CaptureResponsePayload {
  uint64 request_id = 1;  // Matches the request_id from CaptureRequestPayload
  uint64 width = 2;
  uint64 height = 3;
  string format = 4;
  string content = 5;
}

// ─────────────────────────────────────────────────────────────────────────────
// Resize relay
//
// CLI -> Server -> TUI (one-way, TUI resizes its frame buffer)
// ─────────────────────────────────────────────────────────────────────────────

// Server tells TUI to resize its frame buffer.
message ResizeRequestPayload {
  uint64 width = 1;
  uint64 height = 2;
  // Target client ID (required).
  // Only the TUI with this client_id should resize.
  // 0 = no target (backward compat, all TUIs resize).
  uint64 target_client_id = 3;
}

// ─────────────────────────────────────────────────────────────────────────────
// Presence notifications
//
// Multi-client awareness updates streamed to all connected clients.
// ─────────────────────────────────────────────────────────────────────────────

// A new client joined the session.
message PresenceJoinedPayload {
  ClientPresence client = 1;
}

// A client left the session.
message PresenceLeftPayload {
  uint64 client_id = 1;
  string display_name = 2;  // For UI display (e.g., "laptop disconnected")
}

// A client's presence state changed.
message PresenceUpdatedPayload {
  ClientPresence client = 1;
}

// ─────────────────────────────────────────────────────────────────────────────
// Extension state updates (#514)
//
// Emitted when a bridge's is_active() state changes (activation/deactivation).
// ─────────────────────────────────────────────────────────────────────────────

message ExtensionUpdatedPayload {
  // Extension kind (e.g., "cmdline").
  string kind = 1;
  // JSON-serialized extension state snapshot.
  string data = 2;
  // Client ID that owns this state (for per-client extensions).
  uint64 client_id = 3;
}
