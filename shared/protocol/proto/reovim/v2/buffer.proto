// Buffer service for content access.
//
// Philosophy: Returns raw buffer data without rendering.
// No gutters, no line numbers, no decorations.
// Client decides how to render the content.

syntax = "proto3";
package reovim.v2;

service BufferService {
  // Get raw buffer content as text lines.
  rpc GetRawContent(GetRawContentRequest) returns (GetRawContentResponse);

  // Get buffer line count (efficient, no content transfer).
  rpc GetLineCount(GetLineCountRequest) returns (GetLineCountResponse);

  // Get line annotations (diagnostics, git signs, etc.).
  rpc GetAnnotations(GetAnnotationsRequest) returns (GetAnnotationsResponse);

  // List all open buffers.
  rpc List(ListBuffersRequest) returns (ListBuffersResponse);

  // Open a file into a buffer.
  rpc OpenFile(OpenFileRequest) returns (OpenFileResponse);

  // Write buffer to file.
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);

  // Set buffer content.
  rpc SetContent(SetContentRequest) returns (SetContentResponse);

  // Get available codec views for a buffer.
  rpc GetCodecViews(GetCodecViewsRequest) returns (GetCodecViewsResponse);

  // DEPRECATED — scheduled for removal in v0.11.0.
  // Phase 5 sub-commit 5c (#740) replaces this with the multi-mount
  // MountCodec / UmountCodec / ListMounts / ListAvailableCodecs RPCs.
  // The server keeps this handler as a compatibility shim that routes
  // through CodecSessionState::switch_view.
  rpc SwitchCodecView(SwitchCodecViewRequest) returns (SwitchCodecViewResponse);

  // Mount a codec on a buffer's inode.
  //
  // If the inode already has a mount, this attaches a second (or Nth)
  // mount via InodeTable::mount_additional. Returns the new mount id.
  // Phase 5 sub-commit 5c (#740).
  rpc MountCodec(MountCodecRequest) returns (MountCodecResponse);

  // Unmount a previously-registered codec mount.
  // Phase 5 sub-commit 5c (#740).
  rpc UmountCodec(UmountCodecRequest) returns (UmountCodecResponse);

  // List every active mount on a buffer's inode.
  // Phase 5 sub-commit 5c (#740).
  rpc ListMounts(ListMountsRequest) returns (ListMountsResponse);

  // List every codec factory the server has registered and the content
  // types each one can handle. Clients use this to populate a codec
  // picker UI. Phase 5 sub-commit 5c (#740).
  rpc ListAvailableCodecs(ListAvailableCodecsRequest) returns (ListAvailableCodecsResponse);
}

// Raw content

message GetRawContentRequest {
  optional uint64 buffer_id = 1;   // Default: active buffer
  optional uint64 start_line = 2;  // Default: 0
  optional uint64 end_line = 3;    // Default: end of buffer
}

message GetRawContentResponse {
  uint64 buffer_id = 1;
  repeated string lines = 2;    // Raw text lines (no gutter, no styling)
  uint64 start_line = 3;        // Start line of returned content
  uint64 total_lines = 4;       // Total lines in buffer
}

// Line count

message GetLineCountRequest {
  optional uint64 buffer_id = 1;  // Default: active buffer
}

message GetLineCountResponse {
  uint64 buffer_id = 1;
  uint64 line_count = 2;
}

// Annotations

message GetAnnotationsRequest {
  optional uint64 buffer_id = 1;
  optional uint64 start_line = 2;
  optional uint64 end_line = 3;
}

message GetAnnotationsResponse {
  uint64 buffer_id = 1;
  repeated LineAnnotation annotations = 2;
}

message LineAnnotation {
  uint64 line = 1;
  string kind = 2;      // "diagnostic", "git_sign", "breakpoint", "fold"
  string text = 3;      // Symbol or text to display
  optional uint32 severity = 4;  // 1=error, 2=warning, 3=info, 4=hint
  optional string color = 5;     // CSS hex (#ff0000) or named color
}

// Buffer list

message ListBuffersRequest {}

message ListBuffersResponse {
  repeated BufferInfo buffers = 1;
}

message BufferInfo {
  uint64 id = 1;
  optional string path = 2;      // File path (if file-backed)
  string name = 3;               // Display name
  bool modified = 4;             // Has unsaved changes
  uint64 line_count = 5;
  optional string content_type = 6;  // Codec content type (e.g., "text/utf-8")
  optional bool readonly = 7;       // Read-only (lossy codec decode)
  optional CodecMetadata codec_metadata = 8;
  uint32 capabilities = 9;       // BufferCapabilities bitflags (0 = legacy/unknown)
}

message CodecMetadata {
  string codec_name = 1;            // Codec that decoded this buffer
  optional string line_ending = 2;  // Line ending style ("lf", "crlf")
  bool has_bom = 3;                 // File had a byte order mark
}

// File operations

message OpenFileRequest {
  string path = 1;
}

message OpenFileResponse {
  uint64 buffer_id = 1;
  bool ok = 2;
  optional string error = 3;
}

message WriteFileRequest {
  optional uint64 buffer_id = 1;  // Default: active buffer
  optional string path = 2;       // Default: buffer's current path
}

message WriteFileResponse {
  bool ok = 1;
  optional string error = 2;
}

message SetContentRequest {
  optional uint64 buffer_id = 1;
  string content = 2;
}

message SetContentResponse {
  bool ok = 1;
}

// Codec views

message CodecViewInfo {
  string name = 1;       // Machine key (e.g., "hex", "meta", "default")
  string display = 2;    // Human label (e.g., "Hex Dump", "Metadata")
}

message GetCodecViewsRequest {
  optional uint64 buffer_id = 1;  // Default: active buffer
}

message GetCodecViewsResponse {
  uint64 buffer_id = 1;
  repeated CodecViewInfo views = 2;
  string active_view = 3;
}

message SwitchCodecViewRequest {
  optional uint64 buffer_id = 1;  // Default: active buffer
  string view_name = 2;
}

message SwitchCodecViewResponse {
  bool ok = 1;
  optional string error = 2;
}

// Mount mode controls whether a mount is read-only (summary) or
// supports structural tree edits. Phase 7 (#740).
enum MountMode {
  // Read-only decoded view. Text edits pass through the codec but
  // tree edits are rejected at the mount level.
  MOUNT_MODE_SUMMARY = 0;
  // Structural editing enabled. Tree edits are dispatched to the
  // codec's translate_edit implementation.
  MOUNT_MODE_STRUCTURAL = 1;
}

// Multi-mount RPCs (Plan 06 Phase 5 sub-commit 5c, #740).

message MountCodecRequest {
  optional uint64 buffer_id = 1;  // Default: active buffer
  string content_type = 2;        // e.g. "text/utf-8", "binary/raw"
  optional string view_name = 3;  // Default: "default"
  // Mount mode: defaults to SUMMARY (0) for backward compatibility.
  // Phase 7 (#740).
  MountMode mount_mode = 4;
}

message MountCodecResponse {
  bool ok = 1;
  optional string error = 2;
  // mount id assigned by the server; clients pass this back to
  // UmountCodec to release the mount.
  optional uint64 mount_id = 3;
}

message UmountCodecRequest {
  uint64 mount_id = 1;
}

message UmountCodecResponse {
  bool ok = 1;
  optional string error = 2;
}

message ListMountsRequest {
  optional uint64 buffer_id = 1;  // Default: active buffer
}

message ListMountsResponse {
  uint64 buffer_id = 1;
  repeated MountInfo mounts = 2;
}

message MountInfo {
  uint64 mount_id = 1;
  string view_name = 2;
  // Whether this mount's decoded view is currently fresh with respect
  // to the underlying inode bytes. Set false when a sibling mount
  // applied an edit and the StaleCheck hook (sub-commit 5e) hasn't
  // re-decoded yet.
  bool content_valid = 3;
  // Mount mode: summary or structural. Phase 7 (#740).
  MountMode mode = 4;
}

message ListAvailableCodecsRequest {}

message ListAvailableCodecsResponse {
  repeated AvailableCodec codecs = 1;
}

message AvailableCodec {
  string name = 1;                   // Factory name, e.g. "utf-8"
  repeated string content_types = 2; // Every content type the factory can handle
}
