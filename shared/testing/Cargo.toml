[package]
name = "reovim-testing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Testing infrastructure for reovim - test harness, assertions, fluent builders"
repository.workspace = true
homepage.workspace = true

[features]
default = []

[dependencies]
# gRPC client for test communication
reovim-client-cli = { workspace = true }

# Protocol types
reovim-protocol = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full", "process", "io-util", "time", "rt-multi-thread"] }

# Timestamps for log files
chrono = { workspace = true }

# Serialization (for test data)
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3.0"

[lints]
workspace = true
