[package]
name = "reovim-arch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Platform floor: the #![no_std] crate owning OS FFI, entry, panic, allocator, and futex/thread backend primitives"
publish = false

[features]
# Gates the lang items (`_start`, `#[panic_handler]`) landing in Phase 4.
# Non-default so pre-migration libtest builds (bootstrap state 1) do not
# clash with std-linked lang items; fixture and no_std test-runner bins
# opt in. Features are in-repo plumbing, not dependency edges (L9-clean).
runtime = []
# Compiles per-module sibling test files INTO the lib (L12 layout, #785
# Phase 5). Tests declare via arch_test! and reach crate-private items
# through `super::`. The selftest runner bin (arch-selftest) enables both
# `runtime` and `selftest`. arch also hosts the `lib/ds` integration selftests
# (SP03): the DS/sync algorithms moved to `reovim-lib-ds`, but the no_std
# runner, live allocator (fault seam + accounting), threads, and futex backend
# stay here — so `selftest` propagates to `reovim-lib-ds/selftest` to reach its
# test-observation surface (testhooks, the growth-ladder constants/helpers).
selftest = ["reovim-lib-ds/selftest", "reovim-kabi-panic/selftest"]

[lints]
workspace = true

[dependencies]
# arch IMPLEMENTS the down-face platform contract: it builds the static
# vtable and installs it at boot (arch → kabi, SP02, granted in
# lib/depgraph). This is the only permitted direction across the airlock;
# kabi never names arch back. kabi/platform is itself a #![no_std] leaf with
# no third-party deps, so DAG5 (Dependency Sovereignty) and DAG6 (zero-std)
# are preserved — no external crate enters the graph.
reovim-kabi-platform = { path = "../kabi/platform" }

# arch names the canonical POSIX newtypes (Fd/OpenFlags/Mode) in the fd-op
# slot implementations it wires into the platform vtable, mapping them to the
# raw syscall edge it owns. uapi/posix is a #![no_std] zero-dep leaf, so
# DAG5 (Dependency Sovereignty) and DAG6 (zero-std) are preserved.
reovim-uapi-posix = { path = "../uapi/posix" }

# arch's panic handler reads the five write-once fault-floor atoms from
# kabi/panic — the always-present down-face seam (Platform-Contract §3.4): a
# panic can fire before `Init::boot` completes, so unlike kabi/platform these
# atoms carry no install gate. arch keeps the `#[panic_handler]` lang item and
# the render/flush mechanism; the registry lives in kabi/panic and arch reaches
# it through thin shims. kabi/panic re-exports the uapi/panic value types, but
# arch also names `Disposition`/`PanicRecord` directly, so it depends on
# uapi/panic too. Both are #![no_std] zero-dep leaves (DAG5/DAG6 preserved).
reovim-kabi-panic = { path = "../kabi/panic" }
reovim-uapi-panic = { path = "../uapi/panic" }

# arch CONSUMES lib/ds POST-install: the relocated DS/sync algorithms (SP03)
# route through the boot-installed handle, which arch installs at `rust_entry`.
# This is the sanctioned `arch → lib/ds → kabi` diamond (master invariant 6),
# not a cycle: lib/ds names no arch symbol back. arch needs it for the smoke
# fixture's post-boot DS exercise and the `selftest`-gated lib/ds integration
# tests. Both crates stay #![no_std] with zero third-party deps (DAG5/DAG6).
reovim-lib-ds = { path = "../lib/ds" }

# No [dev-dependencies] or [build-dependencies].
# DAG5 (1.2 §9 Dependency Sovereignty): the platform floor reaches the OS
# only through hand-written inline-asm/`extern "C"` FFI it owns. Beyond the
# in-repo kabi contract it implements (and the lib/ds algorithms it consumes
# post-install), only `core` is consumed.
