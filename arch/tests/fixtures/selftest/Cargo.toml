[package]
name = "arch-selftest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "no_std arch self-test runner: all arch/* L12 tests on the in-repo runner (#785 Phase 5)"
publish = false

[[bin]]
name = "arch-selftest"
path = "src/main.rs"
# A `#![no_std] #![no_main]` test-runner bin has no libtest harness; disable
# the test/bench/doc builds so a parent `cargo test` does not link a std
# harness against it.
test = false
bench = false
doctest = false

# Two variants of the same bin select a passing-only run vs. a run with a
# deliberately failing test, demonstrating the runner's exit codes. The
# failing case is gated behind a cfg the integration test sets, so the default
# build is the all-pass charter smoke.
[features]
default = []
# Adds one deliberately-failing test to demonstrate the FAILED exit path.
inject-failure = []

[dependencies]
# Path dep on the platform floor with both `runtime` (for `_start`, panic
# handler, test runner) and `selftest` (to compile the L12 sibling test
# modules into the arch lib). Together they give this bin the full test suite.
reovim-arch = { path = "../../..", features = ["runtime", "selftest"] }

# SP04 (04a): the device-neutral library lifted into the system kernel carries
# its L12 selftests (console/fonts/escape/color/fdt/boot-info/inventory). They
# register via arch_test! into the shared link section; this pilot links the
# crate with `selftest` so testrt::run() walks them — restoring the coverage the
# tests had while they lived in arch-sys-none (no regression across the lift).
reovim-system-kernel = { path = "../../../../system/lib/kernel", features = ["selftest"] }

# The platform-handle installer this composition root drives, cfg-split by
# target so exactly one links per build (mutually exclusive — neither
# double-defines the handle). The selftest reads the handle through
# `lib_ds_tests` (alloc + park/unpark), so it must install before `testrt::run`.
# On hosted Linux the real POSIX provider installs; on `*-unknown-none` the
# bare-metal scaffold does (linux-native cannot link there).
[target.'cfg(target_os = "linux")'.dependencies]
reovim-platform-linux-native = { path = "../../../../platform/linux-native" }

[target.'cfg(not(target_os = "linux"))'.dependencies]
reovim-platform-stub-none = { path = "../../../../platform/stub-none" }

# The per-target language floor (SP03): supplies `_start`, the `entry!` shim,
# the `#[panic_handler]`, `rust_eh_personality`, and the `mem` intrinsics as LINK
# symbols (relocated out of arch). Each target cfg names its real floor crate
# directly (a single dep key cannot map to different source paths across target
# blocks — Cargo rejects that); `src/main.rs` picks the active one with a
# cfg-gated `use <floor_crate>::entry;` import. This runner builds on BOTH hosted
# Linux AND `*-unknown-none`, so all four floor crates are linked (one per triple)
# — the four-block cfg-split mirrors `arch/Cargo.toml`.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
reovim-arch-floor-linux-x86-64 = { path = "../../../floor-linux-x86-64", features = ["runtime"] }

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
reovim-arch-floor-linux-aarch64 = { path = "../../../floor-linux-aarch64", features = ["runtime"] }

[target.'cfg(all(target_os = "none", target_arch = "aarch64"))'.dependencies]
reovim-arch-floor-none-aarch64 = { path = "../../../floor-none-aarch64", features = ["runtime"] }

[target.'cfg(all(target_os = "none", target_arch = "x86_64"))'.dependencies]
reovim-arch-floor-none-x86-64 = { path = "../../../floor-none-x86-64", features = ["runtime"] }

[lints]
workspace = true
