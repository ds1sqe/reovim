[package]
name = "uapi-selftest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "no_std uapi self-test runner: all uapi/*_tests.rs L12 tests on the in-repo runner (#786 Phase 5)"
publish = false

[[bin]]
name = "uapi-selftest"
path = "src/main.rs"
# A `#![no_std] #![no_main]` test-runner bin has no libtest harness; disable
# the test/bench/doc builds so a parent `cargo test` does not link a std
# harness against it.
test = false
bench = false
doctest = false

[features]
default = []
# Adds one deliberately-failing test to verify the runner exits non-zero
# (mirrors the arch-selftest inject-failure pattern).
inject-failure = []

[dependencies]
# `runtime`: provides `_start`, panic handler, testrt runner.
# `selftest`: compiles the uapi sibling test modules into the crates.
reovim-arch = { path = "../../../../arch", features = ["runtime", "selftest"] }
reovim-uapi-abi = { path = "../../../../uapi/abi", features = ["selftest"] }
reovim-uapi-protocol = { path = "../../../../uapi/protocol", features = ["selftest"] }
reovim-uapi-module-macros = { path = "../../../../uapi/module-macros", features = ["selftest"] }
reovim-uapi-driver-macros = { path = "../../../../uapi/driver-macros", features = ["selftest"] }

# The platform-handle installer this composition root drives. Enabling
# `reovim-arch/selftest` compiles arch's `lib_ds_tests` into the link-section
# test registry; those cases allocate + park through the handle, so
# `testrt::run` reads it and this bin must install before the run. This fixture
# is host-only (self-skips under system-image mode), so it links the real POSIX
# provider unconditionally — no bare-metal scaffold.
reovim-platform-linux-native = { path = "../../../../platform/linux-native" }

# The per-target language floor (SP03): supplies `_start`, the `entry!` shim,
# the `#[panic_handler]`, `rust_eh_personality`, and the `mem` intrinsics as LINK
# symbols (relocated out of arch). Each target cfg names its real floor crate
# directly (a single dep key cannot map to different source paths across target
# blocks — Cargo rejects that); `src/main.rs` picks the active one with a
# cfg-gated `use <floor_crate>::entry;` import. This fixture is host-only (Linux),
# so only the two Linux floor crates are linked.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
reovim-arch-floor-linux-x86-64 = { path = "../../../../arch/floor-linux-x86-64", features = ["runtime"] }

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
reovim-arch-floor-linux-aarch64 = { path = "../../../../arch/floor-linux-aarch64", features = ["runtime"] }

[lints]
workspace = true
