[package]
name = "arch-splash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Bare-metal aarch64 boot splash: deliberate reovim branded splash over the VideoCore mailbox framebuffer (QEMU raspi4b)"
publish = false

[[bin]]
name = "arch-splash"
path = "src/main.rs"
# A `#![no_std] #![no_main]` bin has no libtest harness; disable the
# test/bench/doc builds so a parent `cargo test` does not link a std harness
# against it.
test = false
bench = false
doctest = false

[dependencies]
# Path dep on the platform floor with the `runtime` feature for the
# `arch::sys`/`arch::time` surface this demo names. The lang items (`_start`,
# the `entry!` shim, `#[panic_handler]`, `mem`) now live in the language-floor
# crate aliased below. No `selftest`: this is a demo payload, not a test runner.
reovim-arch = { path = "../../..", features = ["runtime"] }

# The per-target language floor (SP03): supplies `_start` (the EL2→EL1 boot
# climb), the `entry!` shim, the `#[panic_handler]`, `rust_eh_personality`, and
# the `mem` intrinsics as LINK symbols (relocated out of arch). The target cfg
# names its real floor crate directly; `src/main.rs` imports the active one with
# a cfg-gated `use <floor_crate>::entry;`. This is an aarch64-bare-metal-only demo
# (it never builds hosted), so only the `none-aarch64` floor crate is linked.
[target.'cfg(all(target_os = "none", target_arch = "aarch64"))'.dependencies]
reovim-arch-floor-none-aarch64 = { path = "../../../floor-none-aarch64", features = ["runtime"] }
# The World system kernel (SP04 04a): the console / fonts / color device model
# this splash renders through, lifted out of arch-sys-none. The framebuffer it
# draws on STAYS below (named via the arch facade). aarch64-bare-metal-only, like
# this whole demo. `runtime` forwards to its arch-sys-none-aarch64 backend.
reovim-system-kernel = { path = "../../../../system/lib/kernel", features = ["runtime"] }

[lints]
workspace = true
