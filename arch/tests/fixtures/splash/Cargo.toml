[package]
name = "arch-splash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Bare-metal boot splash demo routed through apps/os composition"
publish = false

[[bin]]
name = "arch-splash"
path = "src/main.rs"
# A `#![no_std] #![no_main]` bin has no libtest harness; disable the
# test/bench/doc builds so a parent `cargo test` does not link a std harness
# against it.
test = false
bench = false
doctest = false

[dependencies]
# Composition root entry: all splash/system boot logic now lives in apps/os.
reovim-os = { path = "../../../../apps/os" }

# The per-target language floor (SP03): supplies `_start` (the EL2→EL1 boot
# climb), the `entry!` shim, `#[panic_handler]`, and `mem` intrinsics as LINK
# symbols. `src/main.rs` imports the active one with cfg-gated
# `use <floor>::entry`.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
reovim-arch-floor-linux-x86-64 = { path = "../../../floor-linux-x86-64", features = ["runtime"] }

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
reovim-arch-floor-linux-aarch64 = { path = "../../../floor-linux-aarch64", features = ["runtime"] }

[target.'cfg(all(target_os = "none", target_arch = "aarch64"))'.dependencies]
reovim-arch-floor-none-aarch64 = { path = "../../../floor-none-aarch64", features = ["runtime"] }

[target.'cfg(all(target_os = "none", target_arch = "x86_64"))'.dependencies]
reovim-arch-floor-none-x86-64 = { path = "../../../floor-none-x86-64", features = ["runtime"] }

[lints]
workspace = true
