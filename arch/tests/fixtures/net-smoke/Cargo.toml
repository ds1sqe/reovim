[package]
name = "arch-fixture-net-smoke"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Integration smoke: UDS loopback round-trip proving blocking thread-per-connection carrier composes end-to-end (#797 Phase 1)"
publish = false

[[bin]]
name = "arch-fixture-net-smoke"
path = "src/main.rs"
# A `#![no_std] #![no_main]` bin has no libtest harness; disable to prevent
# cargo from linking a std test harness against it.
test = false
bench = false
doctest = false

[dependencies]
# In-repo path dep on the platform floor with `runtime` (for `_start` and
# `#[panic_handler]`) and `selftest` (to register arch_test! cases from the
# net/term modules into the link section).
reovim-arch = { path = "../../..", features = ["runtime", "selftest"] }
# The platform-handle installer this composition root drives. The fixture is
# Linux-only (it names `reovim_arch::net`, a `cfg(target_os = "linux")` module),
# so it depends on the real POSIX provider unconditionally — no bare-metal
# scaffold branch, since the body never links freestanding.
reovim-platform-linux-native = { path = "../../../../platform/linux-native" }

# The per-target language floor (SP03): supplies `_start`, the `entry!` shim,
# the `#[panic_handler]`, `rust_eh_personality`, and the `mem` intrinsics as LINK
# symbols (relocated out of arch). Each target cfg names its real floor crate
# directly (a single dep key cannot map to different source paths across target
# blocks — Cargo rejects that); `src/main.rs` picks the active one with a
# cfg-gated `use <floor_crate>::entry;` import. This fixture is Linux-only, so
# only the two Linux floor crates are linked.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
reovim-arch-floor-linux-x86-64 = { path = "../../../floor-linux-x86-64", features = ["runtime"] }

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
reovim-arch-floor-linux-aarch64 = { path = "../../../floor-linux-aarch64", features = ["runtime"] }

[lints]
workspace = true
