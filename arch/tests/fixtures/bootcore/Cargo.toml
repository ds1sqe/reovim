[package]
name = "arch-bootcore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Bare-metal boot-core: runs the real reovim-kernel Init::boot on the freestanding floor (QEMU raspi4b aarch64 with UART + framebuffer console; QEMU q35 x86_64 Multiboot1, UART-only) and streams the boot-stage log"
publish = false

[[bin]]
name = "arch-bootcore"
path = "src/main.rs"
# A `#![no_std] #![no_main]` bin has no libtest harness; disable the
# test/bench/doc builds so a parent `cargo test` does not link a std harness
# against it.
test = false
bench = false
doctest = false

[dependencies]
# The platform floor with `runtime` (links `_start`, the `entry!` shim, the
# `#[panic_handler]` lang item, and the `#[global_allocator]` the kernel needs).
reovim-arch = { path = "../../..", features = ["runtime"] }
# The real reovim kernel — this bin boots it on the bare-metal floor.
reovim-kernel = { path = "../../../../editor/lib/kernel" }

# The platform-handle installer this composition root drives, cfg-split by
# target so exactly one links per build. The kernel boot allocates + writes
# through the handle, so it must install first. This fixture's real target is
# `*-unknown-none` (the scaffold); a hosted Linux build gets the real provider.
[target.'cfg(target_os = "linux")'.dependencies]
reovim-platform-linux-native = { path = "../../../../platform/linux-native" }

[target.'cfg(not(target_os = "linux"))'.dependencies]
reovim-platform-stub-none = { path = "../../../../platform/stub-none" }

# The per-target language floor (SP03): supplies `_start`, the `entry!` shim,
# the `#[panic_handler]`, `rust_eh_personality`, and the `mem` intrinsics as LINK
# symbols (relocated out of arch). Each target cfg names its real floor crate
# directly (a single dep key cannot map to different source paths across target
# blocks — Cargo rejects that); `src/main.rs` picks the active one with a
# cfg-gated `use <floor_crate>::entry;` import. This bin builds on BOTH hosted
# Linux AND `*-unknown-none` (its real targets), so all four floor crates are
# linked (one per triple) — the four-block cfg-split mirrors `arch/Cargo.toml`.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
reovim-arch-floor-linux-x86-64 = { path = "../../../floor-linux-x86-64", features = ["runtime"] }

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
reovim-arch-floor-linux-aarch64 = { path = "../../../floor-linux-aarch64", features = ["runtime"] }

[target.'cfg(all(target_os = "none", target_arch = "aarch64"))'.dependencies]
reovim-arch-floor-none-aarch64 = { path = "../../../floor-none-aarch64", features = ["runtime"] }

[target.'cfg(all(target_os = "none", target_arch = "x86_64"))'.dependencies]
reovim-arch-floor-none-x86-64 = { path = "../../../floor-none-x86-64", features = ["runtime"] }

[lints]
workspace = true
