[package]
name = "arch-fixture-smoke"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Charter smoke fixture: boots via arch _start, allocates a DS, spawns + joins a thread, exits 0"
publish = false

[[bin]]
name = "arch-fixture-smoke"
path = "src/main.rs"
# A `#![no_std] #![no_main]` bin has no libtest harness (Phase 5 ships the
# no_std runner); disable the test/bench/doc builds so `cargo test --workspace`
# does not try to link a std test harness against it.
test = false
bench = false
doctest = false

[dependencies]
# In-repo path dep on the platform floor with the `runtime` feature so the
# arch `_start` and `#[panic_handler]` lang items are linked (L9: path dep
# only, zero third-party).
reovim-arch = { path = "../../..", features = ["runtime"] }
# Heap-DS algorithms (Seq/Shared/Mutex) the post-boot smoke exercises through
# the installed handle (SP03): relocated from `reovim_arch::ds`/`::sync`.
reovim-lib-ds = { path = "../../../../lib/ds" }
# The platform-handle installer this composition root drives. The smoke
# allocates + spawns through the handle, so it must install before those reads.
# This fixture is host-only (self-skips under system-image mode), so it links
# the real POSIX provider unconditionally — no bare-metal scaffold.
reovim-platform-linux-native = { path = "../../../../platform/linux-native" }

# The per-target language floor (SP03): supplies `_start`, the `entry!` shim,
# the `#[panic_handler]`, `rust_eh_personality`, and the `mem` intrinsics as LINK
# symbols (relocated out of arch). Each target cfg names its real floor crate
# directly (a single dep key cannot map to different source paths across target
# blocks — Cargo rejects that); `src/main.rs` picks the active one with a
# cfg-gated `use <floor_crate>::entry;` import. This fixture is host-only (Linux),
# so only the two Linux floor crates are linked.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
reovim-arch-floor-linux-x86-64 = { path = "../../../floor-linux-x86-64", features = ["runtime"] }

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
reovim-arch-floor-linux-aarch64 = { path = "../../../floor-linux-aarch64", features = ["runtime"] }

[lints]
workspace = true
