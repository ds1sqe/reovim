[package]
name = "reovim-arch-sys-none-x86-64"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "arch-sys raw per-target mechanism: x86_64 bare-metal Multiboot parse / port I/O / asm, returning NATIVE values"
publish = false

[features]
# Mirrors the runtime gate from arch: `_start` stashes the Multiboot info pointer
# into the MULTIBOOT_INFO_PTR static this crate owns; the reader consults it.
runtime = []
# Compiles the per-module sibling test files INTO the lib (L12 layout). Tests
# declare via arch_test! and reach crate-private items through `super::`. The
# arch selftest runner enables this; default builds do not.
selftest = []

[lints]
workspace = true

[dependencies]
# The core-only test runtime (SP07): the `selftest`-gated `*_tests.rs` modules
# register through its arch_test! macro + check/check_eq, reaching the runner
# via the leaf rather than an upward arch-sys -> arch edge. reovim-testrt is a
# #![no_std] zero-dep leaf (DAG5/DAG6 preserved).
reovim-testrt = { path = "../../lib/testrt" }

# No [dev-dependencies] or [build-dependencies] (DAG5/DAG6: zero third-party deps).
