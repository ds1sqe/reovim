[package]
name = "reovim-arch-sys-none-aarch64"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "arch-sys raw per-target mechanism: aarch64 bare-metal MMIO / asm / register reads, returning NATIVE values"
publish = false

[features]
# Mirrors the runtime gate from arch: `_start` stashes the boot DTB pointer into
# the DTB_PTR static this crate owns; the reader only consults it under runtime.
runtime = []
# Compiles the per-module sibling test files INTO the lib (L12 layout). Tests
# declare via arch_test! and reach crate-private items through `super::`. The
# arch selftest runner enables this; default builds do not.
selftest = []

[lints]
workspace = true

[dependencies]
# The freestanding raw-fact surface names neutral KABI boot/device atoms
# (MemoryKind / MemoryRange / DeviceClass) while keeping board-specific
# compatible-string classification below the system-kernel bridge.
# kabi/platform is a #![no_std] zero-dep leaf, so DAG5/DAG6 are preserved.
reovim-kabi-platform = { path = "../../kabi/platform" }

# The core-only test runtime (SP07): the `selftest`-gated `*_tests.rs` modules
# register through its arch_test! macro + check/check_eq, reaching the runner
# via the leaf rather than an upward arch-sys -> arch edge. reovim-testrt is a
# #![no_std] zero-dep leaf (DAG5/DAG6 preserved).
reovim-testrt = { path = "../../lib/testrt" }

# No [dev-dependencies] or [build-dependencies] (DAG5/DAG6: zero third-party deps).
