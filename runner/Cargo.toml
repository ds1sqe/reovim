[package]
name = "reovim"
version = "0.9.2-dev"
edition = "2024"
rust-version = "1.92"
description = "Linux kernel-inspired text editor with mode/command system"
license = "AGPL-3.0-only"

[features]
default = []
# Enable Python module support via PyO3
python = ["dep:reovim-driver-ffi-python", "dep:pyo3"]
# Enable gRPC v2 protocol support
grpc = ["reovim-protocol/grpc", "dep:tonic"]

[lib]
name = "runner"
path = "src/lib.rs"

[[bin]]
name = "reovim"
path = "src/main.rs"

[dependencies]
# Kernel and drivers
reovim-kernel = { path = "../lib/kernel" }
reovim-driver-command = { path = "../lib/drivers/command" }
reovim-driver-display = { path = "../lib/drivers/display" }
reovim-driver-input = { path = "../lib/drivers/input" }
reovim-driver-session = { path = "../lib/drivers/session" }
reovim-driver-vfs = { path = "../lib/drivers/vfs" }
# Epic #417: New service drivers
reovim-driver-undo = { path = "../lib/drivers/undo" }
reovim-driver-buffer = { path = "../lib/drivers/buffer" }
reovim-driver-search = { path = "../lib/drivers/search" }

# Default modules bundle - provides module list (Epic #417)
reovim-module-defaults = { path = "../modules/defaults" }

# Which-key module - for type access in input handler (#457)
reovim-module-which-key = { path = "../modules/which-key" }

# Layout module removed in #438 - window state now in driver::Session
# Layout policy modules self-register via defaults bundle

# Protocol (shared RPC types)
reovim-protocol = { path = "../lib/protocol" }

# Platform abstraction (provides arc-swap, parking_lot)
reovim-arch = { path = "../lib/arch" }

# Dynamic library loading for runtime modules
libloading = "0.8"

# Python module support (optional)
reovim-driver-ffi-python = { path = "../lib/drivers/ffi-python", optional = true }
pyo3 = { workspace = true, optional = true }

# Async runtime for multi-threaded server
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = "1.0"
toml = { workspace = true }

# Async utilities (for BoxFuture)
futures = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Regex for search functionality
regex = "1"

# CLI argument parsing
clap = { workspace = true }

# gRPC transport (optional, enabled via `grpc` feature)
tonic = { version = "0.12", optional = true }

# Terminal handling for TUI client
crossterm = { workspace = true }

# Timestamps for TUI debug mode
chrono = { workspace = true }

# Editor module is a dev-dependency for the demo example
# (avoids cyclic dependency since editor module depends on runner-new)
[dev-dependencies]
reovim-module-editor = { path = "../modules/editor" }
# Hot reload demo module for integration tests
# This ensures the cdylib is built when running `cargo test`
reovim-module-hot-reload-demo = { path = "../modules/hot-reload-demo" }
tempfile = "3.10"
# Python FFI driver for e2e tests (provides init_python)
reovim-driver-ffi-python = { path = "../lib/drivers/ffi-python" }

[lints]
workspace = true
