[package]
name = "reovim-subsys-domain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Domain contract tier — DomainId, OnRawInput/Render traits, Projection (DAG2 contract surface, §4.1/§5.3)"
publish = false

[features]
# Compiles per-module sibling test files INTO the lib (L12.1 layout).
# Tests register via reovim_arch::arch_test! and run on the arch no_std
# selftest runner. Off in flight builds; the kernel-selftest bin enables it.
# `dep:reovim-arch` activates the now-OPTIONAL arch dep + enables arch/selftest
# so reovim_arch::testrt and arch_test! are available. The contract tier's ONLY
# arch use is this selftest test-infra, so the product build carries no arch
# edge (SP05a firewall close).
selftest = ["dep:reovim-arch", "reovim-arch/selftest"]

[dependencies]
# OPTIONAL: arch is needed only under `selftest` (the test-infra). The product
# contract tier names no arch symbol (SP05a firewall close).
reovim-arch = { path = "../../../../arch", optional = true }
# Heap-DS algorithms (Bytes/Seq — the contract tier's owned buffers) relocated
# from `reovim_arch::ds` into `reovim-lib-ds` (SP03). The domain crate exposes
# upper-facing contract errors and does not name down-face `kabi/*` types.
reovim-lib-ds = { path = "../../../../lib/ds" }

[lints]
workspace = true
