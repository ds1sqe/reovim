[package]
name = "server-selftest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "no_std server-runtime self-test runner: all server/lib/server *_tests.rs L12 tests on the in-repo runner (#797 Phase 3)"
publish = false

[[bin]]
name = "server-selftest"
path = "src/main.rs"
# `#![no_std] #![no_main]` test-runner bin: disable std harness hooks.
test = false
bench = false
doctest = false

[features]
default = []
# Adds one deliberately-failing test to verify the runner exits non-zero.
inject-failure = []

[dependencies]
# `runtime`: provides `_start`, panic handler, testrt runner (via arch).
# `selftest`: compiles the server-runtime sibling test modules into the lib.
reovim-server-rt = { path = "../../..", features = ["runtime", "selftest"] }
reovim-arch      = { path = "../../../../../../arch", features = ["runtime", "selftest"] }
# Heap-DS algorithms (Seq) the runtime smoke uses (SP03 relocation).
reovim-lib-ds    = { path = "../../../../../../lib/ds", features = ["selftest"] }
# The editor core is needed for the integration smoke (boots EditorInit).
reovim-editor-core    = { path = "../../../../core", features = ["runtime", "selftest"] }
# System-kernel bridge controls supplied by this fixture composition root.
reovim-system-kernel = { path = "../../../../../../system/lib/kernel", features = ["selftest"] }
# The Domain contract tier (DAG2) — its test registrations must be linked.
reovim-subsys-domain = { path = "../../../../subsys/domain", features = ["selftest"] }
# The text Domain is registered in the integration smoke (core/ext boundary —
# the server-rt rlib must NOT dep on this; only the fixture bin links it).
reovim-domain-text = { path = "../../../../../../editor/domains/text", features = ["selftest"] }
# The wire types the raw-client smoke builds frames with.
reovim-uapi          = { path = "../../../../../../uapi" }

# The platform-handle installer this composition root drives. The fixture is
# host-only (native-only pin per `fixtures_exec.rs`), so only the real POSIX
# provider is needed — no bare-metal scaffold branch.
[dependencies.reovim-platform-linux-native]
path = "../../../../../../platform/linux-native"

# The per-target language floor (SP03): supplies `_start`, the `entry!` shim,
# the `#[panic_handler]`, `rust_eh_personality`, and the `mem` intrinsics as LINK
# symbols (relocated out of arch). Each target cfg names its real floor crate
# directly (a single dep key cannot map to different source paths across target
# blocks — Cargo rejects that); `src/main.rs` picks the active one with a
# cfg-gated `use <floor_crate>::entry;` import. This fixture is host-only (Linux),
# so only the two Linux floor crates are linked.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
reovim-arch-floor-linux-x86-64 = { path = "../../../../../../arch/floor-linux-x86-64", features = ["runtime"] }

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
reovim-arch-floor-linux-aarch64 = { path = "../../../../../../arch/floor-linux-aarch64", features = ["runtime"] }

[lints]
workspace = true
