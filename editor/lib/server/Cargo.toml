[package]
name = "reovim-server-rt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Framed-protocol server runtime — UDS carrier loop, handshake, notify push, boot-stage 6 (#797 Phase 3)"
publish = false

[features]
# Compiles per-module sibling test files INTO the lib (L12.1 layout).
# Tests register via reovim_arch::arch_test! and run on the arch no_std
# selftest runner. Off in flight builds; the selftest fixture bin enables it.
# `dep:reovim-arch` activates the now-OPTIONAL arch dep: server-rt's only
# remaining arch use is the selftest test-infra (arch_test!/testrt), so the
# product build carries NO arch edge. Net routes through injected uapi/inner/net
# controls; thread spawn routes through injected uapi/inner/sched controls.
selftest = ["dep:reovim-arch", "reovim-arch/selftest", "reovim-editor-core/selftest", "reovim-subsys-domain/selftest"]

# Runtime lang items (panic_handler, _start, allocator). Needed by the
# server-selftest fixture bin. Must NOT be enabled in the workspace rlib build.
runtime = ["dep:reovim-arch", "reovim-arch/runtime"]

[dependencies]
# OPTIONAL: arch is needed only under `selftest`/`runtime` (test-infra +
# fixture-bin lang items). Product runtime net/spawn services are injected
# through uapi controls, so a flight build links no arch.
reovim-arch          = { path = "../../../arch", optional = true }
# Heap-DS algorithms (Seq/Shared/Bytes) relocated from `reovim_arch::ds` to
# `reovim-lib-ds` (SP03).
reovim-lib-ds        = { path = "../../../lib/ds" }
reovim-uapi          = { path = "../../../uapi" }
reovim-subsys-domain = { path = "../subsys/domain" }
reovim-editor-core        = { path = "../core" }

[lints]
workspace = true
