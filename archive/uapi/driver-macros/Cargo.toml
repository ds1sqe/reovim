[package]
name = "reovim-driver-macros"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Procedural macros for reovim dynamic driver development"
repository.workspace = true
keywords = ["reovim", "driver", "macro", "ffi"]
categories.workspace = true

[lib]
proc-macro = true

[dependencies]
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
proc-macro2 = "1.0"

[dev-dependencies]
reovim-client-subsys-debug = { workspace = true }
reovim-client-subsys-render = { workspace = true }
reovim-content-codec = { workspace = true }
reovim-kernel = { workspace = true }
reovim-subsys-buffer = { workspace = true }
reovim-subsys-net = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }

[lints]
workspace = true
