// Domain-neutral common types.
//
// Zero text-domain concepts. All domain-specific data flows as DomainDatum.

syntax = "proto3";
package reovim.v3;

// Buffer identifier.
message BufferId {
  uint64 id = 1;
}

// Window identifier.
message WindowId {
  uint64 id = 1;
}

// Client identifier.
message ClientId {
  uint64 id = 1;
}

// Window rectangle (position and size).
message WindowRect {
  uint64 x = 1;
  uint64 y = 2;
  uint64 width = 3;
  uint64 height = 4;
}

// Generic result status.
message Status {
  bool ok = 1;
  optional string error = 2;
}

// Tab page information.
message TabPageInfo {
  uint64 tab_id = 1;
  string label = 2;
  bool active = 3;
}

// ---------------------------------------------------------------------------
// Domain-neutral types
// ---------------------------------------------------------------------------

// Opaque domain-specific data envelope.
//
// Universal carrier for domain data on the wire. Server never decodes
// content bytes — pure passthrough. Domain drivers encode, client domain
// view modules decode via codec crates.
message DomainDatum {
  // Encoded bytes: 8-byte coordination header + domain-specific content.
  bytes content = 1;
  // Human-readable display for debugging/status.
  // MUST be optional — proto3 non-optional string defaults to "",
  // making it impossible to distinguish "no display" from "empty string".
  // When absent, client's ProjectionDisplayCache preserves previous entry.
  optional string display = 2;
}

// Client rendering surface descriptor.
//
// Opaque envelope — only kind for routing. Everything else (dimensions,
// refresh rate, eye parameters, cell count) lives in opaque body.
// Adding a new surface type = new kind + body format. Zero proto changes.
message SurfaceDescriptorProto {
  uint32 kind = 1;  // surface kind (Rust u16, proto u32)
  bytes body = 2;   // kind-specific parameters
}

// Domain identity.
//
// Sent in JoinResponse so clients know which domains are registered.
message DomainInfo {
  uint32 id = 1;    // domain_id assigned by CoordinationRegistry
  string name = 2;  // "text", "mesh", "image", etc.
}
