[package]
name = "reo-cli"
version = "0.1.0"
edition = "2024"
description = "CLI client for reovim server mode"
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rustyline = "17"
tokio = { version = "1.25", features = ["full"] }
