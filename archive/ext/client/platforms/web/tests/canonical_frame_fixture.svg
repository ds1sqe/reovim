<!--
Canonical Braille-unrelated web frame — byte-exact snapshot.

Pre-commit fixture checklist (hand-verified 2026-04-24 by the
implementer against the doc-comment table at the top of
`src/svg.rs`):

- 20×3 logical frame = viewBox "0 0 160 48" (20 cols × 8 px, 3 rows
  × 16 px); font-family="monospace", font-size="14" on the root
  <svg>; no inline <style>.
- Row 0 "HELLO RENDER-CODEC" starts at x=2. Space cells at (0,0) and
  (1,0) are skipped. Non-space cells carry fill="slategray".
- Row 1 is 18 × U+2500 box-drawings-light-horizontal from x=2..=19,
  fill="dimgray". Each character is 3 bytes in UTF-8.
- Row 2 "FROM apps/web #753" from x=2..=19, no fill attribute
  (default colour), with space skips at x=0, x=1, x=6, x=15.
- Row-major emission order: all row-0 <text> before all row-1
  <text>; all row-1 <text> before all row-2 <text>.
- This comment, the `-->`, and the trailing newline are stripped by
  the `fixture_svg()` helper in `canonical_frame_snapshot.rs`; the
  remaining single line is compared byte-for-byte with
  `render_frame_svg(canonical_frame())`.
-->
