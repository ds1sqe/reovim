[package]
name = "reovim-driver-text-buffer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Buffer manager driver for reovim - defines BufferManagerKey, registry, and the text-buffer cdylib"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
# Buffer subsys: Buffer, BufferDriver, BufferError, abi types.
reovim-subsys-buffer = { workspace = true }
# cdylib vtable codegen for `declare_buffer_driver!`.
reovim-driver-macros = { workspace = true }
# Codec attachment trait (`ByteNotifiable`).
reovim-content-codec = { workspace = true }

# Kernel types: BufferId, ByteEdit, BufferManager trait, StorageOps.
reovim-kernel = { workspace = true }

# Buffer storage: provider-text re-exports `Buffer`, `BufferOps`,
# `TextBufferRegistry`, `Position`.
reovim-provider-text = { workspace = true }

# RwLock alias used by the legacy TestBufferManager and the
# dyn-BufferOps storage shape that TextBufferRegistry expects.
reovim-arch = { workspace = true }

# Async edit-broadcast channel. Workspace tokio carries `full`, which
# already includes sync/rt/macros — no per-feature override needed.
tokio = { workspace = true }

# Slot-table + names map locking.
parking_lot = { workspace = true }

# Tracing for poisoned-codec slot diagnostics.
tracing = { workspace = true }
