[package]
name = "reovim-module-motions"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vim motions (w, b, e, 0, $, etc.) for reovim - POLICY module"
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
dynamic = []  # Enable FFI entry points for standalone dynamic loading

[dependencies]
reovim-kernel = { workspace = true }
reovim-domain-text = { workspace = true }
reovim-subsys-input = { workspace = true }
reovim-driver-command = { workspace = true }
reovim-driver-text-session = { workspace = true }
reovim-driver-text-search = { workspace = true }
reovim-module-macros = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
reovim-subsys-layout = { workspace = true }
# Buffer moved to provider-text (#740); tests use setup_buffer from there
reovim-provider-text = { workspace = true }

[lints]
workspace = true
