[package]
name = "reovim-module-snippet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Snippet expansion module for reovim"
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["vim-keybindings"]
vim-keybindings = ["dep:reovim-module-vim"]
dynamic = []  # Enable FFI entry points for standalone dynamic loading

[dependencies]
reovim-module-vim = { workspace = true, optional = true }
reovim-kernel = { workspace = true }
reovim-domain-text = { workspace = true }
reovim-domain-text-capabilities = { workspace = true }
reovim-driver-command = { workspace = true }
reovim-driver-text-input = { workspace = true }
reovim-driver-text-session = { workspace = true }
reovim-subsys-vfs = { workspace = true }
reovim-subsys-manifest = { workspace = true }
reovim-module-macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
reovim-testing = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = "3"

[lints]
workspace = true
