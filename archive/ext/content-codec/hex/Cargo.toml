[package]
name = "reovim-content-codec-hex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Binary hex-dump content codec module for reovim"
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
# Kernel layer - for Module trait
reovim-kernel = { workspace = true }

# Domain-neutral codec uapi (traits, DecodedEdit, stores, etc.)
reovim-content-codec = { workspace = true }
reovim-content-codec-xxd = { workspace = true }
reovim-driver-annotation = { workspace = true }
reovim-subsys-vfs = { workspace = true }
reovim-domain-text = { workspace = true }
# Content codec registry contract
reovim-subsys-content-codec = { workspace = true }

# Module macros for FFI entry points
reovim-module-macros = { workspace = true }

# Logging
tracing = { workspace = true }

[dev-dependencies]
reovim-testing = { workspace = true }
# Text-domain carve-out (TextEdit used in codec_tests.rs)
reovim-content-codec-text = { workspace = true }

[features]
# Enable for building as standalone dynamic library
dynamic = []
