[package]
name = "reovim-lsp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "LSP client library for reovim text editor"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# LSP protocol types
lsp-types = "0.97"

# Lock-free cache (same pattern as treesitter saturator)
arc-swap = "1.8"

# Mutex for open document tracking
parking_lot.workspace = true

# Async runtime
tokio.workspace = true
futures.workspace = true

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing.workspace = true

# URL handling for file:// URIs
url = "2"

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { workspace = true }
