[package]
name = "reovim-module-statusline"
version = "0.9.2-dev"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Statusline module for reovim - lualine-inspired extensible statusline"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# Kernel types
reovim-kernel = { path = "../../lib/kernel", version = "0.9.2-dev" }

# Display driver for statusline types
reovim-driver-display = { path = "../../lib/drivers/display", version = "0.9.2-dev" }

# Platform abstraction for RwLock
reovim-arch = { path = "../../lib/arch", version = "0.9.2-dev" }

# Module macros for FFI entry points
reovim-module-macros = { path = "../../lib/module-macros", version = "0.9.2-dev" }

# Logging
tracing.workspace = true

[features]
# Enable for building as standalone dynamic library
dynamic = []
