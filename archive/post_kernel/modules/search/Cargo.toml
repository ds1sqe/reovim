[package]
name = "reovim-module-search"
version = "0.9.2-dev"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Search module for reovim - regex-based pattern matching"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
# Kernel types
reovim-kernel = { path = "../../lib/kernel", version = "0.9.2-dev" }

# Driver for SearchProvider trait
reovim-driver-search = { path = "../../lib/drivers/search", version = "0.9.2-dev" }

# Module macros for FFI entry points
reovim-module-macros = { path = "../../lib/module-macros", version = "0.9.2-dev" }

# Regex engine
regex = "1.10"

# Logging
tracing.workspace = true

[dev-dependencies]
# Integration test harness from runner
reovim = { path = "../../runner" }
tokio = { workspace = true }

[features]
# Enable for building as standalone dynamic library
dynamic = []
