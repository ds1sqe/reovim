[package]
name = "reovim-client-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Reovim CLI client - command-line interface using gRPC v2"
repository.workspace = true
homepage.workspace = true

[dependencies]
# Protocol types (gRPC v2)
reovim-protocol = { workspace = true, features = ["grpc"] }

# gRPC
tonic = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# CLI
clap = { workspace = true, features = ["derive"] }

# Serialization (for JSON output)
serde_json = { workspace = true }
base64 = "0.22"

# Local module registry workflow
reovim-subsys-module-registry = { workspace = true }

# Logging
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
tempfile = "3"
reovim-testing = { workspace = true }
reovim-server = { workspace = true, features = ["grpc"] }
reovim-client-subsys-debug = { workspace = true }
reovim-client-subsys-driver-loader = { workspace = true }
reovim-driver-debug-poc = { path = "../../tools/driver-debug-poc", version = "0.15.0-dev" }

[lints]
workspace = true
