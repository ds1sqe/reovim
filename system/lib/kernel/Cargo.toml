[package]
name = "reovim-system-kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "World system kernel bridge: arch-free boot data shaping, console policy, color/fonts/escape parsing, FDT reader/enumerator, and splash content"
publish = false

[features]
# Kept as fixture-facing feature names, but intentionally no longer forward to
# arch/provider crates. Raw runtime facts are gathered by the composition root
# and passed in as data.
runtime = []
# Compiles the per-module sibling test files INTO the lib (L12 layout). Tests
# declare via arch_test! and reach crate-private items through `super::`,
# reaching the runner through the reovim-testrt leaf.
selftest = []

[lints]
workspace = true

[dependencies]
# The neutral boot-data and device-inventory types this bridge shapes, plus the
# down-face platform contract type vocabulary. The provider implementation stays
# below this crate.
reovim-kabi-platform = { path = "../../../kabi/platform" }
# Always-present panic/fault-floor atom registry. This bridge maps the up-face
# panic/log control table to these down-face write-once slots.
reovim-kabi-panic = { path = "../../../kabi/panic" }
# Existing DS helpers used by system-kernel sync-backend installation and
# shared boot/runtime data. The sched bridge owns handle-backed time/thread
# services directly; 05-I15b removes lib/ds' remaining allocator backend edge.
reovim-lib-ds = { path = "../../../lib/ds" }
# Product-facing filesystem/borrowed-fd vocabulary. This bridge maps it to
# down-face platform fd slots without exposing POSIX or kabi details upward.
reovim-uapi-fs = { path = "../../../uapi/inner/fs" }
# Product-facing diagnostic dump control vocabulary. This bridge dispatches
# dump sync controls while status/snapshot content remains fd-readable.
reovim-uapi-dump = { path = "../../../uapi/inner/dump" }
# Product-facing memory-management vocabulary. This bridge maps allocation
# requests to the down-face platform allocator slots.
reovim-uapi-mm = { path = "../../../uapi/inner/mm" }
# Product-facing log sink control vocabulary. This bridge maps it to lower file
# helpers plus panic flush registration.
reovim-uapi-log = { path = "../../../uapi/inner/log" }
# Product-facing local networking/IPC vocabulary. This bridge maps UDS
# connect/listen/accept/read/write/close to the down-face platform slots.
reovim-uapi-net = { path = "../../../uapi/inner/net" }
# Product-facing panic/log configuration vocabulary. This bridge maps it to the
# down-face panic atoms without exposing `kabi/panic` to upper layers.
reovim-uapi-panic = { path = "../../../uapi/inner/panic" }
# Product-facing process syscall vocabulary. This bridge dispatches process
# domain requests such as raw linked-bin exit to kernel process state.
reovim-uapi-process = { path = "../../../uapi/inner/process" }
# Product-facing scheduler/clock/thread identity vocabulary. This bridge maps
# it to the lower platform scheduler/time slots.
reovim-uapi-sched = { path = "../../../uapi/inner/sched" }
# Product-facing shell session vocabulary. This bridge dispatches session
# startup and line-discipline controls while session snapshots stay fd-readable.
reovim-uapi-session = { path = "../../../uapi/inner/session" }
# Product-facing service lifecycle vocabulary. This bridge dispatches service
# domain lifecycle controls while table snapshots remain fd-readable.
reovim-uapi-service = { path = "../../../uapi/inner/service" }
# Product-facing executable source-install vocabulary. This bridge dispatches
# source-domain controls while source/media snapshots remain fd-readable.
reovim-uapi-source = { path = "../../../uapi/inner/source" }
# Raw Reovim syscall transport vocabulary. This bridge dispatches transport
# scalars to existing kernel objects while domain semantics stay in uapi leaves.
reovim-uapi-syscall = { path = "../../../uapi/inner/syscall" }
# Product-facing boot facts and device inventory vocabulary. This bridge shapes
# lower boot data into these records before editor-core launch.
reovim-uapi-system = { path = "../../../uapi/inner/system" }
# Product-facing terminal/raw-mode vocabulary. This bridge maps it to the
# down-face platform terminal slots without exposing POSIX fd/termios details.
reovim-uapi-terminal = { path = "../../../uapi/inner/terminal" }
# The core-only test runtime: the `selftest`-gated `*_tests.rs` modules register
# through its arch_test! / check / check_eq, reaching the runner via the leaf —
# a #![no_std] zero-dep leaf.
reovim-testrt = { path = "../../../lib/testrt" }

# No [dev-dependencies] or [build-dependencies] (DAG5/DAG6: zero third-party deps).
