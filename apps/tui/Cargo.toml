[package]
name = "reovim-app-tui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Standalone reovim-tui bin + lib (dispatches to reovim-client-ext-platform-tui::run)"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "reovim-tui"
path = "src/main.rs"

[lib]
name = "reovim_app_tui"
path = "src/lib.rs"

[dependencies]
# CLM v7 — the bin dispatches to `ext/client/platforms/<p>::run`. The
# platform crate owns TUI runtime concerns (args parsing, run loop,
# logging init); `apps/tui/` is a thin launcher.
reovim-client-ext-platform-tui = { workspace = true }

clap = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }

[lints]
workspace = true
