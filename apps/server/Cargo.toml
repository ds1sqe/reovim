[package]
name = "reovim-server"
workspace = "../../product"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
std = ["reovim-host-reference/std", "reovim-service/std"]

[dependencies.reovim-kernel-interface]
path = "../../kernel/interface"
version = "=0.16.0-dev"

[dependencies.reovim-kernel-runtime]
path = "../../kernel/runtime"
version = "=0.16.0-dev"

[dependencies.reovim-host-reference]
path = "../../host/reference"
version = "=0.16.0-dev"

[[bin]]
name = "reovim-server"
path = "src/main.rs"
required-features = ["std"]

[lints]
workspace = true

[dependencies.reovim-sdk]
path = "../../sdk/rust"
version = "=0.16.0-dev"

[dependencies.reovim-service]
path = "../../host/service"
version = "=0.16.0-dev"


[dev-dependencies.reovim-host-reference]
path = "../../host/reference"
version = "=0.16.0-dev"
features = ["std"]

[dev-dependencies.reovim-service]
path = "../../host/service"
version = "=0.16.0-dev"
features = ["std"]
