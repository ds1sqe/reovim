[package]
name = "reovim-server"
workspace = "../../product"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
std = ["reovim-host-reference/std", "dep:reovim-service", "reovim-service/std"]

[dependencies.reovim-kernel-interface]
path = "../../kernel/interface"
version = "=0.16.0-dev"

[dependencies.reovim-kernel-runtime]
path = "../../kernel/runtime"
version = "=0.16.0-dev"

[dependencies.reovim-resource-local]
path = "../../resource/local"
version = "=0.16.0-dev"

[dependencies.reovim-domain-basic]
path = "../../domain/basic"
version = "=0.16.0-dev"

[dependencies.reovim-representation-basic]
path = "../../representation/basic"
version = "=0.16.0-dev"

[dependencies.reovim-host-reference]
path = "../../host/reference"
version = "=0.16.0-dev"

[[bin]]
name = "reovim-server"
path = "src/main.rs"
required-features = ["std"]

[lints]
workspace = true

[dependencies.reovim-module-counter]
path = "../../modules/counter"
version = "=0.16.0-dev"

[dependencies.reovim-sdk]
path = "../../sdk/rust"
version = "=0.16.0-dev"

[dependencies.reovim-service]
path = "../../host/service"
version = "=0.16.0-dev"
optional = true

[dependencies.reovim-module-editing]
path = "../../modules/editing"
version = "=0.16.0-dev"
