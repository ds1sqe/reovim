[package]
name = "reovim-app-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Standalone reovim-server bin + lib (gRPC server runtime composition root)"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "reovim-server"
path = "src/main.rs"

[lib]
name = "reovim_app_server"
path = "src/lib.rs"

[dependencies]
# Server crate
reovim-server = { workspace = true }
reovim-protocol = { workspace = true }

# Server driver implementations (composition root owns concrete drivers)
reovim-subsys-net = { workspace = true }
reovim-subsys-session = { workspace = true }
reovim-subsys-input = { workspace = true }
reovim-driver-net-grpc = { workspace = true }       # trait-redesign deferred to #774

# Kernel and drivers for module loading
reovim-kernel = { workspace = true }
reovim-domain-text = { workspace = true }
reovim-driver-text-buffer = { workspace = true }    # trait-redesign deferred to #774
reovim-subsys-layout = { workspace = true }
reovim-subsys-vfs = { workspace = true }
reovim-driver-text-input = { workspace = true }     # trait-redesign deferred to #774
reovim-driver-command = { workspace = true }        # trait-redesign deferred to #774
reovim-driver-text-session = { workspace = true }   # trait-redesign deferred to #774

# Dependency resolution for module init ordering (#582)
reovim-depgraph = { workspace = true }

# Module configuration for user enable/disable and per-module settings (#586)
reovim-subsys-module-config = { workspace = true }

# Dynamic module loading — external .so modules (#587)
reovim-subsys-module-loader = { workspace = true }

# Module distribution registry — install/remove/update third-party modules (#621)
reovim-subsys-module-registry = { workspace = true }

# Syntax driver (for SyntaxFactoryStore registry extraction)
reovim-driver-text-syntax = { workspace = true }    # trait-redesign deferred to #774
reovim-provider-text = { workspace = true }

# Display dep removal deferred to #775 — apps/server/src/bootstrap.rs imports from this
# crate at three sites (theme manager, gutter renderer types, statusline presenter
# types); refactor needed before the dep can be dropped.
reovim-driver-display = { workspace = true }

# CLI
clap = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full"] }
tonic = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json"] }
tracing-appender = { workspace = true }

# Sync primitives for KernelContext
parking_lot = { workspace = true }

[lints]
workspace = true
