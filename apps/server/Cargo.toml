[package]
name = "reovim-app-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Standalone reovim-server bin + lib (gRPC server runtime composition root)"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "reovim-server"
path = "src/main.rs"

[lib]
name = "reovim_app_server"
path = "src/lib.rs"

[dependencies]
# Server crate
reovim-server = { workspace = true }
reovim-protocol = { workspace = true }

# Server driver implementations (composition root owns concrete drivers)
reovim-subsys-net = { workspace = true }
reovim-subsys-session = { workspace = true }
reovim-subsys-input = { workspace = true }
reovim-subsys-buffer = { workspace = true }
reovim-subsys-driver-loader = { workspace = true }
# reovim-driver-net-grpc dropped #774 SP02: ships as cdylib loaded via
# reovim-subsys-driver-loader at runtime (Phase 5 follow-on); no
# compile-time dep on apps/server.
# reovim-driver-text-buffer SP03: ships as cdylib loaded via
# reovim-subsys-driver-loader; the rlib dep is retained until SP04
# retires the kernel BufferManager (see
# tmp/deferral-draft-sp03-bufmgr-dep-drop.md).

# Kernel and drivers for module loading
reovim-kernel = { workspace = true }
reovim-domain-text = { workspace = true }
reovim-driver-text-buffer = { workspace = true }    # rlib only; cdylib loaded via subsys-driver-loader (SP03)
reovim-subsys-layout = { workspace = true }
reovim-subsys-vfs = { workspace = true }
reovim-driver-text-input = { workspace = true }     # trait-redesign deferred to #774
reovim-driver-command = { workspace = true }        # trait-redesign deferred to #774
reovim-driver-text-session = { workspace = true }   # trait-redesign deferred to #774

# Dependency resolution for module init ordering (#582)
reovim-depgraph = { workspace = true }

# Module configuration for user enable/disable and per-module settings (#586)
reovim-subsys-module-config = { workspace = true }

# Dynamic module loading — external .so modules (#587)
reovim-subsys-module-loader = { workspace = true }

# Wave 3a — package-manager-aware lazy load
reovim-dylib-loader = { workspace = true }
reovim-pkg-lazyload = { path = "../../lib/pkg-lazyload", version = "0.15.0-dev" }
reovim-pkg-manifest = { path = "../../lib/pkg-manifest", version = "0.15.0-dev" }
reovim-pkg-runtime-loader = { workspace = true }
reovim-subsys-command = { workspace = true }

# Module distribution registry — install/remove/update third-party modules (#621)
reovim-subsys-module-registry = { workspace = true }

# Syntax driver (for SyntaxFactoryStore registry extraction)
reovim-driver-text-syntax = { workspace = true }    # trait-redesign deferred to #774
reovim-provider-text = { workspace = true }

# Display registry (server-tier theme/gutter/statusline contracts; Style-free).
# Replaces the prior compile-time dep on the client-tier `reovim-driver-display`
# (closed in #775 via the Path 3d construction inversion).
reovim-driver-display-registry = { workspace = true }

# CLI
clap = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full"] }
tonic = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json"] }
tracing-appender = { workspace = true }

# Sync primitives for KernelContext
parking_lot = { workspace = true }

[dev-dependencies]
reovim-pkg-lockfile = { path = "../../lib/pkg-lockfile", version = "0.15.0-dev" }
tempfile = "3"

[lints]
workspace = true
