[package]
name = "reovim-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "reovim standalone server binary — composition root (AL1, #797 Phase 4)"
publish = false

[[bin]]
name = "reovim-server"
path = "src/main.rs"
test = false
bench = false
doctest = false

[dependencies]
# POSIX provider: builds + installs the kabi/platform vtable (SP02). The
# composition root owns the install call, so the provider dep lives here, not in
# arch (arch carries no edge to the provider — that would close a cycle).
reovim-platform-linux-native = { path = "../../platform/linux-native" }
# Heap-DS algorithms (Shared).
reovim-lib-ds    = { path = "../../lib/ds" }
reovim-kernel    = { path = "../../editor/lib/kernel" }
reovim-server-rt = { path = "../../editor/lib/server" }
# World system-kernel bridge. The composition root obtains up-face panic/log
# control implementations here and passes them into editor-kernel LauncherArgs.
reovim-system-kernel = { path = "../../system/lib/kernel" }
# Text Domain (ext crate; only composition roots link it — core/ext boundary).
reovim-domain-text = { path = "../../editor/domains/text" }
reovim-uapi        = { path = "../../uapi" }

# The per-target language floor (SP03): supplies `_start`, the `entry!` shim
# (`reovim_arch_main`), the `#[panic_handler]`, `rust_eh_personality`, and the
# `mem` intrinsics as LINK symbols. Each target cfg names its real floor crate
# directly (a single dep key cannot map to different source paths across target
# blocks — Cargo rejects that), and the call site picks the active one with a
# cfg-gated `use <floor_crate>::entry;` import (mirrors how `arch/Cargo.toml`
# target-cfg-splits its four `arch-sys-*` deps). `arch` carries NO floor edge —
# that would close the floor→product airlock (invariant #8); the composition
# root owns the floor link. This app is host-only (Linux), so only the two Linux
# floor crates are linked.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
reovim-arch-floor-linux-x86-64 = { path = "../../arch/floor-linux-x86-64", features = ["runtime"] }

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
reovim-arch-floor-linux-aarch64 = { path = "../../arch/floor-linux-aarch64", features = ["runtime"] }

[lints]
workspace = true
