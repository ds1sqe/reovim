[package]
name = "reovim-app"
version = "0.9.3-dev"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Reovim - the new architecture binary"
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "reovim-new"
path = "src/main.rs"

[features]
default = []
grpc = ["reovim-server/grpc"]

[dependencies]
# Server crate
reovim-server = { workspace = true }

# CLI
clap = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
