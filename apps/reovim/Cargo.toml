[package]
name = "reovim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "reovim launcher — subprocess UDS composition root (#797 Phase 4)"
publish = false

[[bin]]
name = "reovim"
path = "src/main.rs"
test = false
bench = false
doctest = false

[dependencies]
# `runtime` provides _start, panic_handler, allocator lang items.
# All other crates propagate `runtime` via `reovim-arch/runtime`; enabling it
# here once unifies them all at the composition root.
reovim-arch         = { path = "../../arch", features = ["runtime"] }
# Heap-DS algorithms (Shared) relocated from `reovim_arch::ds` (SP03).
reovim-lib-ds       = { path = "../../lib/ds" }
# TUI platform runtime.
reovim-platform-tui = { path = "../../ext/client/platforms/tui" }
# Server-side kernel + runtime.
reovim-kernel       = { path = "../../server/lib/kernel" }
reovim-server-rt    = { path = "../../server/lib/server" }
# Text Domain (ext crate; only composition roots link it — core/ext boundary).
reovim-domain-text  = { path = "../../ext/server/domain/text" }
# uapi types needed to resolve socket path.
reovim-uapi-abi     = { path = "../../uapi/abi" }

[lints]
workspace = true
