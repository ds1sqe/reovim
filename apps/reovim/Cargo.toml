[package]
name = "reovim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[[bin]]
name = "reovim"
path = "src/main.rs"
required-features = ["std"]

[features]
# On by default; the portable check turns it off so the workspace-wide
# feature set stays no_std there.
default = ["std"]
std = ["reovim-host/std"]

[dependencies]
reovim-client = { path = "../../clients/core" }
reovim-client-api = { path = "../../clients/core/api" }
reovim-client-sh = { path = "../../clients/sh" }
reovim-client-tui = { path = "../../clients/tui" }
reovim-plugin-cli = { path = "../../plugins/cli" }
reovim-plugin-explorer = { path = "../../plugins/explorer" }
reovim-plugin-vim = { path = "../../plugins/vim" }
reovim-host = { path = "../../host/os" }
reovim-kernel-abi = { path = "../../kernel/abi" }
reovim-kernel-interface = { path = "../../kernel/interface" }
reovim-kernel-runtime = { path = "../../kernel/runtime" }
reovim-module-coreutils = { path = "../../modules/coreutils" }
reovim-module-text = { path = "../../modules/text" }
reovim-module-fs = { path = "../../modules/fs" }
reovim-sdk = { path = "../../sdk/rust" }
reovim-module-sysutils = { path = "../../modules/sysutils" }

[lints]
workspace = true
